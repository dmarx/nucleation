# Luria configuration for nucleation.
#
# Nucleation is the catchall companion to the Anthology of the SOTA
# (dmarx/anthology-of-the-sota): it holds reading whose subject no anthology
# topic can hold, so that "out of scope there" never means "unrecorded". The
# scheme definitions for LIT, NOTE and THEORY are ported from the anthology's
# own config, so a work can move between the two records without being
# re-shaped. What is dropped is the anthology's product — SOTA practices and
# their consensus vocabulary — because most of what lands here carries no
# instruction for anyone to follow. See ADR-001.
#
# The ANTH remote lets a document here cite one there: ANTH-LIT-123,
# ANTH-THEORY-45. Codes are not shared across the two records; the prefix is
# what keeps LIT-001 here from being LIT-001 there.
vocabularies:
  topics:
    label: Topics
    blurb: 'What a work is about. Nucleation holds what the Anthology of the SOTA does not: reading whose
      subject no anthology topic can hold. The words are seeded from the clusters the reading-time triage
      of 2026-09-25 found, and grow by decision.'
    alert: Closed so that every tag is one somebody chose and blurbed, not because the list is finished.
      If a work wants a word this list lacks, add it with a label, a blurb and a decision. If a work fits
      an anthology topic, it belongs in the anthology, not here.
    terms:
      quantum-foundations:
        label: Quantum foundations
        blurb: what quantum theory says about the world — contextuality, epistemic restrictions, interference,
          reconstructions and toy theories, quantum thermodynamics
      contextuality:
        label: Contextuality
        blurb: 'whether outcomes can be explained without reference to the context of measurement — Kochen–Specker and Bell contextuality and their sheaf-theoretic form, generalized (Spekkens) contextuality, noncontextual models and their limits, and contextuality outside physics'
      mathematics:
        label: Mathematics
        blurb: mathematics read for itself — category theory, topoi and sheaves, spectral geometry, set
          and measure theory — including mathematical frameworks applied to other fields
      game-theory:
        label: Game theory
        blurb: 'strategic interaction and its equilibria — evolutionary stability, repeated games, bargaining, coordination, signalling and conventions — in biology, economics and philosophy (ADR-019)'
      network-science:
        label: Network science
        blurb: the structure and dynamics of networks — dimension, curvature and Ricci flow, community
          detection, consensus and synchronization
      complex-systems:
        label: Complex systems
        blurb: emergence, information decomposition, individuality, self-organization — how collective
          behaviour arises from parts
      probabilistic-modeling:
        label: Probabilistic modeling
        blurb: Bayesian inference and statistical models outside deep learning — nonparametric priors,
          topic models, samplers
      neuroscience:
        label: Neuroscience
        blurb: brains and nervous systems — representation, coding and dynamics measured in biological
          tissue
      natural-sciences:
        label: Natural sciences
        blurb: physics, astronomy, planetary and earth science, chemistry, biology and medicine read outside
          any machine-learning claim
      thermodynamics:
        label: Thermodynamics
        blurb: 'the second law and its extensions read for themselves — entropy and entropy production, irreversibility, nonequilibrium steady states and their stability, dissipative structures, fluctuation theorems and stochastic thermodynamics, and the thermodynamics of computation and of life (ADR-020)'
      operations-research:
        label: Operations research
        blurb: optimization of real systems — routing, scheduling, facility location, combinatorial algorithms
      society-and-governance:
        label: Society and governance
        blurb: law, politics, policy, security and institutions — court records, doctrine, democratic
          theory, information operations
      information-theory:
        label: Information theory
        blurb: 'entropy, channels, coding and capacity read for themselves — including information-theoretic accounts of work, memory and inference outside machine learning'
      representation-learning:
        label: Representation learning
        blurb: 'how learned systems come to represent their data — self-supervised and contrastive objectives, spectral embeddings, information bottlenecks, knowledge-graph embeddings, and whether representations converge'
      learning-theory:
        label: Learning theory
        blurb: 'why learning generalizes — compression and description length, Kolmogorov complexity and sufficient statistics, rate–distortion and PAC-style bounds, model selection'
      information-retrieval:
        label: Information retrieval
        blurb: 'finding what is relevant to a need — document and query representation, relevance and aboutness, ranking and feedback, and the geometric, probabilistic and logical models of retrieval'
      social-science:
        label: Social science
        blurb: 'economics, psychology, anthropology and sociology — empirical and theoretical work on people and societies that is not law or policy'
      linguistics:
        label: Linguistics
        blurb: 'the study of language itself — morphology, lexicalism, word segmentation, syntax and semantics as linguists pose them, not as models encode them'
      metaphysics:
        label: Metaphysics
        blurb: 'what exists and what it is to exist — causation, emergence and levels, laws, time — as a philosophical question (group: philosophy)'
      mereology:
        label: Mereology
        blurb: 'parts and wholes — composition, individuation of systems and collectives (group: philosophy)'
      agency:
        label: Agency
        blurb: 'what it is to be an agent — goals, action, control and the capacity to act — in organisms, collectives or machines. An agent is not thereby an individual, a self or a person (ADR-024); how an agent''s behaviour is integrated is behavioral-integration, and governing oneself by one''s own standards is self-governance (group: philosophy)'
      individuation:
        label: Individuation
        blurb: 'what makes something one thing, and the same thing over time or across descriptions — individuation, numerical identity and diversity, individuality and persistence of things of any kind, biological individuality and organisational closure. Selves are self and persons are personhood (group: philosophy; ADR-015, ADR-024)'
      self:
        label: Self
        blurb: 'what a self is — the minimal, bodily and pre-reflective self, self-models and the sense of being a subject, the self as process or as context, and whether machines or groups can be selves. Not the person, which is personhood (group: philosophy; ADR-024)'
      personhood:
        label: Personhood
        blurb: 'what a person is and what makes one persist — personal identity over time, psychological continuity and what matters in survival, persons as bearers of reasons, rights and responsibility. Not the self, which is self (group: philosophy; ADR-024)'
      behavioral-integration:
        label: Behavioral integration
        blurb: 'how an organism''s many control systems come to act as one — action selection and competition between systems (habitual and goal-directed, automatic and willed), hierarchical and feedback control, intertemporal conflict and self-control, and evidence accumulation to a decision. One of four unities kept apart (ADR-024)'
      phenomenal-unity:
        label: Phenomenal unity
        blurb: 'the unity of experience — what makes simultaneous experiences one subject''s, and how a self-model or a perspective binds them. One of four unities kept apart (group: philosophy; ADR-024)'
      narrative-unity:
        label: Narrative unity
        blurb: 'the unity a life has as a story — narrative identity, the narrative self, autobiographical reasoning, and the claim and counter-claim that a self is the story told of it. One of four unities kept apart (group: philosophy; ADR-024)'
      self-governance:
        label: Self-governance
        blurb: 'governing oneself by standards that are one''s own — identification and wholeheartedness, planning agency and policies, self-constitution, autonomy and authenticity, and the empirical psychology of self-endorsed motives. One of four unities kept apart (group: philosophy; ADR-024)'
      phenomenology:
        label: Phenomenology
        blurb: 'the first-person description of experience as a method — the philosophical tradition (Husserl, Heidegger, Merleau-Ponty), its use in the sciences of mind, and the theories that take their data from it (group: philosophy; ADR-016)'
      social-ontology:
        label: Social ontology
        blurb: 'what social facts, groups, institutions and social kinds are, and what makes them exist — collective intentionality, joint commitment, status functions, convention, social construction, and whether groups can be agents or minds (group: philosophy; ADR-017)'
      moral-psychology:
        label: Moral psychology
        blurb: 'morality as a natural phenomenon — moral judgement, emotion and norms, and their evolution, development and variation across cultures; descriptive, where ethics is normative (group: philosophy; ADR-018)'
      psychopathology-and-treatment:
        label: Psychopathology and treatment
        blurb: 'what a mental disorder is and how psychological treatment changes it — medical models of illness (biomedical, biopsychosocial, network), the philosophy of psychiatry, functional and transdiagnostic accounts of psychopathology such as experiential avoidance and psychological flexibility, and psychotherapies and their mechanisms of change (ADR-021)'
      motivation:
        label: Motivation
        blurb: 'why organisms act and persist — intrinsic and extrinsic motivation, needs, goals and values, the internalization of regulation, and the difference between autonomous and controlled motives; the empirical counterpart of the philosophy of autonomy under `agency` (ADR-023)'
      well-being:
        label: Well-being
        blurb: 'how well a life goes for the one living it, as psychology measures it — subjective and eudaimonic well-being, flourishing, vitality and meaning in life, and what predicts them (ADR-025)'
      learning-and-conditioning:
        label: Learning and conditioning
        blurb: 'how organisms learn from contingencies and consequences — Pavlovian and instrumental conditioning, reinforcement and reward learning in brains, habit and goal-directed control, behaviour analysis and relational responding. Not machine learning, which is learning-theory or the anthology (ADR-025)'
      psychometrics:
        label: Psychometrics
        blurb: 'measuring minds — scales, reliability and validity, latent-variable and network models of psychological constructs, and model-based estimation of cognitive parameters (ADR-025)'
      philosophy-of-biology:
        label: Philosophy of biology
        blurb: 'what life, organisms and biological functions are — teleology and function, organisation and closure, biological individuality and autonomy, and the demarcation of the living (group: philosophy; ADR-025)'
      embodied-cognition:
        label: Embodied cognition
        blurb: 'cognition as embodied, embedded, enacted or extended — enactivism and sense-making, coordination dynamics, situated robotics, and mind as organism–environment coupling (group: philosophy; ADR-025)'
      free-will:
        label: Free will
        blurb: 'free will and volition, as philosophy and as science — compatibilism and its rivals, manipulation and responsibility, and the neuroscience of voluntary action such as the readiness potential (group: philosophy; ADR-025)'
      model-comparison:
        label: Model comparison
        blurb: 'choosing between models by their evidence — the marginal likelihood and Bayes factors, the Savage–Dickey density ratio for nested models, Occam factors and the evidence framework, Bayesian model reduction and structure learning, and information criteria and free energies for singular models (ADR-026)'
      information-geometry:
        label: Information geometry
        blurb: 'the geometry of statistical models — the Fisher information as a metric, natural gradient, curvature and its Kronecker and block structure, and the spectra of Fisher and Hessian matrices in learned models (ADR-026)'
      ethics:
        label: Ethics
        blurb: 'moral philosophy — what is owed, permitted or good — including applied ethics of technology and institutions (group: philosophy)'
      consciousness:
        label: Consciousness
        blurb: 'experience and its theories — phenomenal consciousness, its measures and its attribution to animals or machines (group: philosophy)'
      cognition:
        label: Cognition
        blurb: 'the mind as information processing — perception, memory, reasoning and cognitive strategies — as studied by cognitive science and philosophy of mind (group: philosophy)'
      emotion-and-affect:
        label: Emotion and affect
        blurb: 'emotions, feelings and affect — what they are, their bodily and neural basis (including the homeostatic and interoceptive states feelings are said to report), their role in decision, memory and behaviour, and whether they ground consciousness (group: philosophy; ADR-014)'
      philosophy-of-science:
        label: Philosophy of science
        blurb: 'what science is and what its theories say about the world — realism and structural realism, explanation, causation and evidence, the interpretation of physical theories (group: philosophy)'
      epistemology:
        label: Epistemology
        blurb: 'knowledge, belief and evidence — justification and rational credence, the value of knowledge, testimony, trust and expertise, and social and inductive-risk questions about evidence (group: philosophy)'
      logic:
        label: Logic
        blurb: 'valid inference and its formal theories — propositional and model-theoretic structures, proof and consequence, and inferentialist accounts of meaning (group: philosophy)'
      philosophy-of-mathematics:
        label: Philosophy of mathematics
        blurb: 'what mathematics is about and how we know it — mathematical structuralism and ontology, the nature of proof and construction, and its history from Descartes to Kant and after (group: philosophy)'
      philosophy-of-language:
        label: Philosophy of language
        blurb: 'meaning, content and reference as philosophy poses them — theories of meaning, meaning holism, assertion and whether machines assert, and conceptual change (group: philosophy)'
      religion:
        label: Religion
        blurb: 'religion as a subject — its relation to science, religious belief and practice, and how religious practitioners are treated'
      anthology-candidate:
        label: Anthology candidate
        blurb: 'a curation flag, not a subject — somebody judged this work may belong in the Anthology of the SOTA; it stays here until a transfer is decided, and is never a primary topic (ADR-005; group: flags)'
  lit-statuses:
    label: Paper statuses
    blurb: 'A work''s standing in this record: whether it is worth reading. Not whether its findings are
      true — that is the THEORY scheme''s business, and the two can disagree in either direction.'
    alert: Closed. If the word you want means "this work's account has been overturned", that is a status
      on a THEORY, not on the work.
    terms:
      Active:
        label: In the anthology
        blurb: worth reading, whether or not an account was drawn from it
      Proposed:
        label: Watching
        blurb: promising and unproven; the note says what would settle it
      Deferred:
        label: Unreviewed
        blurb: in the corpus, not yet read closely enough to place
      Superseded:
        label: Superseded
        blurb: later work covers this better, and the note names it
      Rejected:
        label: Attic
        blurb: retired with a reason — too narrow, too theoretical, or simply not interesting enough to
          carry
  note-statuses:
    label: Reading statuses
    blurb: 'How deeply the paper was READ — not whether it is any good, which is `lit-statuses`. The two
      disagree in every direction: a foundational paper can carry a `Skimmed` note, and a paper in the
      attic can carry a `Read` one, since reading it carefully is often how it got there (ADR-025).'
    alert: 'Closed, and the value you want may be no note at all. **The absence of a NOTE means the paper
      is unread** — a note is written when somebody finishes a paper, so a LIT with no NOTE already says
      "nobody has reached this", and filing two hundred `Unread` stubs would buy a row in a table. `Unread`
      is for the case absence cannot cover: a deliberate judgement that a paper was looked at and set
      aside.'
    terms:
      Read:
        label: Read
        blurb: the full text, closely enough to state its assumptions and results exactly — the only status
          that licenses a claims table
      Skimmed:
        label: Skimmed
        blurb: abstract, figures and selected sections; honest, useful, and explicitly not enough to source
          a practice from
      Unread:
        label: Unread
        blurb: looked at and deliberately set aside — a human judgement, not a backlog entry. A paper
          nobody has reached simply has no note (ADR-025)
      Superseded:
        label: Re-read
        blurb: a later reading replaced this one, and names it
  theory-statuses:
    label: Explanation statuses
    blurb: Whether the record believes the ACCOUNT, which is not what the same word means on a practice.
      An explanation can be `Rejected` while the thing it explained goes on working exactly as well as
      it ever did (ADR-031).
    alert: Closed. `Rejected` here means the reason is wrong, not the technique; if what you want to retire
      is the technique, that is a status on the practice.
    terms:
      Active:
        label: The current account
        blurb: the best explanation the record holds for why this happens
      Proposed:
        label: Offered
        blurb: stated and plausible, on evidence that is suggestive rather than settling — the document
          says what would settle it
      Deferred:
        label: Not yet judged
        blurb: filed because the question is real; no position taken on the answer
      Rejected:
        label: Disbelieved
        blurb: tested and failed, or contradicted by later work — and the thing it explained may still
          work perfectly well
      Superseded:
        label: Replaced
        blurb: a later account covers the same ground better, and this one names it
  statuses:
    Active:
      blurb: in force — the current answer, and what a citation should normally point at
    Proposed:
      blurb: not in force yet — an open question, so citing it as settled is the thing the report catches
    Deferred:
      blurb: not in force and not being worked on; the question is real and the answer is waiting on something
    Superseded:
      blurb: no longer in force because something replaced it; the successor is named in the field, not
        the prose
    Rejected:
      blurb: no longer in force and nothing replaced it — kept because a rejection is worth being able
        to point at
  adr-tags:
    label: Decision tags
    blurb: 'What a decision is about, in the order the index shows them. Open, unlike the topics: a decision
      that needs a word it does not have simply gets one.'
    terms:
      record:
        label: The record
        blurb: what the schemes hold, and the rules between them
      taxonomy:
        label: Taxonomy
        blurb: the topic vocabulary and what enforces it
      mechanism:
        label: Mechanism
        blurb: identifiers, generation, the lint
      migration:
        label: Migration
        blurb: what moves between this record and the Anthology of the SOTA, and why
issue_url: https://github.com/dmarx/nucleation/issues/{n}
paths:
  docs: docs
  decisions: record/decisions.d
  design_principles: docs/design-principles.md
  reports: docs/reports
schemes:
  LIT:
    dir: record/literature.d
    output: docs/literature
    active: Active
    render: index
    allocate: merge
    alias: LIT-{first_author}-{published:.4}-{number:03d}
    field_groups:
      source:
        fields:
        - arxiv
        - doi
        - url
        require: at-least-one
        unique: true
    references:
      extends:
        label: Carries further
        blurb: the earlier paper this one builds on and could not stand without. Papers fork where the
          DESIGNS differ, practices where the RECOMMENDATIONS do, so a fork can exist at one layer and
          not the other (ADR-011).
        scheme: LIT
        required: false
        many: true
        converse: extended_by
      extended_by:
        label: Carried further by
        blurb: the converse of `extends`, written by `luria link --fix`.
        scheme: LIT
        required: false
        many: true
        converse: extends
      compared_against:
        label: Measured against
        blurb: this paper evaluated itself against that one. Somebody ran the comparison; a shared topic
          is not one (ADR-011).
        scheme: LIT
        required: false
        many: true
        converse: compared_against
      corrects:
        label: Corrects
        blurb: this paper shows the earlier one wrong on something it claimed. Retire by status, never
          by deletion — the body stays.
        scheme: LIT
        required: false
        many: true
        converse: corrected_by
      rivals:
        label: Rival account
        blurb: this paper argues for an account of the same phenomenon that the other paper's account
          excludes, and neither tests or corrects the other. Settled, it becomes `corrects` on the
          winner (ADR-022).
        scheme: LIT
        required: false
        many: true
        converse: rivals
      corrected_by:
        label: Corrected by
        blurb: the converse of `corrects`, written by `luria link --fix`.
        scheme: LIT
        required: false
        many: true
        converse: corrects
    fields:
      published:
        required: true
      primary_topic:
        derive: '{tags[0]}'
      status:
        vocabulary: lit-statuses
      tags:
        vocabulary: topics
        many: true
        required: true
        closed: true
        groups:
          philosophy:
            label: Philosophy
            blurb: the topics that are philosophical questions — metaphysics, mereology, agency, individuation, ethics, consciousness, cognition, emotion and affect, self, personhood, phenomenal unity, narrative unity, self-governance, philosophy of biology, embodied cognition, free will, phenomenology, social ontology, moral psychology, philosophy of science, epistemology, logic, philosophy of mathematics and philosophy of language. A label over the words, not a rule about how they combine (ADR-003).
            require: any
            tags: [metaphysics, mereology, agency, individuation, ethics, consciousness, cognition, emotion-and-affect, self, personhood, phenomenal-unity, narrative-unity, self-governance, philosophy-of-biology, embodied-cognition, free-will, phenomenology, social-ontology, moral-psychology, philosophy-of-science, epistemology, logic, philosophy-of-mathematics, philosophy-of-language]
          flags:
            label: Curation flags
            blurb: tags that mark a work for a curation decision rather than say what it is about. Carried after the topics, never first (ADR-005).
            require: any
            tags: [anthology-candidate]
    axis: tags
  NOTE:
    dir: record/notes.d
    output: docs/notes
    active: Read
    render: index
    allocate: merge
    uniform_ok: absence of a NOTE means unread (ADR-025), so every filed note is a finished reading; `Unread`
      is reserved for a paper deliberately set aside
    references:
      paper:
        label: Reading of
        blurb: the paper this note is a close reading of. Absence of a note means the paper is unread
          (ADR-025).
        scheme: LIT
        required: true
        many: false
    fields:
      status:
        vocabulary: note-statuses
      published:
        derive: '{published}'
        from: paper
      primary_topic:
        derive: '{tags[0]}'
        from: paper
      tags:
        derive: '{tags}'
        from: paper
        many: true
    axis: tags
  THEORY:
    dir: record/theory.d
    output: docs/theory
    active: Active
    render: index
    allocate: merge
    references:
      source:
        label: Evidence
        blurb: 'the work this account comes from. Same test as a practice''s: what the explanation could
          not survive losing.'
        scheme: LIT
        required: true
        many: true
      extends:
        label: Carries further
        blurb: the earlier account this one builds on — a refinement or a widening of the same mechanism,
          not a rival one.
        scheme: THEORY
        required: false
        many: true
        converse: extended_by
      extended_by:
        label: Carried further by
        blurb: the converse of `extends`, written by `luria link --fix`.
        scheme: THEORY
        required: false
        many: true
        converse: extends
      rivals:
        label: Rival account
        blurb: another account of the same phenomenon that cannot also be right, where neither yet corrects
          the other. Settled, it becomes `corrects` on the winner and a status on the loser (ADR-022).
        scheme: THEORY
        required: false
        many: true
        converse: rivals
      corrects:
        label: Corrects
        blurb: this account replaces the earlier one's reasoning. What the old account explained may still
          happen; only the reason was wrong.
        scheme: THEORY
        required: false
        many: true
        converse: corrected_by
      corrected_by:
        label: Corrected by
        blurb: the converse of `corrects`, written by `luria link --fix`.
        scheme: THEORY
        required: false
        many: true
        converse: corrects
    fields:
      promote_when:
        required_when:
          status:
          - Proposed
          - Deferred
      status:
        vocabulary: theory-statuses
      primary_topic:
        derive: '{tags[0]}'
      published:
        derive: '{published}'
        from: source[0]
      tags:
        vocabulary: topics
        many: true
        required: true
        closed: true
    axis: tags
  ADR:
    dir: record/decisions.d
    output: docs/decisions
    active: Active
    render: index
    successor: superseded_by
    retires_on: Superseded
    fields:
      status:
        vocabulary: statuses
      tags:
        vocabulary: adr-tags
        many: true
        required: true
        closed: false
    axis: tags
  DP:
    dir: record/principles.d
    active: Active
    render: document
    output: docs/design-principles.md
    successor: superseded_by
    retires_on: Superseded
    fields:
      status:
        vocabulary: statuses
      tags:
        many: true
        required: true
        closed: false
    axis: tags
remotes:
  ARXIV:
    name: arXiv
    uid: (\d{4})[.:](\d{4,5})(v\d+)?
    url: https://arxiv.org/abs/{1}.{2}
    uris:
      title: https://export.arxiv.org/api/query?id_list={1}.{2}
    title_re: <entry>.*?<title>(.*?)</title>
  DOI:
    name: DOI
    uid: 10\.\d{4,9}/[^\s\]\)>,;]+
    delim: ':'
    url: https://doi.org/{uid}
  ANTH:
    name: Anthology of the SOTA
    repo: dmarx/anthology-of-the-sota
    ref: main
    dir: record/literature.d
    schemes:
      LIT:
        dir: record/literature.d
      SOTA:
        dir: record/practices.d
      THEORY:
        dir: record/theory.d
      ADR:
        dir: record/decisions.d
  LU:
    name: luria
    repo: dmarx/luria
    ref: main
    dir: record/decisions.d
    schemes:
      DP:
        document: docs/design-principles.md
  FX:
    name: fixtures
    url: https://github.com/dmarx/luria/blob/main/docs/directives.md#fixture-codes
fragments:
  record/changelog.d: CHANGELOG.md
journals:
  curation:
    dir: record/curation.d
    output: docs/curation
    granularity: month
    title: Curation log
    blurb: Why things entered this record, and why they left for the anthology or anywhere else.
  devlog:
    dir: record/devlog.d
    output: docs/devlog
    granularity: month
    title: Development log
code:
  globs: []
  historical:
  - CHANGELOG.md
lint:
  fail_on:
  - workflow-temp-codes
  - source-mismatch
  mute:
  - inert-status
  - acknowledged-uniformity
chains:
  lineage:
    scheme: LIT
    relation:
    - extends
    - corrects
    sibling: compared_against
    invariant: tags
    output: docs/lineage.md
    title: Lines of work
  theory:
    scheme: THEORY
    relation:
    - extends
    - corrects
    invariant: tags
    output: docs/theory-lines.md
    title: Lines of explanation
    facet_by:
    - status
