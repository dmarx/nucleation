blockers:
  - "THEORY-481 states the finite-N per-mode logistic dynamics, the per-mode conservation law and s^∞_α = ((N+1)s_α + Tr S)/N as exact under its assumptions. They follow from an invalid commutation in the source. Correct the title and body first: exact as N → ∞; exact at finite N for isotropic inputs with equal modes; otherwise modes couple at order 1/N, and only the global conservation law holds."
notes: >-
  This is the first wave-3 review where checking a source's derivation
  found an error in the source, not in the record's reading of it. The
  NOTE was honest about which step it did not re-derive, and that step is
  where the error is. A NOTE history line saying "followed as statements,
  not re-derived" is the place to look, and the step it names is where to
  re-derive first. After correction the entry has a clean
  narrow-and-promote path: the title becomes the N → ∞ statement plus the
  isotropic finite-N case. The promote_when about reaching alignment moves
  to a QUESTION, since the title assumes alignment. That needs its own
  review after the correction merges, because a correction PR should not
  also change status. Rubric: depth scored 2 from "read in full", but the
  NOTE's own history marks the decisive step as not re-derived, so depth
  should be scored per claim, not per NOTE. Bundling 2 and extends 1 were
  real but not what decided this. CLAIM-118 uses only "learned on its own
  slow, logistic timescale", which survives as the N → ∞ statement and as
  an approximation.
