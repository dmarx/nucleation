scope:
  accepted: >-
    The entropy and mutual-information bridges, re-derived here (ADR-047
    v2) from two textbook facts: m, the universal lower-semicomputable
    semimeasure, dominates every computable mass function f up to
    2^(-K(f)) (m(x) >= c 2^(-K(f)) f(x)), and Levin's coding theorem
    K(x) = -log m(x) + O(1).

    Entropy (Theorem 2.10). K is a prefix-free code length, so Kraft gives
    sum_x 2^(-K(x)) <= 1 and the noiseless coding theorem gives
    E_f K(x) >= H(f). Domination plus the coding theorem give pointwise
    K(x) <= log 1/f(x) + K(f) + O(1); taking the f-expectation,
    E_f K(x) <= H(f) + K(f) + O(1). The upper gap is attained up to O(1)
    by a point mass on one string x0: H = 0, E K = K(x0), and
    K(f) = K(x0) + O(1).

    Mutual information (Theorem 3.6). With I(x:y) = K(x) + K(y) - K(x,y),
    apply the entropy bounds to the joint f and to its two marginals, whose
    complexities are at most K(f) + O(1):
    E I(x:y) >= H(X) + H(Y) - [H(X,Y) + K(f)] - O(1) = I(X;Y) - K(f) - O(1),
    and E I(x:y) <= [H(X) + K(f)] + [H(Y) + K(f)] - H(X,Y) + O(1)
    = I(X;Y) + 2K(f) + O(1). This is the paper's bracket to within O(1).
  excluded: >-
    The distortion-rate clause (Theorem 6.27). Its right-hand step, which
    identifies h_x(mR) with the radius of x's sphere in a canonical cover,
