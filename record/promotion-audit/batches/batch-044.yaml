    A re-derivation can find the title wrong as well as unproved. In
    THEORY-585 the source asserts the failure and the record had hedged
    it; proving it showed the failure set is decided by a context's
    projections (support on the first factor), not by whether the context
    factorises, so the "only on V₁⊗ℂ1" clause was false (Bell-basis
    contexts agree). Correct the title to what was proved, then promote.
  - >-
