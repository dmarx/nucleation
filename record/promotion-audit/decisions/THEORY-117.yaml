scope:
  accepted: >-
    Empirical half (ADR-047 v3). One study, Uselis, Dittadi & Oh (2025),
    Sections 1-6 read in full in NOTE-525, whose text states what the title
    uses: with n = 3, k = 1, training sets of 7,500 to 30,000 images (to
    120,000 on dSprites and FSprites) leave "accuracy drops of 60-80% on
    unseen combinations" (Figure 4); raising n or k raises unseen accuracy,
    above 90% on most datasets at high coverage (Figures 3, 5). Every
    from-scratch number is the best checkpoint as scored on the unseen
    pairs (oracle selection, Section 3), so the title must say so.

    Theoretical half, re-derived (ADR-047 v2), without the span condition.
    Exact linear factorization: z(i,j) = a_i + b_j. Let G be the bipartite
    graph on value-nodes {a_1..a_n, b_1..b_n} with an edge for each seen
    pair. Claim: if G is connected, every z(i,j) is a fixed linear
    combination of the seen embeddings. Proof: a path a_i = u_0, u_1, ...,
    u_{2m+1} = b_j in G alternates sides, so its edges' embeddings sum with
    alternating signs to a_i + b_j (each interior node enters once with +
    and once with -). Hence z(i,j) = sum_t (-1)^t z(e_t). The cycle in
    Proposition B.7's proof, edges (i,i), (i,i+1), (n,1), is a single
    2n-cycle b_1 a_1 b_2 a_2 ... a_n b_1 through every node, so k = 2 so
    arranged connects G. Without connection the claim fails: on a
    disconnected G, adding c to every a and subtracting c from every b in
    one component fixes all seen sums and changes cross-component sums.
    k = 1 is a matching of n edges on 2n nodes, never connected for n >= 2.
  excluded: >-
    "Compositional generalization comes from diversity of combinations, not
    data volume" as a general cause: the volume test is one architecture,
    n = 3, k = 1, up to 4x (16x on two datasets), with oracle selection.
    The classifier half of Proposition 4.1 (a linear readout correct on
    every unseen pair, which is where the 2n - 1 span condition enters) is
    not re-derived and not claimed; the title claims only that the unseen
    embeddings are determined. Approximate factorization is open.
