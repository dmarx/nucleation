    prior. The knowledge-graph model's first term is a floor in r, and
    the body itself says "not about natural languages". The promote_when
    asks for the bound outside those models, so a narrowed title would be
    met by the models' own proofs. (2) Those proofs were not checked.
    NOTE-804's history says that of the long proofs in B.2, C (the
