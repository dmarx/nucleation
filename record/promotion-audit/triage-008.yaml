    suggested_promote_when: 'A result that separates the number of examples a deep network needs from
      the counting of the grammar, by moving the input–label correlations while n_c, m and L stay fixed:
      for instance, non-uniform production probabilities that make some tuples'' class statistics detectable
      earlier than others, with the training-set sizes at which each level becomes synonym-invariant,
