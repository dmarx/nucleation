scope:
  accepted: >-
    The warrant is right. The claim's conclusion is methodological
    ("pragmatic identity and fidelity should be defined on observable
    responses before any equivalence of internal states is assumed").
    Its premise, that different hidden-state models can produce
    identical observations, is the familiar non-identifiability of
    latent models. A defeater that shows internal states identifiable
    and more predictive is the right kind of undercut for a
    recommendation, and nothing observed stands under it. ADR-043's
    pilot reads that as interpretive (its note on CLAIM-117).
  excluded: >-
    The premise on its own, which is demonstrated, not interpretive. It
    could be filed as a demonstrated CLAIM if a later claim needs to
    lean on it; nothing does now.
