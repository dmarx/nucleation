derivation: >-
  Checked step by step. Steps 1 and 3 hold as written. Steps 2 and 4 did
  not match the note's own definition (compatible relative to C iff some
  member of C carries D1 onto a description agreeing with D2): they applied
  the maps to both descriptions. Under the definition, the deterministic
  maps of a two-outcome space push (1/2, 1/2) only to (1/2, 1/2), (1, 0)
  or (0, 1), never to (1/3, 2/3), so "all maps" also obstructs and step 2
  fails as written. Repair: let C' be the stochastic maps of outcomes. The
  constant kernel K(·) = (1/3, 2/3) carries D1 to D2, so the pair is
  compatible relative to C' and obstructs relative to the bijections C,
  which is step 2. For step 4, on any single shared context the constant
  kernel onto D2 reconciles any D1, so relative to the stochastic maps
  every pair is compatible, which is what the proviso needs. With these
  repairs the four steps establish the title.
