scope:
  accepted: >-
    One small mathematical fact under the title's second clause, checked
    here. Take an edge-connectivity tangle with axioms T1–T3 (NOTE-814,
    Assumptions), and a vertex v of degree at least k. Orient every cut of
    order < k towards the side containing v. This satisfies T1. It
    satisfies T2, because small sides omit v, so no three of them cover V.
    It satisfies T3, because a big side {v} would need the cut ({v}, V − v)
    to have order deg v < k. So every vertex of degree ≥ k is an order-k
    tangle, in any graph, which is why single high-degree vertices appear.
    That such tangles show up as communities beside the real ones depends
    on the author's assignment rule.
  excluded: >-
    Both clauses as empirical claims about networks. "Matches network
    communities only where community structure is strongly delineated" is
    read by eye from eight points per panel (Fig. 4.31), with no fitted
    relation or uncertainty (NOTE-814 C2, moderate). It holds only at the
    low orders that could be computed, and the vertex sets come from one
    assignment rule. "Recur" is a frequency claim from a handful of
    networks (C4). The lemma above shows such tangles can exist. It does
    not show how often they matter.
evidence:
