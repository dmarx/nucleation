scope:
  accepted: >-
    What Vishne, Gerber, Knight and Deouell (2023, LIT-644, read in full in
    NOTE-499) measured: in subdural high-frequency activity (70-150 Hz)
    from 10 epilepsy patients viewing clearly visible images for 300 to
    1,500 ms with no report on analysed trials, category and exemplar
    information in ventral temporal cortex stayed decodable by a
    time-invariant population code for as long as the image was on (face
    vs watch AUC 99.8% over 100-900 ms; a square temporal-generalisation
    block; information ending about 230-450 ms after offset, tracking
    duration), while HFA fell 81.8% from peak by 800-900 ms; at the
    sampled prefrontal and parietal sites category decoding was real (peak
    AUC 84.1% and 86%) but confined to about 150-600 ms after onset, did
    not generalise across time and did not track duration. ADR-047 v3:
    one study read in full, numbers in the text, nothing in the record
    contradicting it.
  excluded: >-
    "In human ventral temporal cortex" without the method and sample;
    "for as long as it stays on" beyond 1.5 s; prefrontal and parietal
    content in general (the coverage was sparse and mostly right
    hemisphere, and the authors ask that the absence be read "with more
    caution than the presence"); bands other than HFA.
