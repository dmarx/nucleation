    "no independent, unanimous, non-dictatorial rule" claim in the record.
  - >-
    A general title can be false although its worked case is a theorem.
    "Interconnected propositions" fails on affine agendas, for example
    {p, q, p↔q}, where issue-wise parity is a non-dictatorial,
    independent, unanimous, robustly rational rule. When a THEORY states a
    social-choice impossibility for a vaguely named class, test it on an
    affine agenda before promoting the general wording.
