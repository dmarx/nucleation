finding: >-
  Wave 2's run of high yields ends here, and the cause is the class, not
  the candidates. Three of the five (THEORY-022, -191, -192) carry the
  "mathematics" tag but are empirical: an interpretability measurement
  and two Betti-curve studies. Neither has a mathematical core the record
