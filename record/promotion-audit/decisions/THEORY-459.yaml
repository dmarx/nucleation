scope:
  accepted: >-
    The argument was checked against the arXiv manuscript (2508.01616v1,
    §14.3.3, pp. 489–490, footnotes 57–58), fetched for this review.

    (1) What is proved. The only step proved is the reductive case for
    finite state spaces. A duality is a bijection, so the duals are
    equinumerous. A reductive linkage is a surjective, non-injective
    partial homomorphism. No map between equinumerous finite sets is both
    surjective and non-injective.

    (2) The irreducible case rests on a definitional move. The book says
    irreducible emergence requires that "no surjective map between the
    models exists", and footnote 58 says "no surjective linkage map". A
    linkage map is non-injective by definition, and between finite
    equinumerous sets no surjective non-injective map exists at all. So
    under footnote 58's reading the irreducibility condition holds
    automatically for finite duals. The exclusion goes through only if
    the duality, an injective map, counts as a reduction, which the main
    text asserts ("duality is a surjective, i.e. reductive, map"). That is
    a choice of definition, not a consequence of the stated ones.

    (3) The infinite case cannot be closed formally. On ℓ²(N), which is
    isomorphic to itself, the backward shift (x₁, x₂, …) ↦ (x₂, x₃, …) is
    linear, bounded, surjective and non-injective. So the counting
    argument fails for infinite state spaces, as footnote 57 concedes. The
    book's case there is a physical argument: regularize on a lattice,
    where the count is finite, and expect emergence before the continuum
    limit. Physical salience is what the shift example lacks, so it does
    not refute the account. It shows only that no proof from cardinality
    can meet the promote_when.
  excluded: >-
    Narrowing was considered and rejected. Cut to what is proved, the
    title becomes "a bijection between finite sets is not surjective and
    non-injective". That is a counting fact, and the substantive content,
    the irreducible and infinite cases, is the argued part. Batch 040's
    rule applies: when an argument's title, cut to what it establishes, is
    only its premise or a triviality, keep it Proposed. The "only when"
    list of three ways to combine (§14.3.4) is the authors' enumeration,
    not shown exhaustive.
