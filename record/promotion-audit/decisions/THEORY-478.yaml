notes: >-
  The narrowing moves the theorem's hypothesis from 'behaves like a tree
  heat kernel' to the two Hellinger bounds the proof actually uses, and
  ties the admissible α to their Hölder exponent. That makes the source's
  range and the reader's repaired range two instances of one statement,
  rather than a dispute. This is the batch-019 pattern: the overstated
  part was the hypothesis, not the mathematics. The finest-scale condition
  d ≥ c₀ 2^(−K/β) is new. The source sums to a finite K without stating it.
