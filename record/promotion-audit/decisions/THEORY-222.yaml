scope:
  accepted: >-
    The possibility clause, as an exact statement about effective
    information (EI) under the paper's definitions, re-derived here by
    construction (ADR-047 v2).

    EI of a known transition matrix is I(X; Y) with X set uniformly over
    the states at that level. Micro: four states, three of which (call
    them a, b, c) each move to one of a, b, c uniformly at random, while
    the fourth, d, moves to itself. With X uniform over the four,
    P(Y = a) = P(Y = b) = P(Y = c) = (3/4)(1/3) = 1/4 and P(Y = d) = 1/4,
    so H(Y) = 2 bits; H(Y | X) = (3/4) log₂ 3 ≈ 1.189 bits; EI_micro ≈
    0.811 bits. Macro: A = {a, b, c}, B = {d}, with A → A and B → B
    deterministically; with X uniform over the two macro states,
    EI_macro = 1 bit. So EI_macro − EI_micro ≈ 0.189 bits > 0, and the
    EI-maximizing description of this system is the macro one. This is
    the paper's "noise" case in miniature; its four examples give 0.40 to
    2.92 bits, and its decomposition into an effectiveness gain and a size
    loss, which the size term always makes negative, is arithmetic.
  excluded: >-
    "The scale at which a system's causal structure is most effective" as
    anything more than "the scale at which EI is highest". That reading,
    that the EI peak marks where causation happens, rests on imposing a
    uniform intervention distribution separately at each level, which
    weights micro states differently at the two levels. The paper adopts
    this and does not test another. The narrowed title says EI, and says
    under which interventions.
