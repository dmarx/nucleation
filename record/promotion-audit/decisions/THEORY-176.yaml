evidence:
  - "NOTE-653 v1 history: read in full, §§1–8 and Appendices A–B; figures read as rendered images. The relations are the record's own derivations from eq. 1, as the summary says."
  - >-
    Example for relation 3. Let the label be Y ∈ {0, 1}, uniform, and the
    input X ∈ ℝ^{1×2×1} (one channel, two positions) with X₀ = 2Y − 1 and X₁
    a fair ±1 coin independent of Y. Let A's first ℓ layers be the identity,
    r = A_{≤ℓ}(X) = X, and its head read position 0: A_{>ℓ}(z) = 1[z₀ > 0].
    A has error 0. Let r′ = g ∘ r with g swapping the two positions; g is
    invertible, so r and r′ are functions of each other and equivalent in
    Blackwell's order (each is a garbling of the other). The paper's
    stitcher is a 1×1 convolution between BatchNorms, i.e. at C = 1 the same
    affine map z_p ↦ αz_p + β at every position p. Through it the head sees
    αr′₀ + β = αX₁ + β, which is independent of Y, so every stitched
    network has error 1/2. The penalty is 0 for r (take α = 1, β = 0) and
    1/2 for r′, though the two are Blackwell-equivalent. This also shows the
    penalty order is not Blackwell's order.
  - >-
    Relation 4, checked. If the fitted s gives s ∘ r = A_{≤ℓ} on the input
    distribution, the stitched network equals A and the penalty is 0. So a
    nonzero penalty, and in particular a negative one, implies that
    s ∘ r ≠ A_{≤ℓ} on a set of positive probability.
  - "THEORY-156 (Proposed) is cited for Blackwell's theorem; the title uses only the definition of the order and the fact that mutual garblings are equivalent, so it does not lean on THEORY-156 (as batch 014 found for CLAIM-212 and CLAIM-228)."
