scope:
  accepted: >-
    Sorted by hand: Farrell, Gopnik, Shalizi and Evans (LIT-848, NOTE-649)
    classify large models as a cultural and social technology and deny
    them agency, by analogy with print, markets and bureaucracies. The
    entry's own body says "nothing was tested". The one mechanism, that a
    likelihood fit is least accurate on rare cases, follows from the
    training objective; its cultural consequence is not shown.
  not_accepted: >-
    The classification and the denial of agency. Its promote_when needs
    a stated criterion separating agent from technology, applied, and
    evidence that routing production through such models narrows output;
    THEORY-226 is partial evidence on one topic only.
