scope:
  accepted: >-
    The two facts the promote_when names, derived here (ADR-047 v2) from
    the existence of a universal lower-semicomputable conditional
    semimeasure m(.|.) and Levin's coding theorem K(D|H) = -log m(D|H) +
    O(1), uniformly in H.

    Eq. 25 (domination). Enumerate the lower-semicomputable conditional
    semimeasures mu_1, mu_2, ...; xi(D|H) = sum_i 2^(-K(i)) mu_i(D|H) is one
    (Kraft bounds the weights), so m >= c xi >= c 2^(-K(mu)) mu for each mu.
    A recursive likelihood family Pr(.|.) is such a mu, so
    m(D|H) >= c 2^(-K(Pr(.|.))) Pr(D|H). Applied to the single distribution
    Pr(.|H) as an unconditional semimeasure it gives the paper's
    2^(-K(Pr(.|H))) form; both hold.

    Theorem 11 (universal sum test). For recursive P,
    delta0(x) = log(m(x)/P(x)) is lower semicomputable and
    sum_x P(x) 2^delta0(x) = sum_x m(x) <= 1, so it is a sum P-test. For any
    lower-semicomputable sum test delta, P(x)2^delta(x) is a lower-
    semicomputable semimeasure, so by domination delta0 >= delta - K(delta)
    - O(1): delta0 is universal. D is random for P exactly when delta0(D)
    is bounded.

    The Fundamental Inequality then reduces to an identity. Write
    d(D|H) = log(m(D|H)/Pr(D|H)), the universal deficiency of D for
    Pr(.|H). By the coding theorem,
    -log Pr(D|H) = K(D|H) + d(D|H) + O(1), and under the universal prior
    -log m(H) = K(H) + O(1). So the Bayesian two-part length
    -log Pr(D|H) - log m(H) equals the ideal-MDL length K(D|H) + K(H) plus
    d(D|H), up to O(1). By domination d(D|H) >= -K(Pr(.|.)) - O(1); it is
    bounded above exactly when D is random for H. Selection (Theorem 4):
    if the MDL choice H1 and the MAP choice H2 both have d <= c, then
    L_map(H1) <= L_mdl(H2) + c + O(1) <= L_map(H2) + c + K(Pr(.|.)) + O(1),
    so their posteriors differ by at most a factor 2^(c + K(Pr(.|.)) +
    O(1)). Where d is large they part: 0^n has deficiency about
    n - O(log n) for the fair coin (Example 3).
  excluded: >-
    "Agree only to within the complexity of the hypothesis's likelihood."
    The paper's slack alpha = K(Pr(.|H)) + K(P) is an upper bound, and the
    conditional form of domination gives the family's complexity
    K(Pr(.|.)) instead, a constant over H. Nothing shows the slack must be
    as large as K(Pr(.|H)); the title's "only" is not supported, and
    NOTE-801's "alpha can be as large as K(H)" describes the bound, not the
    gap. The title is restated as the identity. Recursive priors other
    than m keep the paper's K(P) term and are not in the narrowed title.
