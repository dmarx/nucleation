notes_for_ledger:
  - >-
    The score-2 band went 4 of 5 here, 12 of 15 across batches 039, 045
    and 049. Keep working through it by title.
  - >-
    "A symmetry implies a mirror" depends on the group containing an
    involution with a nontrivial fixed subspace. Positive rescaling
    (ReLU's λ > 0) contains none, so check the sign before carrying a
    sparsity corollary (THEORY-213).
  - >-
    A weight-decay threshold for "every minimum on the symmetric subspace"
    needs only a lower bound on the loss's Hessian, not smoothness: the
    even function's gradient vanishes at zero, so f(z) − f(0) ≥ −(c/2)‖z‖²
    (THEORY-213).
  - >-
    A "can" thesis about an information measure promotes by construction
    once the title names the measure and the intervention distribution;
    its interpretive reading moves to a QUESTION (THEORY-222).
  - >-
    Recomputing a quoted exponent from the paper's own equations is a
    cheap check that can close the theorem route (THEORY-203's ν ≈ 1.89
    against a quoted 1.78).
  - >-
    Requeue THEORY-203 if THEORY-199 is promoted and the ν gap is
    explained or a second parameter set is measured.
