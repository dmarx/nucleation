evidence:
  - "NOTE-686 v1 history: read in full; Theorem 4's proof followed step by step and re-derived; Lemmas 2–3, Eq. 15 and Theorems 4–5 checked numerically."
  - >-
    Re-derivation. On the Poincaré ball of curvature −c,
    exp₀(v) = tanh(√c‖v‖) v/(√c‖v‖) maps ℝⁿ onto the open ball of radius
    1/√c, and log₀(y) = artanh(√c‖y‖) y/(√c‖y‖) is its inverse, since
    artanh ∘ tanh is the identity and both maps keep the direction. A lifted
    map is f^{⊗c} = exp₀ ∘ f ∘ log₀ (Definition 3.2), which covers matrix
    multiplication and pointwise nonlinearities. Then
    g^{⊗c} ∘ f^{⊗c} = exp₀ ∘ g ∘ (log₀ ∘ exp₀) ∘ f ∘ log₀ = exp₀ ∘ (g ∘ f) ∘ log₀,
    and by induction a stack of k lifted layers is exp₀ ∘ (f_k ∘ ⋯ ∘ f₁) ∘ log₀.
    The Euclidean network inside does not depend on c; c enters only through
    the chart. The bias x ↦ x ⊕_c b is not of this form with a c-free f: in
    the chart it is F_b(v) = log₀(exp₀(v) ⊕_c b), which by Theorem 4 equals
    log₀(exp_{exp₀(v)}((λ₀/λ_x) log₀ b)) and depends on c (it reduces to
    v + b only as c → 0). The output layer's logits are distances to the
    geodesic hyperplanes exp_p({a}^⊥), in closed form with c (Theorem 5).
    Every other operation is a lifted map. So the network's dependence on c,
    beyond the chart, is carried by those two operations alone, which is
    the title's "only".
  - "Conjugation is meant in this sense: the Euclidean counterpart of each lifted layer is its own c-free original. Any map on the ball is trivially exp₀ ∘ (something) ∘ log₀; the content is that for lifted layers that something is the standard layer, while for the bias and the output layer it is a c-dependent map."
