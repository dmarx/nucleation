scope:
  accepted: >-
    After correction: the growth statistics the source derives (the degree
    law by master equation, which NOTE-678 followed and checked for its
    exponent), the tree structure of the gluing, and the result the
    promote_when asks for. The 1-skeleton's graph metric is Gromov
    hyperbolic, with geodesic triangles 2-thin for every N, every d ≥ 1
    and every flavor s. So the coarse hyperbolicity of the network is a
    consequence of the growth, not of the equal-length convention. That
    meets the promote_when under ADR-047 v2, by the re-derivation below.
    Its first alternative is "the graph metric of the grown complex's
    1-skeleton is Gromov δ-hyperbolic with δ bounded independently of N",
    asked "for at least the manifold flavor".

    Re-derivation (δ ≤ 2, Rips thin triangles).
    (0) The decomposition. Let T have one node per d-simplex. The parent of
    a non-initial simplex σ, glued on face α, is the earliest simplex
    containing α. Each node's bag B_σ is the set of σ's d + 1 vertices, a
    clique of G, the 1-skeleton.
    (1) This is a tree decomposition. (a) Every vertex and every edge lies
    in some bag, because edges are created only as edges of a new simplex.
    (b) For each vertex v, the simplices containing v form a connected
    subtree. If v ∈ σ and v is not σ's new vertex, then v ∈ α ⊆ parent(σ).
    So following parents from any simplex containing v stays among
    simplices containing v, and ends at the simplex that created v (or the
    initial simplex).
    (2) The separation lemma. If node w lies on the T-path between a bag
    containing u and a bag containing v, every u–v path in G meets B_w.
    Proof: suppose a path avoids B_w. No vertex on it has w in its subtree.
    Consecutive vertices share a bag (their edge lies in one), so their
    subtrees meet. The union of the subtrees along the path is then
    connected in T − w, and it joins a bag of u to a bag of v. That
    contradicts w separating them.
    (3) Thinness. Take any geodesic triangle with vertices x, y, z and any
    geodesics, and a point p on [x, y]. Choose bags t_x, t_y, t_z
    containing x, y, z and t_p containing p. Let Y be the subtree of T
    spanned by t_x, t_y, t_z, a tripod with centre m, and let q be the
    node of Y nearest t_p. The T-path from t_p to any node of Y passes
    through q.
    Case q on the leg [t_x, m]. The T-paths t_p → t_x and t_p → t_y both
    pass through q. By (2), the sub-geodesic [x, p] meets B_q at some p′,
    and [p, y] meets it at some p″. All three lie on the geodesic [x, y]
    in the order p′, p, p″, so d(p′, p) + d(p, p″) = d(p′, p″) ≤ 1, since
    B_q is a clique. The T-path t_x → t_z runs along the same leg through
    q, so [x, z] meets B_q at some c′. Then
    d(p, [x, z]) ≤ d(p, p′) + d(p′, c′) ≤ 1 + 1 = 2.
    Case q on [t_y, m]: the same argument, with [y, z] in place of
    [x, z].
    Case q on [t_z, m], including q = m: the T-paths from t_p to t_x and
    to t_y both pass through m. So [x, p] and [p, y] meet B_m, and
    d(p, B_m) ≤ 1 as before. The T-path t_x → t_z passes through m, so
    [x, z] meets B_m, and d(p, [x, z]) ≤ 2.
    So every side lies in the 2-neighbourhood of the other two: δ ≤ 2,
    independently of N, d and s. The growth probabilities never enter.
    (Equivalently, the 1-skeleton is chordal, because each new vertex's
    neighbourhood is a clique, and its tree-length is 1. Results of the
    form "chordal graphs are 1-hyperbolic" (Brinkmann, Koolen & Moulton,
    2001) and "δ ≤ tree-length" are known, but the record holds no LIT for
    them. The argument above is self-contained.)
  excluded: >-
    Three parts of the current title and body that need correcting.
    (1) "is a tiling of hyperbolic d-space by ideal simplices". This holds
    for d = 2 in the manifold flavor s = −1. There each new vertex lies on
    the open arc cut off by its parent edge, so drawn triangles have
    disjoint interiors and fill the disc as every free edge is glued. It
    fails for s = 0, 1, where siblings coincide (NOTE-678). It cannot hold
    as a face-to-face tiling for d ≥ 3. For d ≥ 3, a (d − 2)-face of an
    ideal simplex has at least two ideal vertices, so it meets H^d. In a
    locally finite face-to-face tiling, the tiles around such a face form
    a finite cycle, each sharing a (d − 1)-face with the next, with
    dihedral angles summing to 2π. But the grown complex has no cycles of
    face-adjacent simplices. So around each (d − 2)-face the drawn
    simplices form a path, and they either overlap once their angles pass
    2π or fail to close up. The source's "a tree of ideal simplices tiles
    H^d" is asserted, and NOTE-678 grades it weak. (2) "has a tree as its
    dual" holds as stated (simplices linked when they share a face) only
    for s = −1. For s = 0, 1, several simplices can be glued on one face,
    which makes a clique in that graph. What is a tree for every flavor is
    the gluing or parent structure used in (0). (3) "though the curvature
    comes from the equal-length convention and not from the growth". This
    holds for the constant curvature of the drawing, but the re-derivation
    shows the graph's own coarse hyperbolicity comes from the growth. The
    clause should say which curvature it means.
