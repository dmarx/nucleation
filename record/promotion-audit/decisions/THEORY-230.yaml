scope:
  accepted: >-
    Identification, re-derived here (ADR-047 v2). The relational geometry
    is d_ij = 2 arccos Σ_a √(p_i(a) p_j(a)) over a context battery, a
    function of the next-token laws alone, so it is unchanged by every
    reparameterization that leaves outputs unchanged, and two models with
    identical laws on the battery have identical matrices. Activation
    geometry is not so fixed: for an invertible A, replacing the hidden
    state h by Ah and the readout g by g ∘ A⁻¹ leaves every output the
    same, while the Gram matrix becomes hᵢᵀAᵀAhⱼ, which differs unless A
    is orthogonal (Prop. 1).

    Measurement, under ADR-047 v3. NOTE-755 read the paper in full, with
    the numbers in the text and Supplementary Notes: over ten models (70M
    to 7B parameters; transformer, state-space and recurrent kinds; seven
    training pipelines; four tokenizers) the mean Spearman agreement of
    output distance matrices on natural text is 0.88, against 0.62 for
    mid-layer and 0.61 for last-layer activation geometry, with a bootstrap
    interval on the gap excluding zero. The top-six cross-family
    eigenvector overlap is 0.698, and a null matched in displacement
    magnitude gives 0.636. The residual +0.063 (+0.056 to +0.070) is
    0.063 / 0.698 ≈ 9% of the raw overlap (SN18).
  excluded: >-
    "Across ten architectures": there are ten models of three
    architecture kinds, not ten architectures. "What the shared laws
    imply": the 9% is measured against one displacement-matched null, and
    whether that null is fair is what the promote_when asks. "Far more":
    replaced by the numbers. Convergence from fit (Theorems 6 and 8) is
    excluded too, since its bound is vacuous on real models (Remark 2).
