  batch: batch-011
  disposition: retain-proposed
  reason: >-
    Batch 011 held the entry only because the record had no route to
    promote a single empirical study. The owner's rule of 2026-10-19
    (ADR-047 v3, "What one study counts for") supplies that route.
scope:
  accepted: >-
    The title, narrowed to the four odour sources measured. In strawberry,
    tomato, blueberry and mouse-urine volatiles, the rank order of
    concentration correlations has the Betti-curve signature of points near
    the boundary of a 3D hyperbolic ball and not of any uniform Euclidean
    cube tried. Human odour-descriptor profiles for Dravnieks' 127 odorants
    have that of a full 3D hyperbolic ball. ADR-047 v3's three conditions
    hold. (1) The narrowed title claims no more than LIT-872 measured, and
    it keeps the study's hedge: "the Betti-curve signature of", not "is
    hyperbolic". (2) NOTE-672 read the paper in full, in its own words:
    every section, both Methods sections and every figure caption. The
    figures and Supplementary tables S1–S5 were not seen, but the text
    reports the per-dataset P values the title depends on (P > 0.19 for
    the shell, P < 0.03 for the cubes). (3) Nothing in the record
    contradicts the measurement. NOTE-670, QUESTION-025 and THEORY-618 cite
    it as one test of the hyperbolic hypothesis and agree on its limits,
    which are the body's "What this does not say".
  excluded: >-
    "In natural odour sources" as a general subject. Four sources were
    measured, and the narrowed title says so. The promote_when moves,
    unchanged, to a new QUESTION, because ADR-047 v3 moves replication
    requests there. Its two halves are a replication on other odour sources
    or by another group, and a rejection of flat near-spherical nulls (a
    2-sphere in Euclidean space, or a flat space with an exponentially
    distributed scale). The second half tests a claim the body disclaims
    ("Not that the odour metric is hyperbolic as against a flat sphere").
evidence:
  - "NOTE-672 (Read in full from PMC6114987; figures and Supplementary Materials not seen): C1 moderate (four datasets, shuffle control, two scoring rules; the only flat null is a uniform cube); C3 moderate (one dataset of 127 odorants)."
  - "NOTE-672's own check: a simulated fitted shell gives a Spearman correlation of about 0.91 between hyperbolic and angular distances, which is the body's reason for disclaiming metric against sphere. This bounds what the title can say; it does not contradict the measurement."
  - "No entry in the record reports a failed replication or a contrary Betti-curve result for these data (grep of THEORY-191's citers: NOTE-670, NOTE-672, QUESTION-025, QUESTION-027, THEORY-618, LIT-872, curation 2026/10/09/203609 and 2026/10/16/183247)."
blockers: []
notes: >-
  The first promotion under ADR-047 v3. NOTE-672's caveat ("figures and
  Supplementary Materials not seen") was weighed against v3's "the NOTE on
  that study read it in full". It passes because the title rests on the
  text's reported P values and model comparisons, which were read, and not
  on any figure-only result. A title resting on a supplementary table known
  only by summary would not pass.
unlocks:
