    next word from the collection of all plausible texts, follows narrative
    coherence and not truth almost by definition, since nothing in the
    collection marks a continuation as true. The promote_when says as much:
    "The idealization itself is a definition and needs no test." Nothing is
    measured.
  excluded: >-
