scope:
  accepted: >-
    The title as it stands. Its three clauses are consequences of the
    definitions in LIT-850 (eq. 1) and of Blackwell's order: one decision
    problem through a fixed head and a restricted map class is not
    Blackwell's order; Blackwell-equivalent representations can stitch
    differently; a nonzero penalty shows the fitted map did not reproduce
    the layers it replaced. The body's relations 1, 2 and 4 are elementary
    and were derived when the THEORY was filed. Relation 3 is an existence
    claim ("can stitch differently"), and an explicit example, below, now
    shows it, even for the paper's own map class of per-position affine
    channel maps.
  excluded: >-
