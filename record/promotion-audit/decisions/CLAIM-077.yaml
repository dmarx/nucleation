scope:
  accepted: >-
    No mismatch. CLAIM-077 is not a possibility thesis. Its title is a
    proposed definition ("admissible only if"), and CLAIM-238 lists it
    under impossibility claims, not possibility theses. Its defeater,
    that no family of distinctions can be fixed independently of the
    transports compared, attacks exactly what the definition needs: that
    it can be applied. CLAIM-239 (Active) answers CLAIM-238's point: an
    impossibility condition is met by an argument, so the claim can fail
    by its own condition, though no study can make it fail. That is the
    right kind of defeater for a definitional proposal, and replacing it
    with an observable one (CLAIM-238's remedy) would test something the
    title does not say.
  excluded: >-
    Promotion. Whether the distinctions can be fixed independently is
    QUESTION-005, which is open.
