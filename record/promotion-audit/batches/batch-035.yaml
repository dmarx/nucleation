finding: >-
  Neither CLAIM is a possibility thesis on its text. CLAIM-238 lists
  CLAIM-139 among the margin-less nulls and CLAIM-143 among the
  impossibility conditions. CLAIM-238's granted objection still binds
  CLAIM-139 in full, because CLAIM-139 was never restated. For CLAIM-143
  it binds only as to studies: CLAIM-239 lets an argument meet the second
  disjunct. Both rest on Proposed interpretive premises, so both stay with
  the owner. Quantifier checks found one overstatement, in CLAIM-143's
  singular, exclusive "only after the correspondence is fixed". A
  disagreement can be shown to survive every correspondence in an
  admissible class without fixing any one; differing outcome marginals on
  a shared context do it under every bijection. THEORY-628, the last
  of triage-005's control sample, retains, as its source route
  predicted; the control's tally is for the integrating session, since
  its other members (THEORY-071, -178, -306, -485) were reviewed in
  other batches. THEORY-167 is the one source-route entry with a v3 path: its
  title is a measurement, read in full except for the per-tale schemes
  that carry its order claim.
recommendation: >-
  Review CLAIM-265 next, root first: it is the general form of CLAIM-143,
  it is unreviewed, and its formal half may split off as demonstrated.
  Move THEORY-628 to wave 5. Give THEORY-167 a reading task (Propp's
  schemes from a clean text) before requeueing it. Put CLAIM-139's
  restate-or-split question to the owner together with batch 034's
  CLAIM-238 questions, since they share one remedy.
