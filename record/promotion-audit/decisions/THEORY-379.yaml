  - clause: independence of the orderings as the whole probability model
    kind: 3
    route: >-
      note only. Independence alone does not suffice: two deterministic
      lists in opposite orders are independent, and FA then needs depth
      about N/2 for k = 1, against t* = sqrt(N). The re-derivation needs
      m-1 of the orderings uniform; the narrowed title says so.
