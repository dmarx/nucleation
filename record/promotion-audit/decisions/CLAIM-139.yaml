notes: >-
  Weighing CLAIM-238's granted objection: it does not say the thesis is
  false, and it is not a reason to retire it. It says the thesis's own
  defeat condition cannot be met, so even a programme run in full would
  leave the credence where it is. The remedy CLAIM-238 names (a margin
  and a prespecified set of observables and weights) is the owner's, as
  is CLAIM-216's proposal to split the four clauses into separate theses.
  The directive described CLAIM-139 as a possibility thesis; on the text
  it is a comparative null plus a necessity negative, so the "can"
  analysis batch 034 applies to CLAIM-033, -087 and -105 does not carry
  over.
