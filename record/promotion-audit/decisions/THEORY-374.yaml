promote_when_met: >-
  The promote_when asks for the primary proofs (Abiteboul and Duschka
  1998; Duschka, Genesereth and Levy 2000) confirming each statement with
  its conditions. ADR-047 v2: a checked step-by-step re-derivation in the
  decision file meets a request for a proof the record does not hold.
  (2), (3a) and (3b) are re-derived above with their conditions (query
  and view language, world assumption, data complexity); (1) is already
  proved in the record. The promote_when's own clause, that a narrower
  condition revises the title rather than refutes it, is what the
  open-world narrowing does.
