confidence: medium
scope:
  accepted: >-
    A reading of the two positive-pair papers, each read closely. Johnson et
    al. (LIT-258, NOTE-751, App. C and the proof of Thm 3.2) get the
    orthogonal diagonalization of D^(−½)P D^(−½) from the symmetry of
    P_(A,A). M is a Gram matrix BᵀB because both views are drawn
    independently from the same p(A|Z). HaoChen et al. (LIT-249, NOTE-740,
    App. F) apply the spectral theorem to k(u,v) = w(u,v)/√(w(u)w(v)), whose
    symmetry follows from w(u,v) = w(v,u). Neither paper invokes Riesz, and
    the record's own adjoint step for integral operators is CLAIM-291.
  excluded: >-
    The title's generalisation to "spectral self-supervised learning". The
    body itself names three routes in the family where the symmetry does not
    come from the positive-pair distribution. Simon et al. (LIT-242) get it
    by symmetrizing the loss. Pfau et al. (LIT-252) take it as a precondition
    on k. Zhai (LIT-975, THEORY-239) gets self-adjointness by composing the
    conditional-expectation operator with its adjoint, and version 3's note
    says this "is restated" as the mechanism. So as titled the claim is
    contradicted by its own body. Also excluded: the asymmetric-objective
    case (BYOL, SimSiam), which the promote_when is about and which the body
    already lists under "What this does not say".
evidence:
  - "The body's own exceptions: Simon et al. (eq. 4, §5.2), Pfau et al. (§3.2), and the 'sharper statement of the mechanism' paragraph on LIT-975."
  - "History version 3: 'The mechanism is restated: the thesis gets self-adjointness by composing the conditional-expectation operator with its adjoint, not from symmetry of the pair'."
  - "The promote_when asks for a published analysis of an asymmetric objective. That tests an extension the body disclaims, not the reading the THEORY states, the same bundling as THEORY-155's (batch-000)."
