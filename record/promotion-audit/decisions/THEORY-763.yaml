scope:
  accepted: >-
    The flux consequence is already re-derived in the body from THEORY-749's
    energy balance: for s before the support and t with E(t) > 0 the
    integrated flux tends to E(t) > 0, and for s with E(s) > 0 and t after
    the support it tends to -E(s) < 0. Checked again here; it needs only
    v in C([0,T]; L^2) and E not constant. The exponent bookkeeping
    alpha = 1/(2b + 1) -> 1/3 as b -> 1 was re-checked from the Main
    Lemma's scaling, (-2 alpha b^2 = -alpha - alpha b + 1 - b).
  excluded: >-
