recommended_change: >-
  Promote THEORY-379 narrowed: FA is correct for monotone f, and when the
  orderings are independent with at least m-1 uniformly random, its cost
  is O(N^((m-1)/m) k^(1/m)) with arbitrarily high probability; with
  dependent orderings the bound can fail. File Fagin's lower bound for
  strict functions as a Proposed THEORY extending it, inheriting the
  promote_when (a reading of Fagin's proof).
