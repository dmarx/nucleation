scope:
  accepted: >-
    The discrete-time criterion, as mean conservation. If K_i f = f for
    every step's kernel, then E[f(S_(i+1)) | S_i] = f(S_i), so f(S_n) is a
    martingale and E f(S_n) is invariant. If ‖K_i f − f‖∞ ≤ ε_i, then
    |E f(S_(i+1)) − E f(S_i)| = |E[(K_(i+1) f − f)(S_i)]| ≤ ε_(i+1), so the
    mean drifts by at most Σ ε_i. On a finite irreducible chain only
    constants are harmonic, by the maximum principle, which the claim's note
    of 2026-10-10 already proves. So a non-trivial exactly conserved mean
    needs several closed classes, a restricted state space, or
    time-dependent kernels.
  excluded: >-
    "Is conserved" and "a Noether-type conservation criterion" in the title.
    Only the mean is conserved: in a walk on {0, …, N} absorbed at the ends,
    f(x) = x is harmonic while the distribution of f(S_n) spreads to the
    endpoints. And mean conservation does not make an observable a
    symmetry. CLAIM-094 (Active, granted) holds both points against this
    claim, and the Noether-type equivalence for finite continuous-time
    processes is Baez and Fong's (THEORY-158, Proposed).
evidence:
  - "The martingale and drift bounds are one line each, checked for this review."
  - "CLAIM-094 (Active, granted, objects to this claim): 'A harmonic observable conserves only its mean, and Baez and Fong show that mean conservation for every initial state does not make an observable a symmetry'."
  - "The defeat condition (an observable meeting the criterion whose distribution drifts in a way the manuscript counts as non-conservation) is met by the absorbing walk if 'conserved' means more than the mean. The manuscript itself calls its bounds expectation-preservation only."
