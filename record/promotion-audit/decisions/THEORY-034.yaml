scope:
  accepted: >-
    Nothing new. The title makes two claims. The first is the reach of
    Chakravartty's dilemma (LIT-196, NOTE-149): it reaches only
    non-eliminative structural realisms that keep relata but deny them
    every intrinsic identity-fixing feature. That is Chakravartty's own
    framing, and he says the chapter leaves eliminative OSR untouched.
    The second is a placement of the record's OSR readings on that map,
    which finds two of the target kind (Floridi; Esfeld and Lam). The
    placement is the record's interpretive synthesis.
  excluded: >-
    Promotion as a demonstrated CLAIM under ADR-032. Each row of the
    placement table is an interpretive reading of what a text grants
    about intrinsic features, not a derivation. The Esfeld and Lam row
    itself records that whether primitive numerical diversity meets the
    dilemma is open. The promote_when is a reading task: check the
    placements against the founding texts Chakravartty targets, Ladyman
    1998 (LIT-342) and Every Thing Must Go (LIT-301). Both are
    Unavailable (closed), and French and Ladyman 2003 is not held.
