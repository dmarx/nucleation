scope:
  accepted: >-
    Sorted by hand: the title reports what the court in United States v.
    Google (Mehta 2025, LIT-006, read in full in NOTE-004) treated as the
    fruit of the violation and what it held a data-sharing remedy can do.
    It also says that the remedy will work is "the court's expectation,
    not a finding". As a report, the title is supported page by page in
    the body (op. pp. 9-11, 73-97, 136-186). The classifier's theorem
    signal came from the "Where ... held that ... can" construction.
  not_accepted: >-
    Whether a report title can be promoted on the source it reports. That
    is the open owner question on report titles (THEORY-344, -351, -071,
    -628, -336); this review does not decide it. Its promote_when tests
    the court's expectation (what the decree did), which no reading of
    the opinion can supply.
