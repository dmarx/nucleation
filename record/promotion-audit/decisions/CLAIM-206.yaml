scope:
  accepted: >-
    The dilemma is valid as a conditional. It needs two premises: CLAIM-135
    ("A kind can be real and still unseparated by an insufficient family of
    probes"), and the reading of judges as one probe family. Given both,
    the two horns follow as stated. The misfire it found in CLAIM-142 v1's
    defeat condition was correct: a one-probe family, "ask judges whether
    the two realizations are the same act", met that condition trivially.
  excluded: >-
    Promotion. This is a counter, so promoting it would mean the record is
    persuaded, and the record has already replied in three places:
    - CLAIM-217 rejects the first horn's premise. No claim says a kind
      outruns every family, and for a communicative kind, competent uptake
      is the criterion a family is tested against.
    - TERM-040 v2 corrects the gloss the second horn used.
    - CLAIM-142 v2 excludes the trivial probe.
    The claim's own "Where it stands" says it "stays open until the owner
    decides on it". Its premises CLAIM-135 and CLAIM-046 are Proposed and
    interpretive.
