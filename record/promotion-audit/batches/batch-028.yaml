yield: 0 of 10 warrants were wrong; 1 title/defeater mismatch (CLAIM-033) referred to a regular review
finding: >-
  The sweep's premise was wrong. Batch 022 read an interpretive claim with an
  empirical defeat condition as a misclassified warrant, and corrected
  CLAIM-052 to empirical in #204. But ADR-043's own pilot reads such claims
  the other way: CLAIM-117's note of 2026-10-15 kept it interpretive because
  it is "untested and, with no observation under it, interpretive", and
  batches 002 and 004 followed that reading for CLAIM-063 and CLAIM-056.
  ADR-043 defines `empirical` as "supported by observation or experiment",
  in the present tense. On that reading every one of the ten has the right
  warrant, and the empirical defeater is simply what would settle a claim
  the record has not tested. The one real defect was a title left behind by
  its own restated defeater (CLAIM-033: "can" in the title, a prevalence
  test in the defeater since CLAIM-238's objection), and which side to fix
  is a design choice, not a sweep's.
recommendation: >-
  Settle the owner question below before sweeping the other 27. If the
  pilot's reading stands, the sweep becomes a defeater-fit check (does the
  defeater have the claim's quantifier?), and CLAIM-052's correction in
  #204 should be reverted to interpretive. If batch 022's reading stands,
  ADR-043 needs an amendment saying `empirical` covers claims whose support
  would be observational, and CLAIM-117, CLAIM-063 and CLAIM-056 (and most
  of the 37) become empirical.
owner_questions:
  - >-
    Does `warrant` say how a claim is supported now, or how it would have to
    be? ADR-043's pilot (CLAIM-117's note, and batches 002 and 004 after
    it) says now: an untested empirical claim is interpretive. Batch 022
    (#204, CLAIM-052) said would be: an untested empirical claim is
    empirical. The two readings disagree on most of the 37 claims this
    sweep lists, and #204 already applied the second one.
follow_up_prs: []
prs_opened: []
referred:
  - "CLAIM-033 and the other 2026-10-10 possibility theses CLAIM-238 names (CLAIM-115, -139, -077, -143, -087, -105): check each title against its revised defeater, with CLAIM-238 in view."
notes_for_ledger:
  - >-
    Two readings of ADR-043 are in use. The pilot's: an empirical claim with
    no observation under it is interpretive (CLAIM-117, CLAIM-063, CLAIM-056).
    Batch 022's: it is empirical (CLAIM-052, #204). Until the owner rules,
    don't correct warrants in either direction on that ground alone.
  - >-
    Term-of-art false positives. "Empirical model" (contextuality) and
    "experiment" (Blackwell's statistical experiments) fire the cue list
    without naming anything observed. warrant_sweep.py excludes the first;
    the second needs a reading.
  - >-
    Check the defeater's quantifier against the title's. An existence title
    ("can") with a frequency defeater ("at a rate no greater than") is a
    mismatch, but read the history first: CLAIM-238 (Active, granted) is why
    the 2026-10-10 restatements turned possibility defeaters into prevalence
    tests, so the fix may be the title, and that is a design choice.
  - >-
    A title already corrected by its own body. CLAIM-074's body says the
    transient/persistent dichotomy in its title "does not hold"; the title
    is unchanged. Grep bodies for "does not hold" or "needs stating" in a
    later pass.
  - >-
    Split parents and earlier corrections reappear in any mechanical sweep
    (CLAIM-056, CLAIM-063). Skip codes whose last decision was carried out
    unless their entry changed since.
