  THEORY-083:
  - text: training any classifier past zero error collapses last-layer features onto class means and the
      means onto a simplex ETF, with nearest-class-mean decisions (neural collapse as a general law)
    kind: 1
    who_asserts: LIT-618 (Papyan, Han and Donoho, abstract and discussion); LIT-613
    existing_carrier: null
    suggested_title: Training a deep classifier past zero training error generally collapses its last-layer
      features onto their class means, drives the centred means toward a simplex equiangular tight frame
      aligned with the classifier, and makes the decision nearest class mean, as Papyan, Han and Donoho
      propose from their runs
    suggested_promote_when: 'Replication outside the protocol of LIT-618, read in the record. That protocol
      had balanced classes, no augmentation, dropout removed, one run per learning rate and the best run
      shown. Measurements of NC1 and NC2 through the terminal phase under augmentation, label noise and
      several seeds per cell would promote this, and of NC1 under class imbalance. NC2 is predicted for
      balanced classes only: under imbalance the geometry to test is that of THEORY-286, not equiangularity.
      So would a held paper that derives collapse as the limit of gradient descent on cross-entropy, which
      would turn the measured regularity into an account. No held paper meets that yet: LIT-974 derives
      collapse for MSE under a re-whitened flow, and LIT-994 gives an endpoint, not a gradient-descent
      derivation. The claim is refuted if standard training run well past zero error leaves within-class
      variability of last-layer features flat, or, with balanced classes, leaves the centred class means
      far from equiangular. Further runs under the original protocol cannot settle it. Nor can the theorems,
      which assume the collapsed end state.'
  THEORY-117:
  - text: compositional generalization comes from diversity of combinations, not data volume, as a general
      cause
    kind: 1
    who_asserts: LIT-667 (Uselis, Dittadi and Oh, abstract)
    existing_carrier: null
    suggested_title: In vision models, compositional generalization to unseen combinations of concepts
      is driven by the diversity of combinations seen in training rather than by data volume, as Uselis,
      Dittadi and Oh propose
    suggested_promote_when: 'For the empirical half: the volume-against-diversity comparison repeated
      with model selection on a validation split disjoint from the unseen combinations, so that a model
      never chosen by its score on the test pairs still fails to generalize under more data of the same
      combinations and succeeds as coverage rises. A second architecture trained from scratch, or more
      than two concepts, would widen it. For the theoretical half: a line-by-line check of Proposition
      B.7''s proof, or a second derivation such as Trager et al.''s. The account is refuted if, at fixed
      combinatorial coverage, enough added data of the seen combinations closes the gap on unseen ones,
      or if networks reach high accuracy on unseen pairs at low coverage without linearly factored features.
      Further runs with oracle selection on the test pairs cannot settle it, since they measure the best
      case by construction.'
