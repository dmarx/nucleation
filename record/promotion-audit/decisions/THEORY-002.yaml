scope:
  accepted: >-
    The formal core, as a new Active THEORY sourced to LIT-253 and LIT-250,
    presupposing THEORY-004 and stated for the final embedding and
    unembedding of softmax models.
    (1) What is observed fixes the representation only up to that
    observation's symmetry group. A centred linear kernel fixes it up to a
    translation and an orthogonal map (THEORY-004, Active). The softmax
    output distribution fixes the embedding and unembedding only up to
    f = Af′, g₀ = A⁻ᵀg′₀ for invertible A (LIT-253 Thm 2.2, proof in
    App. B).
    (2) Whether near-closeness in distribution gives near-closeness of
    representation depends on the distances used. KL can tend to zero
    while the embeddings stay non-linearly-related (Thm 3.1, constructive
    proof App. C.1, in the saturation regime; Cor. 3.2 for deterministic
    labels). Under d_LLV, d_LLV ≤ ε implies d_f,g ≤ 2Mε (Thm 4.7, App.
    E.5–E.6).
  excluded: >-
    What THEORY-002 keeps, Proposed: that convergence "in the Platonic
    hypothesis's sense" is convergence of kernels, and the application to
    Huh et al.'s pooled hidden-state kernels. NOTE-738 says that
    application is "the record's inference, not the paper's", and it
    reaches those kernels only by analogy, since LIT-253's results cover
    the final layer alone. The promote_when, a stability result for the
    representations' own kernels or a measurement of MNN against Bures
    alignment, bears on this part and stays unchanged.
