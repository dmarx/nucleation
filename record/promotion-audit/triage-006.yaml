# record/promotion-audit/triage-006.yaml
# Triage-006: the unqueued Proposed THEORYs re-triaged for formal content by
# triage_wave3.py (record revision: origin/main at 374ba778, 2026-10-19). It
# orders review and decides nothing (ADR-047). No candidate here is reviewed.
#
# Why: in batches 024-030 the re-derivation route went 17 of 20, and its
# errors were entries triage-005's `formal` flag missed (THEORY-187, -211,
# -566, -176), not false positives. That flag needed a formal word in the
# title AND a theorem or proof named in "What was actually shown".
#
# Method. formal_score counts four signals and one penalty; formal = score >= 2.
#   title          +1  triage-005's title keywords (bound, theorem, exact, ...)
#   cites          +1  a numbered Theorem, Lemma, Proposition or Corollary
#   relation       +1  an equation or inequality between expressions, or an
#                      operator such as ‖·‖, ∑, ∫, ∘ (settings like "d = 6" do
#                      not count)
#   derived        +1  a source NOTE's claims-table row says proved,
#                      derivation or re-derived (not "not re-derived"), and the
#                      row or the NOTE's version-1 history says "followed step
#                      by step" or "read in full"
#   philosophical  -1  the title says thesis, argument, account or should
# cites and relation read the body without "What this does not say", "What it
# bears on", "Connections" and HTML comments. Eligible: Proposed and not a
# candidate or requeued in queue.yaml (161 codes excluded).
#
# Lists. formal_route = the top 20 formal-flagged entries by formal_score,
# then the triage-005 rubric score, then supports, then code (the route's
# question is formal content, so formal_score leads). control = 5 of the
# remaining formal-flagged entries by fixed rule: sorted codes, every k-th
# from k // 2 (control() in the script). formal_signals names what fired.
#
# labelled_check: the 30 reviewed wave-3 entries of batches 016/017 and
# 024-027, scored as they stood when triaged (git archive of 9ca3a0dc for
# 016/017, 8999ea61 for 024-027). Label 1 = the review's path went through a
# re-derivation (ADR-047 v2), 0 = by measurement (v3) or retained as argument.
# The new flag: precision 0.83 (19/23), recall 0.90 (19/21); triage-005's flag
# on the same entries: 0.84 (16/19), 0.76 (16/21). Misses: THEORY-369 (title
# only; its equations are settings) and THEORY-176 (relations only). False
# flags: THEORY-079 and -199 (retained), THEORY-391 (cited theorem, promoted
# as a measurement), THEORY-690 (argument). The signals and the threshold were
# chosen with these 30 in view, so the check is FITTED to the same entries
# and is not evidence of out-of-sample accuracy; the next formal batch is.
#
# Known weak spots: the philosophical penalty fired on 11 eligible entries and
# unflagged two, THEORY-290 (a game-theoretic equilibrium result whose
# "argument" is debate content) and THEORY-497; it never fired on the
# labelled set. A formal_score of 2 (53 of the 82 flagged) is the band where
# the labelled false flags sit.
