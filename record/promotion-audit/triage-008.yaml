  THEORY-178:
  - text: 'transcriptional regulation alone makes a bacterium''s gene-expression state depend on its history:
      a transient change to one regulator can leave cells in a different self-maintaining state'
    kind: 1
    who_asserts: LIT-854 (abstract and discussion)
    existing_carrier: null
    suggested_title: 'Transcriptional regulation alone can give a bacterium''s gene expression a memory:
      a transient change to one regulator can leave the cells in a different self-maintaining expression
      state after it is released, as the Boolean-network study of E. coli''s regulatory core proposes'
    suggested_promote_when: 'An experiment in bacteria, read first-hand, in which a gene is perturbed
      transiently (for example by inducible CRISPR interference, then released) with the growth environment
      held fixed, and other genes stay in their changed expression state for many generations after the
      perturbation is gone, with slow return excluded: either by following the culture until the state
      has outlasted any plausible relaxation time, or by showing that unperturbed cells started from the
      other state hold it under the same conditions. Refuted for the network if well-powered transient
      perturbations of the predicted genes (crp, with zraR, melR or rhaRS as responders) are always followed
      by a return to the starting state. What would not settle it: further simulations or rule ensembles;
      agreement with strains evolved under a permanent knockout, which is not a temporary disturbance;
      and environmentally induced bistable switches such as the lac operon, which were known before and
      are not perturbations of regulation alone.'
