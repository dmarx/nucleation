scope:
  accepted: >-
    The setting and the annealed computation as NOTE-691 reports them: the
    product-of-matrices form of two tokens' change statistics through
    their lowest common ancestor (Eq. 51), and the linearisation of the
    level-to-level belief map near its repulsive fixed point. The
    Gaussian-field contrast (App. B) is an exact calculation: with an exact
    score, the changed modes are those above κ*(t) = (1/α_t − 1)^(−1/a),
    so the change length grows monotonically and χ is largest at the end.
  excluded: >-
    The exponent clause, which is the title's centre. ν = log s / log F′(p*)
    comes from a scaling argument, not a derivation: it equates the
    correlation length with the block spanned by a latent at the escape
    depth from the unstable fixed point, inside an annealed (mean-field)
    approximation. The decay exponent at criticality (a = 1) is fitted. The
    record's own recomputation from Eqs. 22 and 54 at v = 32, m = 8, s = 2
    gives ν ≈ 1.89 where the paper quotes ν ≃ 1.78, an unexplained gap
    (NOTE-691, Limitations). So the theorem route (ADR-047 v2) is closed:
    there is no proof to re-derive, and the numbers disagree. The measured
    route (ADR-047 v3) is also closed: the comparison with exact BP is one
    parameter set, and its evidence is a data collapse in Figs. 2a and 9,
    with no table of fitted exponents in the text (the batch 019 rule).
