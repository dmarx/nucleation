scope:
  accepted: >-
    The formal core of the record's inference: under Montévil and
    Mossio's Definition 4 a closed set has at least two members (Definition
    4 says "at least one other constraint"; checked against the HAL deposit,
    hal-01192916, p. 16), and if each constraint's production scale tau_d
    is the conserved scale tau_s of a direct generator in the set and
    tau_s != tau_d for each constraint, the set has a slow and a fast
    dependence. The paper states the second property "as shown in the
    diagram" without proof. Re-derivation: pick a generator g(C) != C for
    each member; g on a finite set has a cycle C1..Ck, k >= 2; around it
    sum(tau_s - tau_d) = sum tau_s(Ci) - sum tau_s(g(Ci)) = 0 since g
    permutes the cycle; no term is zero, so terms of both signs occur.
    Corollary: a system with a single constraint of its own cannot realise
    closure. The record assembled this (NOTE-468: "my reading, not the
    paper's"), so it is a demonstrated CLAIM under ADR-032, on the
    CLAIM-391 pattern, filed Active.
  excluded: >-
    The demarcation thesis itself stays Proposed. Its promote_when asks
    for an analysis of a canonical flame and of a minimal protocell under
    Definitions 1-4, and for readings of Biological Autonomy (Unavailable)
    and Mossio & Bich (2014, not held). The flame analysis is an argument
    from a physical description, not a proof; the identification of
    two-constraint closure with 2009 differentiation is interpretive.
