notes: >-
  Two cautions for the promoted title.
  - The paper's text says the fits overlap "for up to 10 of the first 12
    points on TinyStories", but its table shows overlap for all eight
    tabulated windows, m = 5 to 12. The title follows the table.
  - The TinyStories intervals drift downward as m grows (midpoint 0.186
    at m = 5, 0.162 at m = 12). The m = 12 interval only just reaches the
    prediction. The match is best near the start of the envelope, and
    the body should say so.
  This falls under the open owner question on conditional theorems whose
  promote_when moves to a QUESTION (THEORY-185, -133, -419, -527). The
  narrowing is ADR-047 v3's: a measurement plus a re-derived conditional,
  with the mechanism test moved out.
