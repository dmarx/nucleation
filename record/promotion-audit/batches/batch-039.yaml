control:
  - code: THEORY-162
    formal_score: 2
    signals: [cites, derived]
    title_asserts: argument
    formal_in_fact: false
    outcome: retain-proposed
    why: >-
      A philosophy-of-language thesis resting on judgement data. Veltman's
      numbered proposition is cited but does not carry the title. The
      philosophical-title penalty missed it because its word list lacks
      "is part of its meaning".
  - code: THEORY-205
    formal_score: 3
    signals: [title, relation, derived]
    title_asserts: theorem
    formal_in_fact: true
    outcome: narrow-and-promote
    why: >-
      An exact SVD of the block–environment channel and the IB second
      variation give the bifurcation at (λ0/λ1)^(2n). It is narrowed
      because the global first transition can come earlier (1/s* < 1/ρ²),
      shown on a 3-state chain.
  - code: THEORY-275
    formal_score: 2
    signals: [relation, derived]
    title_asserts: measurement
    formal_in_fact: false
    outcome: narrow-and-promote
    why: >-
      Estimated TE and delayed MI in one bead experiment and its fitted
      model. The flag fired on the analytic covariance formulas in the
      body.
  - code: THEORY-365
    formal_score: 2
    signals: [title, relation]
    title_asserts: measurement
    formal_in_fact: false
    outcome: narrow-and-promote
    why: >-
      Measured scaling curves. The flag fired on "logarithmically" and on
      a per-layer step formula from a sketch whose assumption the title
      itself says is unmet.
  - code: THEORY-578
    formal_score: 2
    signals: [title, relation]
    title_asserts: measurement
    formal_in_fact: false
    outcome: retain-proposed
    why: >-
      One figure, no numbers in the text (batch 019). The flag fired on
