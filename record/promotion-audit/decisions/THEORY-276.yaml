  A mis-targeted promote_when, like THEORY-014's. The title is a theorem
  about invariant sets, and the condition asks for a second experiment
  testing which clusters are seen and when. The re-derivation makes the
  hypothesis for isolated desynchronization explicit: the factor that
  moves C_m must move nothing else. If it also moves another cluster, the
  two are intertwined and desynchronize together, as the paper says.
