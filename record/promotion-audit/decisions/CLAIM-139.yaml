scope:
  accepted: >-
    Nothing is promoted, and no correction is owed by the audit. The
    warrant stays interpretive under ADR-043 v2: the present support is
    the exchange's argument (A203, A214, A218), no study has been run, and
    the entry itself says its ontological clause "must be defended through
    argument" and is not tested by the programme. The defeat condition
    being observational is not a reason to relabel it.
  excluded: >-
    The whole thesis. Quantifier check: the title is a universal over
    communicative kinds ("A communicative kind's identity is grounded in
    its relational organization"), in four clauses. It is not a
    possibility thesis. CLAIM-238 lists it under "Nulls with no margin",
    not under the "can" theses: its first defeat disjunct is that human
    judgements are "predicted as well by" topic, embedding or surface
    similarity, a null with no equivalence margin, no power and an
    observable set the thesis may re-choose. Its third disjunct ("no
    relational structure beyond the observed response profiles is needed")
    is an explanatory-necessity negative that no finite study meets, which
    is CLAIM-238's impossibility shape. CLAIM-238's version-2 history
    restates the conditions of CLAIM-033, -087, -105 and -117 and adds
    margins in CLAIM-220, -202 and -204, but CLAIM-139 is at version 1 and
    has not been restated, so the granted objection still holds against
    it in full.
