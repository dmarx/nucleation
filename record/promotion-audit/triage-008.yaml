  THEORY-161:
  - text: all semantic rate-distortion frameworks of 2021-2025 treat meaning as a latent variable with
      a known joint law, so their limits are indirect source-coding limits
    kind: 2
    who_asserts: record
    existing_carrier: null
    suggested_title: The semantic rate–distortion frameworks of 2021–2025 generally treat meaning as a
      latent variable with a known joint law with the observation, so their limits are indirect source-coding
      limits, a reading the record draws from Zhao et al. and Chai et al.
    suggested_promote_when: 'Two kinds of result settle it. For the account of the field: a reading of
      Liu, Zhang and Poor''s framework (ISIT 2021; IEEE Trans. Commun. 2022) and of one further semantic
      rate–distortion framework not by these authors, each found either to treat meaning as a latent variable
      with a known joint law with the observation, coded through the observation, or not. A framework
      whose limit depends on a property of the meaning beyond that joint law and the distortion would
      refute the general statement. For the two identities: an independent check (a published statement,
      or a second reader''s derivation) that under Zhao et al.''s definitions the expected KL posterior
      distortion equals I(S;X) − I(S;Y) and the expected TV posterior distortion bounds the excess Bayes
      risk of bounded losses. Agreement among papers by the same groups does not count for the first.'
