scope:
  accepted: >-
    The title as it stands. Its promote_when asks for "an independent
    derivation of |⟨X⟩| + |⟨Z⟩| ≤ 1 from the A²₁-orbit condition". One is
    given below. It differs from the paper's Appendix A, which fixes four
    outcome-deterministic ontic states: it uses neither outcome determinism
    nor measurement noncontextuality, only preparation noncontextuality for
    the one equivalence of Eq. 11 and |response| ≤ 1. Under ADR-047 v2 it
    meets the condition. The title's second clause follows from the bound
    with two facts in the body: the qubit has the A²₁ orbit and violates
    the bound, and the qubit stabilizer theory has an uncertainty relation
    and a noncontextual model.
  excluded: >-
    The three-measurement analogue (computer-verified only), and any
    robustness claim for inexact equivalence. The body already disclaims
    both.
evidence:
  - "NOTE-825 v1 history: 'appendices A (the analytic proof of Eq. 12, step by step) ... The arithmetic of Eqs. A28–A33 and the tightness construction A35–A38 were checked by hand.' Claims C2 and C3 strong."
  - "NOTE-825 Eq. 10: ⟨X⟩s1 = −⟨X⟩s2 = −⟨X⟩s3 = ⟨X⟩s4 = x and ⟨Z⟩s1 = ⟨Z⟩s2 = −⟨Z⟩s3 = −⟨Z⟩s4 = z; Eq. 11: ½s1 + ½s3 = ½s2 + ½s4."
  - >-
    Independent derivation. Let a preparation-noncontextual model give
    preparation s_i the distribution μ_i over ontic states λ, and let X and
    Z have response functions ξ_X(λ), ξ_Z(λ) in [0, 1]. Write
    a = 2ξ_X − 1 and b = 2ξ_Z − 1, so |a|, |b| ≤ 1 pointwise and
    ⟨X⟩_s = ∫ a dμ_s, ⟨Z⟩_s = ∫ b dμ_s. Take densities with respect to
    μ1 + μ2 + μ3 + μ4 and treat μ_i as functions. (1) Eq. 11 is an
    operational equivalence, so preparation noncontextuality gives
    μ1 + μ3 = μ2 + μ4 =: ν, a measure of total mass 2. (2) Put u = μ1 − μ3
    and v = μ4 − μ2. Since the μ_i are non-negative, |u| ≤ μ1 + μ3 = ν and
    |v| ≤ μ2 + μ4 = ν pointwise; the second uses (1). (3) From Eq. 10,
    ∫ua = 2x, ∫va = 2x, ∫ub = 2z, ∫vb = −2z. For any signs σ, τ ∈ {±1},
    σx + τz = ¼ ∫ [u(σa + τb) + v(σa − τb)]. (4) Pointwise,
    |σa + τb| + |σa − τb| = 2 max(|a|, |b|) ≤ 2, so the integrand is at most
    max(|u|, |v|)·2 ≤ 2ν. Hence σx + τz ≤ ¼ · 2 · ∫ν = 1. Taking the signs
    of x and z gives |⟨X⟩| + |⟨Z⟩| ≤ 1. (5) Without (1), (2) only gives
    |v| ≤ μ2 + μ4 and the same steps give ¼(2 · 2 + 2 · 2) = 2, the gbit's
    value, which is why the equivalence is what does the work. Tightness is
    the paper's saturating model (A35–A38, checked by hand in NOTE-825).
  - "The qubit has the orbit: reflecting the Bloch vector (x, y, z) gives (−x, y, z), (−x, y, −z), (x, y, −z), and ½ρ1 + ½ρ3 = ½ρ2 + ½ρ4 as density operators, so the equivalence holds for every measurement. At x = z = 1/√2 the qubit reaches √2."
