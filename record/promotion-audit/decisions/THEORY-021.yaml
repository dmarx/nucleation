evidence:
  - "promote_when: 'The algebra is settled for the exact configurations. What is open is whether trained models reach them.'"
  - "NOTE-278 checks the tight-frame inference numerically for the triangle, pentagon, tetrahedron and antipodal pairs, and the tegum refinement (frame-operator eigenvalues 1.5, 1.5, 2) was checked when the THEORY was filed."
  - >-
    Re-derivation. Let the n feature vectors W_j have equal norms c (the
    polytope case), and let F = Σ_j W_jW_jᵀ. The definition
    Dᵢ = ‖Wᵢ‖² / Σ_j (ŵᵢ·W_j)² = c² / (ŵᵢᵀ F ŵᵢ). (1) A single factor: the
    vertex set of a regular polygon in ℝ², of the tetrahedron in ℝ³, or of an
    antipodal pair in ℝ¹ is the orbit of an irreducible finite group, so F
    commutes with the group and is a scalar, F = (nc²/m)I, by Schur and the
    trace. Then Dᵢ = m/n and Σᵢ Dᵢ ŵᵢŵᵢᵀ = (m/n)(F/c²) = I. Put V = √(m/n)·Ŵ,
    with columns ŵᵢ. Then VVᵀ = I_m, so V is a co-isometry, and
    Eᵢ = V eᵢeᵢᵀ Vᵀ = (m/n) ŵᵢŵᵢᵀ compresses the standard basis's projectors.
    (2) A tegum product: factors in mutually orthogonal subspaces S_k, with
    ⊕S_k = ℝ^m. Cross-factor inner products vanish, so ŵᵢᵀFŵᵢ only sees
    vectors of i's own factor, and (1) holds inside each S_k:
    Σ_{i∈k} Dᵢ ŵᵢŵᵢᵀ = P_k, the projector onto S_k. Summing gives
    Σ_k P_k = I. F itself is not scalar when factors have different n_k/m_k,
    which is the "not globally tight" refinement. The equal-norm assumption
    is needed only inside each factor.
