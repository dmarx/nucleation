  - "NOTE-378 C4: non-branching psychological continuity is a sufficient criterion of identity (moderate), with continuity left unspecified."
  - "THEORY-546 body, 'The repairs': 'Fission then forces either multiple occupancy or a non-branching clause (§5), which Parfit supplies ... as a sufficient condition only.'"
blockers:
