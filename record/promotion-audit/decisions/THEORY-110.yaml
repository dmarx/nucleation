scope:
  accepted: >-
    A new THEORY, filed Active, holding the theorems of Lin, Li and Wu
    (2024) that re-derive, checked here from arXiv:2404.06391 App. A.1,
    A.4–A.5 and B.1. THEORY-110 keeps the conjecture and extends it.
      (a) Theorem 6 (global minima, two-layer ReLU, orthonormal teacher of
          M ≤ d neurons, x uniform on the sphere). Zero loss means
          Σ_i σ(w_i·x) = Σ_{j≤M} σ(x_j) on the sphere. x = ±e_j gives
          w_ij ≥ 0 and Σ_i w_ij = 1 for j ≤ M, and w_ij = 0 for j > M;
          x = √(1−ε²)e₁ − εe₂ shows no neuron has two non-zero entries. The
          converse is σ(Σ_j w_ij x_j) = Σ_j w_ij σ(x_j) for w_ij ≥ 0. Erratum:
          the paper's S_j = {αe_j : α ≠ 0} must read α > 0. Its own proof
          gives w_ij ≥ 0, and with α < 0 allowed the set is wrong
          (m = 2, M = 1: rows 2e₁ and −e₁ satisfy Σ w = 1 but give
          2σ(x₁) + σ(−x₁) ≠ σ(x₁)).
      (b) Lemma 7. Two minima are linearly connected iff, row by row,
          one is zero or both are positive multiples of the same e_j: a
          segment through rows with different supports has two non-zero
          entries inside it, and otherwise every point of it stays in the
          set and keeps column sums 1.
      (c) Theorem 11 (m ≥ kM). Merge each θ_i to θ_i⁰, keeping one row e_t
          per type t at a row where θ_i has type t and zeroing the rest;
          θ_i ↔ θ_i⁰ by (b). The non-zero rows of θ_1⁰, …, θ_{k−1}⁰ number at
          most (k−1)M, so at least m − (k−1)M ≥ M rows are zero in all of
          them. On M such rows put e_1, …, e_M, matching θ_k⁰'s type where
          θ_k⁰ is non-zero and filling the other types into the rest; zero
          elsewhere. That centre is a minimum linearly connected to every
          θ_i⁰, hence two-piece-linearly connected to every θ_i.
      (d) Theorem 18 (deep linear network, depth L, width m, y = Qx with
          non-degenerate input covariance, minima A_L⋯A₁ = Q). The
          interpolated product Π_l (tA_l^{(i)} + (1−t)A_l*) is a polynomial in
          t whose coefficient of t^k(1−t)^{L−k} is σ_{i,k,L}, the sum over
          the products with k factors from θ_i. It equals Q for all t iff
          σ_{i,k,L} = C(L,k)Q for all i, k. Choosing A_L*, …, A₂* in turn by
          Lemma 25 keeps the (w+1)r + 1 partial products independent at each
          step (needs m > (w+1)r + 1, i.e. m > (L−1)r + 1 at the last). Then
          the (L−1)r + 1 equations for A₁* have independent coefficient rows
          and are solvable column by column. Requires the general-position
          condition (Assumption 26: the r partial products A_L^{(i)}⋯A_{L−k+1}^{(i)}
          independent for each k), which the paper says fails on a null set
          of M^{⊗r}; that measure claim is stated, not argued. Lemma 25's
          hypothesis "r₁ > q" should read r₁ ≥ p; it is applied with r₁ = m,
          where both hold.
  excluded: >-
    (1) Theorem 10, the probabilistic star-shaped linear connectivity. Its
    proof (A.4, following A.2) takes "Unif(M)" on a set made of pieces of
    different dimension without defining it, treats the rows as independent
    and uniform over the M + 1 neuron types, and then uses the chance 1/M²
    where that model gives 1/(M+1)². The bound is not derived. (2) Everything
    the parent THEORY-110 claims about trained networks: the star domain
    of SGD solutions modulo permutation, below the width at which they
    become convex. Its batch-037 verdict stands.
