scope:
  accepted: >-
    The three derivations, as a new demonstrated, Active CLAIM. Each was
    checked for this review.
    (1) Constant kernels. If K_C(· | s) = q for every s, then (K_C)# e = q for
    every distribution e. So the across-items condition holds for every u
    only if ē^t(· | u) = q for every u. Whenever the averaged target
    responses vary with the item, a constant kernel fails the condition.
    (2) Exact fit is a garbling. If ē^t(· | u) = (K_C)# e^o(· | u) for every u,
    then, indexed by the item u, the target family is the kernel K_C
    applied to the source family. That is the definition of a garbling,
    with u as the common parameter, and it needs no theorem.
    (3) Deficiency is a finite computation. With finitely many items and
    finite judgement outcome sets, Le Cam's deficiency
    min over stochastic M of max over u of TV(M# e^o(· | u), ē^t(· | u)) is the
    stated linear programme. M# e^o is linear in M, the slacks linearize the
    absolute values, and t bounds each half-sum. For a finite family Q of
    problems with finite action sets, fix a target rule ρ_t. The inner
    infimum over source rules ρ_s of max_u [R_s(ρ_s, u) − R_t(ρ_t, u)] is a
    linear programme. As a function of ρ_t, max_u of an affine function in
    (ρ_s, ρ_t) is jointly convex, and partial minimisation keeps it convex.
    So the outer supremum over the product of simplices is attained at a
    vertex, a deterministic rule, of which there are finitely many.
    The new claim rests on CLAIM-011 only for the held-out scoring, which is
    a definition. It needs no ground for (1)–(3), and THEORY-717 (Active)
    covers the finite garbling vocabulary.
  excluded: >-
    What CLAIM-228 keeps, Proposed: that fidelity so restated is the right
    target and is informative. Its defeat condition is the discriminating
    study (CASE-055), which is empirical. So its warrant should be corrected
    to empirical, as in NOTES batch-000 pattern 1. The single-rendering
    clause and the procedure-level framing stay with it. CLAIM-200's granted
    objection (Active) was answered by version 2's restatement.
