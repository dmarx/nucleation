scope:
  accepted: >-
    Nothing for promotion. The persistence criterion is the majority view
    in a survey written by its leading opponent. Olson's too-many-thinkers
    objection is reported and its replies are called hard to defend
    (NOTE-374 C6). Brain-state transfer is left open. The account stays
    Proposed.
  excluded: >-
    The title's exclusive "only when ... with a clause against branching".
    The entry's own body, and the sources it cites, contradict it on two
    points.
      (1) Fission. The survey's §5 is a dilemma: fission forces either
          multiple occupancy or a non-branching clause (NOTE-374 C5,
          "strong as a dilemma"). The body says so ("Fission then forces
          either multiple occupancy or a non-branching clause"). The title
          makes the non-branching clause a requirement. Parfit gives it as
          a sufficient condition only (NOTE-378 C4).
      (2) Circularity. In the body and in the survey, circularity is
          answered by quasi-memory (Parfit), and gaps by causal dependence
          (Shoemaker). The title gives overlapping chains of causally
          dependent states as the only repair, and does not mention
          quasi-memory. Nothing in the record shows these repairs to be
          the only ones. The survey reports them as the answers it knows.
evidence:
