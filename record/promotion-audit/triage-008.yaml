    source:
    - LIT-787
  THEORY-332:
    disposition: narrow-and-promote
    old_title: For one index with no space limit, Bruno and Chaudhuri's online tuner, which builds the
      index once the savings it would have given have risen by its build cost above their last low and
      drops it once they have fallen by the build cost below their last high, can cost nearly three times
