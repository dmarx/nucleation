notes: >-
  Hand label and classifier agree on "theorem", but only the
  idealized-model half is formal. This is a split, not a narrowing,
  because THEORY-209's subject is converged deep networks, which a
  measurement could still settle. Narrowing it to the model would change
  its subject. It also falls under the open owner question on splitting
  textbook or toy-model theorems (THEORY-110, THEORY-673). The model here
  is a toy, but it is the paper's own result, not a textbook one. The
  anthology-candidate flag stays on THEORY-209; ADR-048 does not ask for
  a check.
