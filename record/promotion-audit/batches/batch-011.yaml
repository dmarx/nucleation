notes_for_ledger:
  - >-
    The tag misleads triage. triage-003 drew wave 2 from THEORYs tagged
    "mathematics", but THEORY-022, -191 and -192 are empirical.
    Interpretability and Betti-curve studies carry the tag for their
    tools. Classify by what the title asserts: a theorem, or a
    measurement.
  - >-
    Bounded Gromov δ from a tree decomposition with clique bags. If a graph
    has a tree decomposition whose bags have diameter ≤ 1, its geodesic
    triangles are 2-thin. Take the node of the tripod spanned by the three
    corners' bags that is nearest a bag of p; its bag separates p from the
    two corners. This settles hyperbolicity for any complex grown by
    gluing on single faces (stacked polytopes, k-trees, Apollonian
    networks), and is worth reusing when a promote_when asks for "δ
    bounded independently of N".
  - >-
    "A tree of X tiles H^d" fails for d ≥ 3. In a face-to-face tiling,
    tiles around a codimension-2 face form a finite cycle, and a tree of
    simplices has none. It holds in d = 2 only because the codimension-2
    faces of ideal triangles are at infinity. Check any "tiling by a tree
    of cells" claim this way.
  - >-
    "The dual is a tree" depends on the flavor. With preferential or
    uniform gluing (s = 0, 1), several simplices share a face, so the
    face-adjacency graph has cliques. The gluing or parent structure is
    always a tree; say which one is meant.
