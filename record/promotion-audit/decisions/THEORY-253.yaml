scope:
  accepted: >-
    ADR-047 v3: one study, Liu, Liu, Michaud, Gore and Tegmark (2025), read
    in full in NOTE-794, whose text states the results it rests on: under
    SGD task 2's time grows "roughly ∼ 1/p₂"; under SignGD t₂/t₁ saturates
    at 2; on the rotated quadratic SignGD learns all four directions
    together when R = I and in sequence when R = H₄, while SGD is the same
    for both. The gradient-descent half also follows analytically: with
    orthonormal task vectors the loss decouples and each skill evolves at a
    rate set by its weight p_i.

    Reproduced here (full batch, deterministic, n_dim = 1000, squared loss,
    threshold s ≥ 0.9): GD times scale with 1/p₂; SignGD t₂/t₁ = 1.00,
    1.48, 1.76, 1.88, 2.02 at p₁ = 0.5, 0.8, 0.9, 0.95, 0.99. On the
    quadratic x₁² + 0.1x₂² + 0.01x₃² + 0.001x₄², SignGD halves all four
    coordinates at the same step for R = I and at steps 250, 729, 1171,
    1730 for R = H₄; GD is identical under both.
  excluded: >-
    "Sequential onset of acquisition comes from the optimizer" as a general
    cause: in this model it needs both sign descent and loss eigendirections
    misaligned with the coordinates (the quadratic), and the many-task
    Domino form holds "only for large α and the first few skills". The
    Resource and Domino models are fitted, not derived. Real networks,
    Adam's place between the two, and dependency-driven sequence stay out.
evidence:
