scope:
  accepted: >-
    The title's first clause is a derivation, and it re-derives (ADR-047
    v2). Ancestors i with frequency q_i, character z_i and fitness w_i
    (descendant count), descendants' mean character z'_i, Delta z_i =
    z'_i - z_i, closed population (every descendant assigned to an
    ancestor). Descendant frequencies q'_i = q_i w_i / w-bar, so
    z-bar' = sum q_i w_i z'_i / w-bar and
    w-bar Delta z-bar = sum q_i w_i (z_i + Delta z_i) - w-bar sum q_i z_i
    = Cov(w, z) + E(w Delta z). Equivalently, with relative fitness
    omega = w / w-bar, Delta z-bar = Cov(omega, z) + E(omega Delta z). No
    assumption beyond closure and the mapping is used, and the interval is
    arbitrary. The rest of the title, the generalization-sketch reading and
    the reply to the tautology and predictive-power charges, is the
    paper's argument (NOTE-101: moderate by analogy; the tautology reply
    answers the word, conceded in §7.2).
  excluded: >-
