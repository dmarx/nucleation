  yield was 2 of 2, as before. THEORY-183 is the batch-010 shape: a
  theorem read and followed in full, with a promote_when aimed at the
  empirical carry-over. THEORY-193 is new. Its promote_when asked for a
  proof the source lacks (bounded Gromov δ for the 1-skeleton), and a
  short tree-decomposition argument supplies it (δ ≤ 2, every flavor).
  But the review also found the title's tiling clause false for d ≥ 3.
recommendation: >-
  Before the next wave-2 batch, drop from wave 2 the pending entries whose
