evidence:
  - "NOTE-787 claims table: C1 (Theorem IV.8) 'strong; proof via (C.4) and Lemma C.4, read'. C2–C4 are also 'strong', from proofs read."
  - >-
    Lemma C.4's covering argument, re-sketched for this review. Let
    m = K(A | x) and s = ⌈log |A|⌉. Enumerate the family F of sets of
    complexity at most K(A) and size at most 2^s, so |F| ≤ 2^(K(A)+1).
    If x lay in fewer than about 2^m members of F, A could be named from
    x with fewer than m bits, so x lies in at least 2^(m − O(log n)) of
    them. At most |F|·2^s / 2^(m − O(log n)) points lie in that many
    members. Grouping those points into consecutive blocks of 2^s in
    enumeration order gives about 2^(K(A) − m + O(log n)) blocks, each
    named by its index and the parameters. So x lies in a set S of size at
    most 2^s with K(S) ≤ K(A) − K(A | x) + O(log n). This is the paper's
    route, at O(log n) precision, so it adds confidence but is not the
    independent derivation the promote_when asks for.
