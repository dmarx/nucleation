scope:
  accepted: >-
    Nothing is promoted. The correction is to the warrant. The title's main
    clause, that interpretive framing operations generally do not commute,
    is an empirical generalization about how the order of framing prompts
    changes later pragmatic judgements. Its defeat condition is purely
    empirical ("In controlled designs the order of framing prompts makes no
    difference, beyond noise"), and the body says "It is untested". Under
    ADR-043 that is `empirical` (supported by observation or experiment,
    scoped to the evidence), not `interpretive` (conceptual argument,
    analogy or synthesis). The second clause, that order effects can be
    investigated without committing to quantum probability, needs no
    separate warrant: classical sequential and context-dependent-marginal
    models describe order effects, the separation LIT-264 (Active) draws.
  excluded: >-
    The generalization itself. The record holds no study of framing-prompt
    order on pragmatic judgements. CASE-021 is a proposed study, not run.
    THEORY-166 (Proposed) is about survey question-order effects, a
    neighbouring but different domain, and is not evidence for this one.
