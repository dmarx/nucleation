  Batch 020's sort rule puts this title with the measurements. Its form
  is a hedged existence claim ("can"), its evidence is a model run, and
  its overreach is the step from the model to cells. That is THEORY-295's
  shape, so the narrowing follows THEORY-295's: name the model in the
  title. The re-derivation attempt is recorded because it changed the
  narrowed wording. The paper's necessity argument is stated as general,
  but a free negative oscillator defeats it under synchronous updating.
