scope:
  accepted: >-
    The readout half, re-grounded on two THEORYs and one line of algebra. On
    a finite set of M stimuli, a regularized linear readout with
    G = aC_X + bI decodes only through K = X G⁻¹ Xᵀ/M (THEORY-008). By the
    push-through identity, K = Γ(aΓ + bI)⁻¹ with Γ = XXᵀ/M. For b > 0 the
    map t ↦ t/(at + b) is injective on t ≥ 0, so Γ = bK(I − aK)⁻¹: K fixes
    the Gram matrix. THEORY-004 (Active) then fixes X up to an orthogonal
    transformation, after centring. So readouts with b > 0 cannot tell apart
    two representations exactly when they differ by an orthogonal map. For
    the CCA member (a = 1, b = 0), K = UUᵀ is the projection onto the
    column space and fixes X only up to an invertible linear map, which is
    THEORY-018's (Active) situation for softmax layers.
  excluded: >-
    The clauses grounded on THEORY-002 and THEORY-019 (both Proposed): that
    kernels fix representations "up to the symmetry group of what is
    observed", which is a statement about converging kernels and the
    data's symmetries, not about the representation's orthogonal freedom;
    and that degeneracy does not identify the symmetry. Also the gloss
    "supplied by the analyst".
evidence:
  - "Push-through: X(cXᵀX + bI)⁻¹Xᵀ = XXᵀ(cXXᵀ + bI)⁻¹, with c = a/M; checked by the thin SVD X = USVᵀ, which gives K = U diag(s²/(as² + bM)) Uᵀ."
  - "THEORY-004 (Active): a centred kernel determines a representation up to a translation and an orthogonal transformation."
  - "THEORY-008 states the decoding identities on a finite stimulus set. PR #165 promotes it confined to finite M. Until #165 merges it is Proposed on main."
