follow_up_prs:
  - "THEORY-111: split. A new Active THEORY holds Zhou et al.'s Theorem 1 and Lemma 1, and the exact one-hidden-layer case from Lubana et al.'s Lemma 2, with re-derivations. THEORY-111 extends it and stays Proposed."
  - "THEORY-369: narrow-and-promote, for fixed N and blocks of at least two points, with the five-step concentration proof as a dated note."
