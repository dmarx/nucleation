scope:
  accepted: >-
    Restate the title, not the defeater. The title says a translation
    "can" broaden one dimension while narrowing another, which one
    instance settles. The defeater since version 2 (2026-10-10) is a
    prevalence test: in a sample drawn by a rule stated in advance, the
    rate of renderings that lose on one dimension and gain on another is
    no greater than a rate fixed in advance. The history says the
    restatement was deliberate, after CLAIM-238, and CLAIM-238 (Active,
    granted) names the remedy: "each possibility thesis given a claim of
    prevalence or magnitude that a study could defeat". Restoring an
    instance-failure defeater would undo that choice and leave the
    claim with nothing a study could defeat, while the main thesis needs
    prevalence from it (CLAIM-238, on CLAIM-115 resting on CLAIM-061).
    The possibility itself is not lost: it is Jakobson's point, held by
    THEORY-170 and instanced in the body (LIT-786, NOTE-614, CASE-012).
    Proposed title: "In published translations, renderings that lose
    distinctions along one dimension commonly gain specificity along
    another, so loss is not one-dimensional".
  excluded: >-
    The warrant. It stays interpretive: no sample has been drawn, so the
    claim has no observation under it (ADR-043 v2, present support).
    The status stays Proposed.
