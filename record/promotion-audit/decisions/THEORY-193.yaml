notes: >-
  This is the fourth scope error in a correct construction, after
  CLAIM-264, CLAIM-123 and THEORY-686. NOTES' test of "the smallest
  degenerate case" would have caught it at d = 3, with the cycle of
  tetrahedra around an edge. The result also turns the entry's own moral
  around. Its last clause says the curvature is a convention, but the
  network's coarse geometry is hyperbolic whatever convention is drawn,
  and only the constant-curvature picture is chosen. The bound needs only
  that the complex is grown by gluing on single faces. That makes it a
  record-own result about a class of graphs, so a CLAIM could hold it
  under ADR-032. It is kept inside the THEORY because the promote_when
  asks for exactly it, and ADR-047 v2 lets a re-derivation in the decision
  file meet that request.
