notes: >-
  NOTE-763 gives the dual balls' radii as (1−γ)/6 and (1−γ)/2. They are
  6/(1−γ) and 2/(1−γ): Lemma 1's maximum must reach
  (6∂C_X + 6∂C_Y + 2∂F)/(1−γ) to dominate twice the rounding error, and the
  step sizes β ∝ 1/(1−γ) match. The promotion PR adds a dated correction to
  NOTE-763. Narrowing: the title says "from sampled transitions"; the theorem
  needs independent draws from each chain's discounted state-pair occupancy
  (restarts), observed finite states and a known cost bounded by 1, and the
  bound holds with probability 1 − δ, polynomial also in 1/(1−γ) and
  log(1/δ).
