scope:
  accepted: >-
    Narrowed to the fixed-point form. For finite action-free labelled chains
    and γ in (0, 1), the bisimulation metric, taken as the unique fixed point
    of Ferns et al.'s equation, equals the bicausal transport cost with
    ground cost (1−γ)|r(x)−r(y)|. That cost is (1/(1−γ)) times the minimum
    of ⟨µ, c⟩ over occupancy couplings satisfying the flow constraint and
    the two coherence constraints. Both steps were checked for this review
    by a route independent of the paper's text.
    (1) Identification: T V(xy) = c(xy) + γ min over p in Π_xy of Σ p V is a
    γ-contraction in sup norm, since a minimum over one fixed set of linear
    functionals is 1-Lipschitz. Eq. 3 and Eq. 5 are the same operator when
    c = (1−γ)|r(x) − r(y)|, so their unique fixed points coincide.
    (2) Lemma 1, as the occupancy-measure LP of a finite MDP whose states
    are pairs and whose actions are couplings in Π_xy. A stationary
    coupling π gives µ_π satisfying flow and coherence. Conversely, from a
    feasible µ, set π = µ/ν where ν > 0, and any coupling elsewhere.
    Coherence makes π a coupling of the marginals. ν then solves
    νᵀ = (1−γ)δᵀ + γνᵀZ_π, which has a unique solution because I − γZ_π is
    invertible, so µ = µ_π. The objective is the discounted cost, and the
    minimum over stationary couplings is W_γ by Theorem 3.
  excluded: >-
    That this fixed point equals the logical bisimulation metric, a
    supremum over a grammar of functional expressions, and that distance
    zero means bisimilar. Both are cited to van Breugel & Worrell (2001) and
    Desharnais et al. (2002), not proved in LIT-962 (NOTE-757 C6,
    "second-hand"). The title's "the discounted bisimulation metric"
    should name the fixed-point definition, with the logical
    characterisation moved to "What this does not say" as cited.
