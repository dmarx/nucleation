route: source (ADR-047 v3)
scope:
  accepted: >-
    Nothing yet. Batch 035's narrowed title would itself need narrowing.
    Appendix III of the 1969 Russian edition (HTML at gumer.info) says the
    order was checked on the schemes of 45 tales, not 100. Five of the
    fifty tabulated tales were excluded: No. 94 as being of a different
    kind, and Nos. 123, 127, 139 and 159 because their moves are interrupted
    too often and "the canonical sequence is also not strictly kept". A v3
    title that claims no more than was measured would read roughly: "In 45
    of Afanasyev's tales 50-151, as Propp coded and selected them, the
    functions occur in one order up to the inversions and swaps he names."
  excluded: >-
    The title as written, for batch 035's two reasons, both still holding.
    First, it generalises from the corpus to the class. Second, the per-tale
    schemes behind the order claim are still unread. Appendix III says they
    are printed "на вклейке", on a fold-out insert, which the HTML does not
    reproduce, and the 1968 English edition at the Internet Archive is
    lending-restricted. A third reason is now on record: the sample was
    filtered on the property the claim asserts, since tales were dropped in
    part because their order was not strictly canonical. That makes the
    order invariance partly a selection effect.
