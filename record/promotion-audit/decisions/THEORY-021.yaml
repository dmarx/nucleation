  accepted: >-
    The algebra for the exact configurations, which is what the title should
    say: the regular polygons, the tetrahedron, antipodal pairs, and tegum
    products of these in mutually orthogonal subspaces that together span
    ℝ^m. For these, Σᵢ Dᵢ ŵᵢŵᵢᵀ = I, so {Dᵢ ŵᵢŵᵢᵀ} is a rank-one POVM. For a
    single tight factor of n unit vectors in m dimensions, Dᵢ = m/n, and it
