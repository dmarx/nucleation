    Lin et al.'s Theorem 6 allows α ≠ 0 where its proof gives α > 0, and
    their Theorem 10's probability is not derived; Goldwasser et al.'s
    App. C.1 computes τ(A_i) as if A_i ⊆ T. None changed a bound the record
    keeps, but each changes what may be quoted.
  - >-
    The split pattern (ADR-040, THEORY-109) recurs for empirical
    conjectures that cite toy-model theorems: THEORY-110 now, and the
    false flags batch 037 named. Check the cited theorems' proofs once,
    then split, rather than re-reviewing the conjecture.
  - >-
