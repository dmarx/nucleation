notes_for_ledger:
  - >-
    A reconstruction can show that a toy is not recoverable from the
    record. For THEORY-320, rebuilding the toy graph from NOTE-833's
    description reproduced Theorem 5.2 exactly, but not Theorem 5.3's
    threshold or Lemma 5.4's harm case. That shows the set-up is
    underdetermined, not that the paper is wrong. Record the
    reconstruction and its mismatches in the decision file, so the next
    reading of appendix B can settle it in one round.
  - >-
    The Donsker–Varadhan approximation gap closes by two-sided truncation.
    The negative part of log dP/dQ is P-integrable whenever MI is finite:
    ∫ p log(q/p) over {p < q} is at most 1, by log x ≤ x − 1. The
    estimation gap closes by weak convergence of the empirical measures,
    uniform over an equicontinuous family. Both are reusable for other
    variational-bound estimators (NWJ, InfoNCE) the record may hold.
  - >-
    Representer theorems over the completed RKHS need only projection onto
    a finite span and strict monotonicity. Existence needs lower
    semicontinuity and coercivity, and a counterexample without lower
    semicontinuity takes one line. Use this template when other kernel
    results are stated over expansion classes rather than H_k.
