finding: >-
  Triage-003's bundling score did not rank better than triage-002's
  keywords, because it barely ranks at all. 27 of the 34 eligible
  mathematics THEORYs score the full 3, so within the top group the order is
  the tie-break (supported claims, then code). Its yield, 4 of 4, adds to
  wave 2's run of 15 of 16 for the keyword group and 4 of 5 for the control.
  At these sample sizes none of these can be told apart. What the batches
  show is that the class itself, Proposed mathematics THEORYs with a
  promote_when, yields at roughly 80–100%. Within it, neither scoring
  method finds the rare non-yielders (THEORY-106, THEORY-277). The useful
  discriminator is the one each review applies by hand: does the
  promote_when test the title, or something the title does not claim? Two
  kinds of non-test recurred here. THEORY-014's promote_when tests a claim
  the body explicitly disclaims (a bridge between formalisms). THEORY-084,
  -180, -565 and -021 bundle a proved or record-provable core with an
  empirical or analytic extension. The first is a promote with the
  condition moved to a QUESTION; the second is a split or narrowing.
recommendation: >-
  Don't spend more effort on triage within wave 2. Review the remaining
  eligible mathematics THEORYs, triage-003's other 16 and the 14 below it,
  in code order, five per batch. Expect a high yield and an occasional
  defer. The ranking is no better than code order, and code order is easy
  to resume. Start wave 3 (source-backed THEORYs outside mathematics) in
  parallel, with its own control sample from the first batch, since
  ADR-047 v2's re-derivation route is rarely available there.
