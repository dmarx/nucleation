      not of a uniform Euclidean cube, and human odour-descriptor profiles have that of a full three-dimensional
      hyperbolic ball
    new_title: In four natural odour sources (strawberry, tomato, blueberry and mouse-urine volatiles),
      the rank order of correlations between compound concentrations has the Betti-curve signature of
      points near the boundary of a three-dimensional hyperbolic ball, not of any uniform Euclidean cube
      tried, and human odour-descriptor profiles for 127 odorants have that of a full three-dimensional
      hyperbolic ball
    source:
    - LIT-872
  THEORY-192:
    disposition: narrow-and-promote
    old_title: Pairwise correlations among rat CA1 place cells have the Betti-curve signature of points
      sampled uniformly from a three-dimensional hyperbolic ball, not of a low-dimensional Euclidean cube,
      and the fitted radius grows with the logarithm of exploration time
    new_title: In twelve sessions of rat dorsal CA1 from three data sets, pairwise correlations among
      place cells have the Betti-curve signature of points sampled uniformly from a three-dimensional
      hyperbolic ball, not of a low-dimensional Euclidean cube, and the fitted radius rose with the logarithm
      of exploration time
    source:
    - LIT-876
  THEORY-194:
    disposition: narrow-and-promote
    old_title: 'For the 1D and 2D Ising and 2D dimer models, the block coarse-graining that maximizes
      mutual information with the system beyond a buffer around the block is the renormalization-group
      relevant one, while a coarse-graining fitted to reproduce the data distribution is not: which variables
      a compression keeps is set by what it must stay informative about'
    new_title: On Monte Carlo samples of the 2D Ising model and of the 2D dimer model with added noise
      spins, a block coarse-graining trained to maximize mutual information with the system beyond a buffer
      recovered the variables renormalization already uses (Kadanoff block spins; the dimers' low-momentum
      electric fields, with no weight on the noise), and iterated on 128 × 128 Ising samples gave the
      flow away from the critical point, locating it to about 1% and giving ν ≈ 1.0 ± 0.15, while a restricted
      Boltzmann machine trained by contrastive divergence on the noisy dimer data coupled to the noise
      and to columnar patterns instead
    source:
    - LIT-873
    - LIT-881
    - LIT-878
    - LIT-885
    - LIT-889
    pr_branch: claude/promote-theory-194
    decision_on: claude/promotion-audit-batch-061
  THEORY-195:
    disposition: narrow-and-promote
    old_title: On data generated by a random hierarchical grammar, deep networks that learn features need
      a number of examples polynomial in the input dimension, about n_c m^L, which is where the class
      statistics of input patches, equal for interchangeable patches, rise above sampling noise and where
      hidden layers become invariant to swapping them; shallow and fixed-kernel learners need an exponential
      number, and so do deep ones when those statistics are removed
    new_title: On the Random Hierarchy Model, in the experiments reported (s = 2, L ≤ 4, small v), deep
      CNNs matched to the tree and trained in a feature-learning regime reach a tenth of chance error
      from about n_c m^L examples, polynomial in the input dimension, at the training-set size at which
      their hidden layers become invariant to swapping synonymous tuples; two-layer networks and the same
      CNNs as fixed kernels need a number proportional to the whole input space, exponential in the input
      dimension, and deep CNNs stay near chance when every tuple is made equally likely in every class
    source:
    - LIT-877
  THEORY-197:
    disposition: promote
    old_title: Mehta and Schwab's correspondence between Kadanoff's variational renormalization group
      and restricted Boltzmann machines is an identity of parametrizations, under which an exact RG step
      is a perfect fit of the data distribution; away from that point it does not make training by distribution
      fitting a renormalization
    new_title: (unchanged)
    source:
    - LIT-882
    - LIT-873
    - LIT-887
    - LIT-891
  THEORY-198:
    disposition: narrow-and-promote
    old_title: For a finite-range lattice Hamiltonian, a block coarse-graining that keeps all the mutual
      information the block shares with the system beyond a buffer makes the coarse measure factorize
      across the block, so the renormalized Hamiltonian gains no range and, in 1D, product disorder gains
      no correlations across the block; the coarse-grainings actually optimized fall short of that condition,
      and for them the link is shown only numerically, in 1D
    new_title: For a finite-range lattice Hamiltonian, a block coarse-graining that keeps all the mutual
      information the block shares with the system beyond a buffer makes the coarse measure factorize
      across the block, in 1D and, in D dimensions, when capture by a hyperplane of blocks amounts to
      capture by each block; barring exact cancellation of existing couplings, the renormalized Hamiltonian
      then gains no range, and in 1D product disorder gains no correlations across the block. The coarse-grainings
      actually optimized fall short of that condition, and for them the link is computed only for two-spin
      blocks of 1D Ising chains
    source:
    - LIT-881
  THEORY-202:
    disposition: narrow-and-promote
    old_title: 'In variational renormalization, neither a matched partition function nor Kadanoff''s exact
      trace condition makes a coarse-graining a renormalization: the first holds for joint Hamiltonians
      whose marginal is not the data, the second for hidden variables that do not interact with the system,
      so the variables a renormalization keeps must be fixed by a stated target'
    new_title: 'In variational renormalization over general Boltzmann machines, neither a matched partition
      function nor Kadanoff''s exact trace condition makes a coarse-graining a renormalization: the first
      holds for joint Hamiltonians whose marginal is not the data, the second for hidden variables that
      do not interact with the system, so the variables a renormalization keeps must be fixed by a further
      stated condition'
    source:
    - LIT-887
    - LIT-882
  THEORY-204:
    disposition: narrow-and-promote
    old_title: In data-limited next-token prediction, the test loss falls as P^(−γ/(2β)), where β is the
      decay with lag of the strongest token–token covariance and γ the decay of next-token conditional
      entropy with context length, because P tokens resolve correlations only out to a horizon n*(P) ~
      P^(1/(2β)) and the loss is the entropy at that horizon, provided the learner uses the tokens inside
      the horizon faster than the horizon grows
    new_title: On TinyStories and WikiText-103, the data-limited exponent of transformer test loss, fitted
      to the lower envelope of learning curves across context lengths at up to about 10^8 training tokens,
      overlaps γ/(2β), where β is the decay with lag of the top singular value of the token–token covariance
      and γ the decay of next-token conditional entropy with context length; under assumed per-lag scaling
      forms, a horizon n*(P) ~ P^(1/(2β)) gives the exponent min(δ, γ/(2β)), δ being the decay rate of
      the within-horizon excess losses
    source:
    - LIT-888
    - LIT-883
    pr_branch: claude/promote-theories-204-243
    decision_on: claude/promotion-audit-batch-062
  THEORY-205:
    disposition: narrow-and-promote
    old_title: 'For a short-range lattice model on a cylinder, with block and environment as slabs separated
      by a buffer, the information-bottleneck encoder at its first transition depends on the block only
      through the boundary weak value of the leading transfer-matrix eigenvector, at β_c = (λ0/λ1)^(2L_B):
      at large circumference this is the lowest-dimension primary, so the first feature information-theoretic
      relevance selects is the most RG-relevant operator; nothing is shown for blocks inside a buffer
      shell or for the fixed-alphabet RSMI optimum'
    new_title: For a short-range lattice model on a cylinder with a symmetric transfer matrix whose leading
      excited eigenvalue is non-degenerate, with block and environment as slabs L_B transfer steps apart,
      the uninformative information-bottleneck encoder first loses stability at β = (λ0/λ1)^(2L_B), in
      the direction of the boundary weak value of the leading excited eigenvector, which by the cited
      conformal finite-size relation is the lowest-dimension primary at large circumference; the uninformative
      encoder can stop being optimal at a smaller β, and nothing is shown for blocks inside a buffer shell
      or for the fixed-alphabet RSMI optimum
    source:
    - LIT-885
  THEORY-206:
    disposition: narrow-and-promote
    old_title: 'For networks of smooth units without biases, one hidden layer needs exactly ∏(rᵢ+1) neurons
      to approximate the monomial x₁^r₁⋯xₙ^rₙ and a deep network O(Σ log rᵢ), so the cost of flattening
      a polynomial grows exponentially with its degree in distinct variables and not with the number of
      inputs: products of many inputs separate depths, bounded-degree polynomials do not'
    new_title: 'For networks of smooth units without biases, one hidden layer needs exactly ∏(rᵢ+1) neurons
      to match the monomial x₁^r₁⋯xₙ^rₙ''s Taylor polynomial at the origin, and a deep network O(Σ log
      rᵢ), with the upper bounds holding for uniform approximation too, so the cost of flattening a polynomial
      grows exponentially with its degree in distinct variables and not with the number of inputs: products
      of many inputs separate depths, bounded-degree polynomials do not'
    source:
    - LIT-890
    - LIT-887
  THEORY-211:
    disposition: narrow-and-promote
    old_title: Along a rescaling symmetry, minibatch noise drives SGD to the point where the gradient
      noise of the two parameter groups balances, at a rate set by learning rate over batch size, so at
      stationarity SGD neither stays where gradient flow would leave it nor diffuses as isotropic noise
      would, and differs from gradient descent by a finite amount however small the noise
    new_title: In the stochastic-differential-equation model of SGD, with a gradient-noise covariance
      that depends on the parameters, minibatch noise drives the difference of squared norms along a rescaling
      symmetry, at a rate proportional to learning rate over batch size, to the point on the symmetry
      orbit where the gradient-noise traces of the two parameter groups are equal, whenever both groups
      carry noise; so at stationarity SGD neither keeps the difference fixed, as gradient flow does, nor
      lets it diffuse, as isotropic noise does, and differs from gradient descent by a finite amount however
      small the noise
    source:
    - LIT-1012
    - LIT-1013
  THEORY-213:
    disposition: narrow-and-promote
    old_title: Every mirror symmetry of a network's loss makes its symmetric subspace absorbing for gradient-based
      training, and weight decay above a threshold or strong gradient noise makes that subspace favoured,
      so rescaling symmetry yields sparsity, rotation symmetry low rank, and permutation symmetry merged,
      identical neurons
    new_title: Every mirror symmetry of a network's per-sample loss makes its symmetric subspace invariant
      under gradient descent and SGD, and when the loss's Hessian is bounded below by −c, weight decay
      γ‖θ‖² with γ > c/2 puts every minimum in that subspace; rescaling symmetries that hold at λ = −1,
      rotation symmetries and permutation symmetries contain such mirrors, whose subspaces are zeroed
      weights, reduced rank and identical neurons
    source:
    - LIT-1014
  THEORY-216:
    disposition: narrow-and-promote
    old_title: On a contested shared canvas, lasting artworks are those whose coalitions keep working
      under continual overwriting, participants consolidate into large coalitions as the event proceeds,
      and which coalitions survive is barely predictable from their size, area, start time and colour
      complexity until late
    new_title: On the 2017 r/place log, with coalitions recovered from co-placement, which coalitions
      survive is barely predictable early from their size, area, start time and colour entropy, the size
      distribution of recovered coalitions shifts toward large ones as the event proceeds, and some lasting
      artworks were held by coalitions that kept working under sustained overwriting
    source:
    - LIT-1032
  THEORY-222:
    disposition: narrow-and-promote
    old_title: A coarse-grained macro description can carry more effective information than the micro
      description it supervenes on, so the scale at which a system's causal structure is most effective
      can be a macro scale
    new_title: With uniform interventions imposed separately at each level, a coarse-grained macro description
      of a known discrete mechanism can have more effective information than the micro description it
      supervenes on, so the level at which effective information is highest can be a macro level
    source:
    - LIT-1038
  THEORY-228:
    disposition: narrow-and-promote
    old_title: At the population optimum of the spectral contrastive loss, linear-probe error is bounded
      by the probability that augmentation changes the label divided by the squared sparsest-partition
      conductance of the augmentation graph
    new_title: On a finite augmentation space, at the population optimum of the spectral contrastive loss
      with k ≥ 2r, linear-probe error is bounded, up to constant and logarithmic factors, by the error
      of recovering the label from an augmentation divided by the squared sparsest-partition conductance
      of the augmentation graph
    source:
    - LIT-249
  THEORY-229:
    disposition: narrow-and-promote
    old_title: For a symmetrized Barlow Twins loss on a linear or fixed-kernel model, gradient flow from
      small initialization learns the top eigenvectors of the pairs' symmetrized cross-correlation one
      at a time, in order of eigenvalue, and ends at the minimum-norm zero-loss solution, kernel PCA
    new_title: 'For a symmetrized Barlow Twins loss on a linear or fixed-kernel model, gradient flow from
      a small initialization of common scale aligned with the top eigenvectors of the pairs'' symmetrized
      cross-correlation learns them one at a time, in order of eigenvalue, and ends at a top spectral
      solution, which is exactly a minimum-norm zero-loss solution: kernel PCA on K_Γ'
    source:
    - LIT-242
  THEORY-230:
    disposition: narrow-and-promote
    old_title: The Fisher–Rao geometry of a language model's next-token laws over a set of contexts is
      a function of its behaviour alone, so models that fit the same laws must share it; across ten architectures
      it agrees far more than activation geometry does, and only about a tenth of the shared eigenvector
      structure goes beyond what the shared laws imply
    new_title: The Fisher–Rao geometry of a language model's next-token laws over a set of contexts is
      a function of those laws alone, so models with identical laws share it, while activation geometry
      changes under invertible reparameterizations of the hidden layer that leave outputs unchanged; in
      Picozzi's ten transformer, state-space and recurrent models it agreed at a mean rank correlation
      of 0.88 against 0.62 for activation geometry, and about 9% of the top eigenvector overlap exceeded
      a null matched to the shared laws
    source:
    - LIT-936
  THEORY-231:
    disposition: promote
    old_title: Within classical realism, a generalized-noncontextuality no-go refutes Leibnizian representations,
      not realist representations as such; it rests on a stronger assumption than a Bell-like no-go and
      so applies where none exists, as in prepare-measure scenarios, but only Leibnizianity implying noncontextuality
      is proved
    new_title: (unchanged)
    source:
    - LIT-945
    - LIT-266
  THEORY-233:
    disposition: promote
    old_title: CKA and normalized Bures similarity are the Euclidean and the Bures comparison of normalized
      kernels, and each bounds the other only within a factor set by the kernels' ranks, so agreement
      in one does not carry to the other with a dimension-free constant
    new_title: (unchanged)
    source:
    - LIT-250
  THEORY-234:
    disposition: narrow-and-promote
    old_title: Two softmax next-token predictors induce the same distribution exactly when their embeddings
      and unembeddings are related by an invertible linear map on the subspaces that enter the logits,
      with arbitrary distortion off them, so a linear relational property is shared by all such models
      or none only when it lies in those subspaces
    new_title: Two softmax next-token predictors induce the same distribution exactly when their embeddings
      and unembeddings are related by an invertible linear map on the subspaces that enter the logits,
      with arbitrary distortion off them, so a linear relational property is shared by all such models
      or none when it lies in those subspaces, and can fail to be shared otherwise
    source:
    - LIT-950
  THEORY-237:
    disposition: narrow-and-promote
    old_title: The critic-based variational lower bounds on mutual information, Donsker–Varadhan, NWJ,
      MINE's and InfoNCE, are relaxations of one unnormalized Barber–Agakov bound, and each is tight only
      at a critic equal to the log density ratio up to a term its normalization leaves free
    new_title: The critic-based variational lower bounds on mutual information, Donsker–Varadhan, NWJ,
      MINE's and InfoNCE, are relaxations of one unnormalized Barber–Agakov bound, and, when the joint
      and the product of the marginals are mutually absolutely continuous, each attains its supremum over
      critics only at a critic equal to the log density ratio up to a term its normalization leaves free,
      where every bound but InfoNCE equals the mutual information
    source:
    - LIT-246
    - LIT-256
  THEORY-238:
    disposition: narrow-and-promote
    old_title: The expected generalization error of an encoder–decoder learner is bounded by the encoder
      alone, through the KL divergence of its train-and-ghost latents to a prior symmetric under label-preserving
      permutations, for any decoder, and the bound stays finite for deterministic continuous encoders
      under lossy compression
    new_title: The expected generalization error of an encoder–decoder learner is bounded by the encoder
      alone, through the KL divergence of its train-and-ghost latents to a prior symmetric under label-preserving
      permutations, for any decoder; and under lossy compression the bound can stay finite for deterministic
      continuous encoders, whose lossless bound is infinite
    source:
    - LIT-245
  THEORY-239:
    disposition: narrow-and-promote
    old_title: For any joint law of an input and a context, symmetric or not, the top-d left singular
      functions of the conditional-expectation operator are the unique d-dimensional span minimizing worst-case
      linear-probe approximation error over tasks of compatibility at least 1 − ε, with error (s₁² − (1
      − ε)²)/(s₁² − s²_{d+1})
    new_title: For any joint law of an input and a context, symmetric or not, the top-d left singular
      functions of the conditional-expectation operator attain the minimum, over d-dimensional spans,
      of worst-case linear-probe approximation error over tasks of compatibility at least 1 − ε, namely
      (s₁² − (1 − ε)²)/(s₁² − s²_{d+1}) when s_{d+1} < 1 − ε ≤ s₁, though other spans can tie
    source:
    - LIT-975
  THEORY-243:
    disposition: narrow-and-promote
    old_title: Interchange interventions on a fixed set of variables can be satisfied equally by different
      alignments related by a change of basis, so which internal direction is the mediating variable is
      fixed only relative to a chosen decomposition into units
    new_title: In the three-unit identity network x ↦ x(1, 0, 1) ↦ (0, 2, 1)·h, aligning the input with
      the third unit and aligning it with the direction (h₁ + h₂)/√2, two alignments related by an orthogonal
      change of basis, pass every interchange intervention on the input equally, so interchange interventions
      on that variable alone do not fix which internal direction mediates it
    source:
    - LIT-961
    - LIT-968
    pr_branch: claude/promote-theories-204-243
    decision_on: claude/promotion-audit-batch-062
  THEORY-244:
    disposition: narrow-and-promote
    old_title: Shannon entropy, mutual information and the distortion-rate function are the expectations
      of their Kolmogorov counterparts only to within the complexity of the source distribution
    new_title: 'For a computable source distribution f, Shannon entropy and mutual information are the
      expectations of their Kolmogorov counterparts only to within the complexity of f: 0 ≤ E K(x) − H(f)
      ≤ K(f) + O(1), and I(X;Y) − K(f) − O(1) ≤ E I(x:y) ≤ I(X;Y) + 2K(f) + O(1); Grünwald and Vitányi''s
      matching statement for the distortion-rate function rests on a step the record has not verified'
    source:
    - LIT-224
    - LIT-239
  THEORY-246:
    disposition: narrow-and-promote
    old_title: 'Training objectives that tighten the class clusters of a classifier''s last layers buy
      accuracy on the trained classes and pay for it in new tasks: among ImageNet-trained ResNet-50s,
      fixed penultimate features with more class separation transfer worse to datasets with other classes,
      the difference lies in the last few blocks, and fine-tuning removes it'
    new_title: Among ResNet-50s trained on ImageNet with nine objectives and stopped early, seven of which
      beat softmax cross-entropy's top-1 by up to 0.9 points, fixed penultimate features with more class
      separation transfer worse by linear probe to datasets whose classes are mostly not ImageNet's (Spearman
      ρ = −0.93 across the nine; mean accuracy 75.9% for softmax to 48.3% for squared error), and within
      cosine softmax a higher temperature raises separation and lowers that accuracy; the objectives'
      representations differ mainly in the last third of the network, and full fine-tuning brings mean
      transfer to within 1.3 points across them
    source:
    - LIT-1044
    pr_branch: claude/promote-theories-246-334-split-201
    decision_on: claude/promotion-audit-batch-063
  THEORY-247:
    disposition: narrow-and-promote
    old_title: For finite labelled Markov chains, the discounted bisimulation metric is a bicausal optimal-transport
      distance, and it equals the value of a finite linear program over occupancy couplings
    new_title: For finite action-free labelled Markov chains, the discounted bisimulation metric, defined
      as the unique fixed point of Ferns et al.'s equation, is a bicausal optimal-transport distance,
      and it equals the value of a finite linear program over occupancy couplings
    source:
    - LIT-962
  THEORY-248:
    disposition: narrow-and-promote
    old_title: The expected generalisation error of a learning algorithm is at most √(2σ²R/n) + ε, where
      R is the least information about the sample carried by any surrogate output whose expected generalisation
      error is within ε; I(S;W) is the lossless case, and the lossy bound stays finite where I(S;W) is
      infinite
    new_title: The expected generalisation error of a learning algorithm is at most √(2σ²R/n) + ε, where
      R is the least information about the sample carried by any surrogate output whose expected generalisation
      error is within ε; I(S;W) is the lossless case, and for an L-Lipschitz loss R is at most the rate-distortion
      function of the output's law at distortion ε/(2L), so the bound is finite wherever that function
      is, including where I(S;W) is infinite
    source:
    - LIT-236
  THEORY-253:
    disposition: narrow-and-promote
    old_title: 'In a model of independent skills with linear task vectors, sequential onset of acquisition
      comes from the optimizer: under gradient descent orthogonal skills are learned together at rates
      set by their frequencies, while under sign descent they compete for coordinate signs, so each starts
      as the previous finishes'
    new_title: In Liu, Liu, Michaud, Gore and Tegmark's Geometry model of independent skills with orthogonal
      task vectors, simulation shows skills progressing together under gradient descent, the weaker taking
      about 1/p of the time, and in sequence under sign descent, a weaker skill progressing fast only
      once a stronger is done and the ratio of their times approaching 2; on a rotated quadratic the sequence
      appears under sign descent only when the loss's eigendirections are misaligned with the coordinates
    source:
    - LIT-951
  THEORY-255:
    disposition: narrow-and-promote
    old_title: In Aerts's subspace model of Hampton's membership data, taking concept conjunction and
      disjunction as the meet and join of subspaces cannot produce overextension or underextension, so
      the guppy-type deviations need an emergent concept outside the lattice operations, while the Kolmogorov-type
      deviations can be had from a non-Boolean subspace lattice
    new_title: In Aerts's subspace model of Hampton's membership data, and in any lattice whose membership
      weight is order-preserving, whatever its negation, taking concept conjunction and disjunction as
      meet and join cannot produce overextension or underextension, so a model of the guppy-type deviations
      must take conjunction as some operation other than the meet or drop the monotone weight, while the
      Kolmogorov-type deviations can be had from the meet of a non-Boolean subspace lattice
    source:
    - LIT-934
  THEORY-256:
    disposition: narrow-and-promote
    old_title: When a sequence generator's latent dynamics factor as a tensor product, its predictive
      state embeds losslessly and linearly in orthogonal per-factor subspaces of total dimension Σ(d_n
      − 1); small transformers trained by next-token prediction on such processes settle near that dimension
      in approximately orthogonal subspaces, and reach it first even when noise makes it lossy
    new_title: When a sequence generator's latent dynamics factor as a tensor product, its predictive
      state embeds losslessly and linearly in orthogonal per-factor subspaces of total dimension Σ(d_n
      − 1); 4-layer GPT-2-style transformers trained by next-token prediction on five Mess3 and Bloch
      Walk factors settle near that dimension, in per-factor subspaces that are linearly independent and
      approximately orthogonal in their leading components, and under the token noise tested reach it
      first even when noise makes it lossy
    source:
    - LIT-986
  THEORY-259:
    disposition: narrow-and-promote
    old_title: Ideal MDL and Bayesian MAP selection under the universal prior agree only to within the
      complexity of the hypothesis's likelihood, and only among hypotheses for which the data are individually
      random
    new_title: For a recursive family of likelihoods and the universal prior, the Bayesian two-part code
      length −log Pr(D|H) − log m(H) equals the ideal-MDL length K(D|H) + K(H) plus the randomness deficiency
      of D for H, up to a constant fixed by the family; so ideal MDL and MAP selection agree to within
      a constant among hypotheses for which the data are random, and can part where they are not
    source:
    - LIT-225
  THEORY-261:
    disposition: narrow-and-promote
    old_title: In sparse distributed memory, recall of uniform random data is a signal-to-noise problem
      whose optimum activates about (2MT)^-1/3 of the hard locations, and capacity then grows with the
      number of hard locations, to about a tenth of them at 0.999 bit fidelity, not with the word length
    new_title: In sparse distributed memory, recall of uniform random data from exact cues is a signal-to-noise
      problem whose optimum activates about (2MT)^-1/3 of the hard locations, and capacity then grows
      in proportion to the number of hard locations, rising toward about a tenth of them at 0.999 bit
      fidelity, not with the word length
    source:
    - LIT-921
  THEORY-263:
    disposition: promote
    old_title: A coding rate that varies with the realised sample and output makes rate-distortion generalisation
      bounds data-dependent, and with the rate set to the pointwise information density log dP_{W|S}/dP(W)
      against a fixed prior the bound is the disintegrated PAC-Bayes bound
    new_title: (unchanged)
    source:
    - LIT-233
  THEORY-266:
    disposition: narrow-and-promote
    old_title: The average generalisation error along an optimisation trajectory is bounded by the rate-distortion
      function of the trajectory's law given the sample, plus a coupling term that carries the trajectory's
      dependence on the sample
    new_title: For a loss in [0, 1] that is L-Lipschitz in a distortion, with probability at least 1 −
      δ the average generalisation error along an optimisation trajectory is bounded, under a square root,
      by the rate-distortion function of the trajectory's law given the sample, a coupling term that carries
      the trajectory's dependence on the sample, and a distortion term 4Lε
    source:
    - LIT-233
  THEORY-267:
    disposition: narrow-and-promote
    old_title: A prediction-market price can keep most of an arbitrary shock that no trader's information
      supported for at least sixty days, because later trading undoes only part of it and undoes it ever
      more slowly
    new_title: In Rasooly and Rozzi's pre-registered randomised experiment on 817 Manifold play-money
      markets, about 59% of a ±5-point price shock that no trader's information supported was still present
      after 60 days in unresolved markets, with about 25% undone in the first week and reversion slowing
      after it; their model of finitely many risk-averse traders gives such partial, slowing reversion
      even with no learning, and the data cannot tell that from learning
    source:
    - LIT-958
  THEORY-270:
    disposition: narrow-and-promote
    old_title: Translation without parallel data is learnable from a plausibility prior over the target
      language alone, with error falling in the common ground between prior and translations, in the size
      of the source language and in the number of samples
    new_title: In Goldwasser, Gruber, Kalai and Paradise's common-nonsense model, where the source language
      and the plausibility prior are uniform over sets from which shared random nonsense is removed and
      translators are one-to-one, maximum likelihood with the prior alone translates without parallel
      data with error O(log|Θ| / (α·min(m, |T|))) with high probability, falling in the shared nonsense
      α, in the size of the source language and in the number of samples
    source:
