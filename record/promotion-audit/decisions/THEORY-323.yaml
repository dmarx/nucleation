scope:
  accepted: >-
    The finite-time growth half, for du/dt = Au with A fixed, in an
    inner-product norm. Each statement was checked for this review by its
    textbook proof.
    (1) Normal A is unitarily diagonalizable, so ‖e^(At)‖ = e^(α(A)t), with α
    the spectral abscissa.
    (2) The growth over t is the operator norm ‖e^(At)‖ = σ_max(e^(At)), and
    the optimal perturbation is its top right singular vector, by the SVD.
    (3) σ_max(e^(At)) ≥ ρ(e^(At)) = max_i |e^(λ_i t)|, so the eigenvalues give
    a floor (eq. 6).
    (4) d/dt ‖e^(At)x‖² at t = 0 is ⟨(A + A†)x, x⟩, so the initial growth rate
    of ‖e^(At)‖ is the numerical abscissa λ_max((A + A†)/2), which is positive
    for some A with every eigenvalue in the left half-plane. Witness:
    A = [[−1, M], [0, −2]] with M > 2√2, for which λ_max((A + A†)/2) =
    (−3 + √(1 + M²))/2 > 0.
    (5) Harmonic forcing: if A = EΛE⁻¹, ‖(iωI − A)⁻¹‖ ≤ κ(E)/dist(iω, Λ(A))
    (eq. 19), and the ε-pseudospectrum, the set of z with
    ‖(zI − A)⁻¹‖ > 1/ε, is exactly where eigenvalues of A + Δ with ‖Δ‖ < ε can
    go (eq. 13).
    Both sources were read in full (NOTE-831, NOTE-839).
  excluded: >-
    The forced-variance clause of the title: under white noise, the variance
    trace(P), with AP + PA† + I = 0, is at least the sum of the pole
    contributions Σ 1/(−2 Re λ_i), "with equality only when A is normal".
    LIT-931 eq. 22 cites it to Ioannou (1995) and does not prove it, and the
    record has not read Ioannou. The promote_when's third clause is exactly
    this, so it stays, narrowed to it.
