  accepted: Nothing new. The proved part is the converse, and it is already Active as THEORY-732 (iii).
  excluded: >-
    The title's stated direction: a barrier that survives symmetry removal
    implies different mechanisms. Equivalently, the same mechanism implies
    a linear connection up to permutation. The body says it "is proved
    nowhere". The deep-network evidence for it is one synthetic-cue
    fine-tuning protocol (LIT-669 Fig. 5), in which barrier and cue
    reliance co-occur, and that is not a test of the implication. What
    LIT-669 App. F.3 proves (Lemma 2, Lemma 4, Theorem 1) is the converse:
    in a one-hidden-layer ReLU network with interpolating minima, linear
    mode connectivity forces identical activation patterns, so models
    relying on attributes of different complexity are not connected under
    any permutation.
