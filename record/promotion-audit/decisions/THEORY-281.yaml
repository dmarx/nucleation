scope:
  accepted: >-
    Re-derived here (ADR-047 v2), for X with finite support, a concept A
    and an erasure Z produced from X alone (possibly with independent
    randomness), so A → X → Z.

    (1) The cap. I(Z; X, A) expands two ways: I(Z;X) + I(Z;A|X) =
    I(Z;A) + I(Z;X|A). The Markov condition gives I(Z;A|X) = 0, and
    perfect erasure gives I(Z;A) = 0, so I(Z;X) = I(Z;X|A) =
    H(X|A) − H(X|Z,A) ≤ H(X|A), with equality iff H(X|Z,A) = 0, that is,
    iff X is a function of (Z, A). Finite support keeps every term finite.

    (2) Deterministic necessity. Let Z = f(X). Equality forces f to be
    one-to-one on the support of each p_a = P(X | A = a). Zero leakage
    forces the law of Z given A = a to be one law Q for every a with
    P(a) > 0. A one-to-one image of p_a is p_a relabelled, so every p_a
    has the multiset of point masses of Q: the groups' distributions are
    permutations of one another, with equal support sizes. This needs
    neither disjoint groups nor strict concavity of entropy.

    (3) Deterministic sufficiency, under disjoint group supports (the
    paper's A2–A4): if the p_a are permutations of a common Q, map each
    group's support one-to-one onto Q's support matching masses; then Z
    given A = a is Q for every a, and f is injective on each group, so
    both conditions of (1) hold.

    (4) The stochastic remark in the body, checked: H(X|Z,A) = 0 means
    x = g_a(z) on group a, so p_a is a deterministic coarsening of the
    common law Q of Z; conversely, given such Q and g_a, draw Z from Q
    conditioned on g_A(Z) = X. Under disjoint finite supports the common
    refinement of the groups' cumulative partitions of [0, 1] supplies Q.
    So the paper's claim that unequal groups put the cap out of reach is
    false for stochastic maps, as the body says.
  excluded: >-
    Countable or continuous X, where H(X|A) can be infinite; the title is
    narrowed to finite support. Relaxed erasure (leakage ε > 0) and the
    empirical ranking of erasure methods stay out, as the body says.
