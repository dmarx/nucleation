  - "Nothing contradicts it. THEORY-214 (LIT-1025, 2022 data) predicts imminent overthrow from fine dynamics. THEORY-216's body explains why the two do not conflict, and THEORY-214's 'safe through neglect' compositions bear only on the excluded universal clause."
