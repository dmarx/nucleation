      it stays within three when every saving is small next to the build cost is not shown
    new_title: 'For one index with no space limit, Bruno and Chaudhuri''s online tuner, which builds the
      index once the savings it would have given have risen by its build cost above their last low and
      drops it once they have fallen by the build cost below their last high, is not three-competitive:
      when every statement''s saving or loss is at most a fraction f of the build cost, a repeated workload
      makes it cost nearly 3 + 2f times the offline optimum, and one statement whose saving exceeds the
      build cost makes the ratio unbounded; no upper bound is shown'
    source:
    - LIT-1095
  THEORY-334:
    disposition: narrow-and-promote
    old_title: In copying a pattern of coloured blocks that stays in view, people look back at the model
      about 1.3 times per block, most often once for colour and once for position, and so choose the slowest
      strategy with the least held in memory though told to be quick; they look less when model and copy
      are far apart or the pattern can be chunked, and keep only the property the current step needs;
      that holding information costs more than re-fetching it is inferred from these choices, in seven
      subjects, without statistics
    new_title: In copying a pattern of coloured blocks that stays in view, seven subjects told to work
      quickly looked back at the model about 1.3 times per block, and their commonest cycle, which looks
      at the model both before picking up a block and before dropping it, was the slowest per block in
      the authors' observed tallies (about 3 s, against 1.5 s for a cycle that copies from memory); looks
      fell to 1.0 per block with model and copy 70° apart and to 0.7 with one-colour patterns that could
      be chunked, and in three subjects a colour change made during a saccade raised fixation time by
      about 129 ms after pickup against about 50 ms before; no statistics are reported
    source:
    - LIT-1075
    pr_branch: claude/promote-theories-246-334-split-201
    decision_on: claude/promotion-audit-batch-063
  THEORY-362:
    disposition: narrow-and-promote
    old_title: 'For nonrecursive Datalog or SQL views with safe stratified negation and stratified aggregation,
      under set or duplicate semantics, storing with each derived tuple only the number of its derivations
      is stated to suffice to maintain the view under insertions and deletions of base tuples: signed
      counts propagated through delta rules stratum by stratum give each tuple''s change as its new count
      minus its old, and a tuple leaves when its count reaches zero; the proof is not in the paper, and
      counting is set aside for recursive views because counts can be infinite'
    new_title: 'For nonrecursive Datalog or SQL views with safe stratified negation and stratified aggregation,
      under set or duplicate semantics, storing with each derived tuple only the number of its derivations
      suffices to maintain the view under insertions and deletions of base tuples: signed counts propagated
      through delta rules stratum by stratum give each tuple''s change as its new count minus its old,
      a tuple leaves when its count reaches zero, and a MIN or MAX group whose extreme is deleted is recomputed
      from the stored lower stratum'
    source:
    - LIT-1114
  THEORY-365:
    disposition: narrow-and-promote
    old_title: A stack of proximity graphs on nested random subsets of the data, each element's top layer
      drawn geometrically, makes greedy search cost grow about logarithmically with the number of items
      on uniform random data in 4 and 8 dimensions, where single-layer navigable graphs grow polylogarithmically;
      the logarithmic bound is derived only for exact Delaunay graphs of bounded degree, which the index
      does not build, and on 200 million SIFT vectors the measured growth departs from it
    new_title: In one study of a stack of proximity graphs on nested random subsets of the data, each
      element's top layer drawn geometrically, greedy search on uniform random data in 8 dimensions needed
      a number of distance computations that grew no worse than logarithmically with the number of items
      and stayed below a single-layer navigable graph's at every size tested, and in 4 dimensions the
      beam width needed for a fixed recall saturated; the logarithmic bound is derived only for exact
      Delaunay graphs of bounded degree, which the index does not build, and on 200 million SIFT vectors
      the measured growth departs from it
    source:
    - LIT-1098
  THEORY-367:
    disposition: narrow-and-promote
    old_title: For positive queries over a tree data model that covers SPJU relational queries, why-provenance
      taken as the witness basis, one set of matched source facts per derivation, is preserved by query
      rewriting and its minimal witnesses are the same for equivalent queries with equality conditions,
      while where-provenance, the source location a value was copied from, can differ between equivalent
      queries and is preserved by rewriting only for traceable queries
    new_title: For SPJU relational queries, which Buneman, Khanna and Tan's tree model encodes, the minimal
      witnesses of an output tuple, the inclusion-minimal sets of source facts from which the query still
      derives it, are the minimal sets matched by single derivations and so are the same for every equivalent
      query, while where-provenance, the source location a value was copied from, can differ between equivalent
      queries
    source:
    - LIT-1104
  THEORY-368:
    disposition: narrow-and-promote
    old_title: On two-dimensional point sets constructed for the purpose, DiskANN as implemented, HNSW,
      NSG and seven other graph indexes, run from their authors' code at their authors' parameters, found
      none or few of a query's five nearest neighbours until the search queue held about 10% of the points,
      for n from 10⁵ to 2·10⁶; this is shown by experiment on one query per instance, and no theorem bounds
      these algorithms
    new_title: On two-dimensional point sets constructed for the purpose, the authors' code for fast-preprocessing
      DiskANN, HNSW and NSG, at parameters from the original papers, in most cases found none or few of
      a query's five nearest neighbours until the search queue held about 10% of the points, for n from
      10⁵ to 2·10⁶, and at that queue length ten graph indexes averaged recall@5 between 0.0 and 0.42;
      this is shown by experiment on one query per instance, and no theorem bounds these algorithms
    source:
    - LIT-1112
  THEORY-369:
    disposition: narrow-and-promote
    old_title: Under uniformly distributed, independent data and queries in the unit cube with Euclidean
      distance, an optimal nearest-neighbour search over any index that partitions points into blocks
      or convex clusters must read a fraction of blocks that grows toward all of them as dimension rises;
      with a five-fold sequential advantage for scanning, estimates put the crossover at about 15–26 dimensions
      for rectangular and spherical bounding regions, and two tree indexes measured on 50,000 points lost
      to a scan beyond about 10
    new_title: Under uniformly distributed, independent data and queries in the unit cube with Euclidean
      distance and a fixed number of points, an optimal nearest-neighbour search over any index that partitions
      points into blocks or convex clusters of at least two points must read a fraction of blocks that
      grows toward all of them as dimension rises; with a five-fold sequential advantage for scanning,
      estimates put the crossover at about 15–26 dimensions for rectangular and spherical bounding regions,
      and two tree indexes measured on 50,000 points lost to a scan beyond about 10
    source:
    - LIT-1107
  THEORY-377:
    disposition: narrow-and-promote
    old_title: A rule that multiplies a cached interval's width by 1 + α on a pushed refresh with probability
      min{ρ, 1}, and divides it by 1 + α on a query's exact fetch with probability min{1/ρ, 1}, came within
      1% to 5% of the best fixed width on simulated random walks; on network-traffic traces, restricted
      to exact copies, it matched an adaptive cache-or-not rule, and where queries tolerated imprecision
      it cost less; that it converges to the best width is argued, not proved
    new_title: In Olston, Loo and Widom's simulations, a rule that multiplies a cached interval's width
      by 1 + α on a pushed refresh with probability min{ρ, 1}, and divides it by 1 + α on a query's exact
      fetch with probability min{1/ρ, 1}, settled within 1% of the best fixed width on one random walk
      and within 5% over eight walk settings; on a 50-host network-traffic trace, restricted to exact
      copies, it almost matched a tuned adaptive cache-or-not rule, and with a 50-value cache, where queries
      tolerated imprecision, it cost less; that it converges to the best width is argued, not proved
    source:
    - LIT-1109
  THEORY-380:
    disposition: narrow-and-promote
    old_title: For datalog on relations annotated from a commutative ω-continuous semiring, with an answer's
      tag defined as the sum over its derivation trees of the product of its leaves' tags, the tags are
      the least fixed point of a finite polynomial system and factor through formal power series N∞⟦X⟧
      in the input tuple ids; an answer tuple's series has an infinite coefficient exactly when the tuple
      lies on a cycle of unit rules
    new_title: For datalog over a finite input instance annotated from a commutative ω-continuous semiring,
      with an answer's tag defined as the sum over its derivation trees of the product of its leaves'
      tags, the tags are the least fixed point of a finite polynomial system and factor through formal
      power series N∞⟦X⟧ in the input tuple ids; an answer tuple's series has an infinite coefficient
      exactly when one of its derivation trees contains a tuple lying on a cycle of unit rules
    source:
    - LIT-1110
  THEORY-382:
    disposition: narrow-and-promote
    old_title: When a web server keeps each page fragment either cached and invalidated by updates or
      stored and refreshed after them, materializing trades staleness for response time, and in one synthetic
      simulation with fixed costs a periodic greedy that moves a capped number of fragments between the
      two, to keep the share of fresh fragments served above a set threshold, held freshness near the
      threshold, answered faster than caching alone and recovered from overload by materializing everything;
      no bound on its distance from the best plan is shown
    new_title: When a web server keeps each page fragment either cached and invalidated by updates or
      stored and refreshed after them, materializing trades staleness for response time, and in one synthetic
      simulation with fixed costs a periodic greedy that moves a capped number of fragments between the
      two, to keep the share of fresh fragments served above a set threshold, tracked that threshold by
      the authors' reading of its curves, answered faster than caching alone and recovered from overload
      by materializing everything; no bound on its distance from the best plan is shown
    source:
    - LIT-1105
  THEORY-387:
    disposition: narrow-and-promote
    old_title: For recursive Datalog views under set semantics, deleting every derived tuple that has
      any derivation through a deleted base fact, then restoring each deleted tuple that still has a derivation
      from the remaining relations, then adding what insertions derive, is stated to leave exactly the
      tuples derivable from the new base (E − Δ⁻) ∪ Δ⁺, with no derivation counts stored; the proof and
      the extension to stratified negation and aggregation are referred to an unpublished report, and
      the size of the overestimate is not measured
    new_title: For positive recursive Datalog views under set semantics, deleting every derived tuple
      that has any derivation through a deleted base fact, then restoring each deleted tuple that still
      has a derivation from what remains, then adding what insertions derive, leaves exactly the tuples
      derivable from the new base (E − Δ⁻) ∪ Δ⁺, with no derivation counts stored; the extension to stratified
      negation and aggregation is asserted, not shown, and the size of the overestimate is not measured
    source:
    - LIT-1114
  THEORY-391:
    disposition: narrow-and-promote
    old_title: Recovery of a k-sparse vector by ℓ₁ minimization from n random measurements in dimension
      N switches, as N grows with δ = n/N and ρ = k/n fixed, from near-certain success to near-certain
      failure across a curve ρ(δ) that face counts of randomly projected polytopes fix for Gaussian matrices;
      eight non-Gaussian ensembles were observed to approach the same curve, with gaps shrinking as N^(−1/2),
      while at finite N the location depends on the ensemble
    new_title: Recovery of a k-sparse vector by ℓ₁ minimization from n random measurements in dimension
      N switches, as N grows with δ = n/N and ρ = k/n fixed, from near-certain success to near-certain
      failure across a curve ρ(δ) that, for Gaussian matrices, the authors' earlier face-counting theorems
      fix; in 2,948,000 optimizations at N = 200, 400 and 1600, eight non-Gaussian ensembles approached
      that curve in a way consistent with gaps shrinking as N^(−1/2), an exponent fitted on the same data,
      while at finite N the location depended on the ensemble
    source:
    - LIT-1160
  THEORY-419:
    disposition: narrow-and-promote
    old_title: In a structural causal model an intervention do(X = x) is a surgery that deletes X's own
      equation, sets X to x and solves the rest, while observing X = x violates no equation and is ordinary
      conditioning; so models that agree on every observational distribution can disagree on the effect
      of an intervention, and a structural coefficient is the rate of change of E[Y | do(x)], not a regression
      slope
    new_title: In a structural causal model of autonomous equations, with intervention do(X = x) defined,
      as Pearl defines it, as a surgery that deletes X's own equation, sets X to x and solves the rest,
      and with observing X = x violating no equation and amounting to ordinary conditioning, models that
      agree on every observational distribution can disagree on the effect of an intervention, and in
      a structural equation y = βx + ε the coefficient β is the rate of change of E[Y | do(x)], which
      equals the regression slope of Y on X only when X is uncorrelated with ε
    source:
    - LIT-894
  THEORY-472:
    disposition: narrow-and-promote
    old_title: A speaker who chooses words to minimise the information lost about a single intended referent
      picks each true word with probability inversely proportional to a power of its extension, so the
      size principle follows from informative communication; word learners who know the referent bet on
      a novel word's meaning as the inversion of that speaker predicts, while speakers' free descriptions
      follow it only weakly
    new_title: A speaker who chooses words to minimise the information lost about a single intended referent,
      with words' literal meanings uniform over their extensions, picks each true word with probability
      inversely proportional to a power of its extension, so the size principle follows from informative
      communication; in one betting experiment, learners who knew the referent bet on a novel word's meaning
      in line with the inversion of that speaker (r = .93 on condition means), and in one free-description
      study speakers' word use followed it only weakly (r = .19)
    source:
    - LIT-824
  THEORY-478:
    disposition: narrow-and-promote
    old_title: 'When a data set''s diffusion operator behaves like the heat kernel of a latent tree, summing
      scale-weighted hyperbolic distances between diffusion densities over dyadic times gives a distance
      equivalent, up to constants, to a thresholded snowflake of the tree metric: it keeps the tree''s
      neighbourhoods and not its global distances'
    new_title: 'If the diffusion densities'' Hellinger distances obey a Hölder bound with exponent θ in
      d_T / t^(1/β) and are bounded below once d_T exceeds a multiple of t^(1/β), then for 0 < α < θ/β
      summing scale-weighted hyperbolic distances between diffusion densities over dyadic times gives
      a distance two-sided equivalent, up to constants, to min{1, d_T^(αβ)} for pairs above the finest
      scale: it keeps the tree''s neighbourhoods and not its global distances; whether a tree''s heat
      kernel, or sampled data, meets the bounds, and with which θ, is not shown'
    source:
    - LIT-870
  THEORY-527:
    disposition: narrow-and-promote
    old_title: If agents are the systems that would adapt their policy were their actions to affect the
      world differently, then in causal models with mechanism variables they can be found from interventions
      on mechanisms, provably under five assumptions; on that definition the agent is wherever the adaptation
      is, so a thermostat is not an agent while it together with its design process is, and an RL training
      process is while its learnt policy generally is not
    new_title: If agents are the systems that would adapt their policy were their actions to affect the
      world differently, then in mechanised causal games meeting Kenton et al.'s five assumptions (one
      agent per connected component of the decision–utility graph, best response to every mechanism intervention,
      a fixed tie-breaking order, terminal edges only into decision mechanisms, and mechanism interventions
      able to set any deterministic function) the game graph, with its decisions, utilities and agents,
      is recovered exactly from interventions on mechanisms
    source:
    - LIT-909
  THEORY-548:
    disposition: narrow-and-promote
    old_title: A delay in the interactions of a large random Lotka–Volterra community whose undelayed
      equilibrium is feasible and globally stable destabilises it through a Hopf bifurcation at a critical
      delay set by the community spectrum, giving sustained oscillation with no external forcing; whether
      diversity then stabilises depends on the measure, since in the oscillating regime community-level
      variability falls with diversity while species-level variability rises
    new_title: In generalised Lotka–Volterra dynamics with every interaction delayed by τ, a feasible
      equilibrium that is stable without delay loses stability at τ_c = min over the community eigenvalues
      j of arctan(|Re j|/|Im j|)/|j|, where a pair of roots crosses the imaginary axis transversally (a
      Hopf point), so the critical delay is set by the community spectrum; in Saeedian et al.'s strongly
      self-regulated setting the oscillating regime's community-level variability falls with diversity
      (S = 10–70) while species-level variability rises, and the fall matches what summing independently
      oscillating species gives
    source:
    - LIT-057
  THEORY-566:
    disposition: promote
    old_title: In Ganea et al.'s hyperbolic neural networks, linear maps and nonlinearities are Euclidean
      ones read through the chart at the origin, so a stack of them without biases is a Euclidean network
      conjugated by that chart, and the curvature acts only through the bias translations and the distance-based
      output layer
    new_title: (unchanged)
    source:
    - LIT-879
  THEORY-580:
    disposition: promote
    old_title: On any cover of a space of input histories, the empirical models compatible with a causal
      structure are exactly the points of a polytope cut from a product of simplices by linear causality
      equations, so how much of a model a causal structure can explain is a linear program; causal separability
      is relative to an assumed ambient structure, and the causally separable fraction is never less than
      the separable local fraction
    new_title: (unchanged)
    source:
    - LIT-788
  THEORY-585:
    disposition: narrow-and-promote
    old_title: In the Döring–Isham scheme for realising collections of systems in topoi, disjoint sums
      of quantum systems compose exactly, but along tensor products the best pull-back of a constituent's
      quantity agrees with the composite's own quantity only on contexts of the form V₁⊗ℂ1, since the
      composite's context poset holds contexts that mix the factors; the failure elsewhere is asserted,
      not proved
    new_title: In the Döring–Isham scheme for realising collections of systems in topoi, disjoint sums
      of quantum systems compose exactly; along a tensor product of finite-dimensional systems, the pull-back
      of a constituent's quantity agrees with the composite's own quantity at a context exactly when every
      projection in it with proper support on the first factor has the form P⊗1, so it fails for every
      non-scalar quantity and no operator on the composite realises the pull-back
    source:
    - LIT-310
    - LIT-378
  THEORY-714:
    disposition: narrow-and-promote
    old_title: Redundancy among any number of sources can be measured as the expected local co-information
      over only those events where every source, the joint source and the overlap change the target's
      surprisal in the same direction, under the maximum-entropy joint that preserves the source–target
      and joint-source marginals; this keeps symmetry, self-redundancy, subset equality and identity for
      independent sources, and gives up Harder et al.'s identity, monotonicity and non-negative atoms,
      which then read as local misinformation and mechanistic redundancy
    new_title: Ince's I_ccs, the expected local co-information over only those events where every source,
      the joint source and the overlap change the target's surprisal in the same direction, under the
      maximum-entropy joint that preserves the source–target and joint-source marginals, is symmetric
      and self-redundant and satisfies the independent identity property; it fails Harder et al.'s identity
      and monotonicity, so its atoms can be negative, and, though its paper says otherwise, it fails subset
      equality
    source:
    - LIT-1201
  THEORY-744:
    disposition: narrow-and-promote
    old_title: As the kernel width ε goes to 0, Coifman and Lafon's α-normalized diffusion operator on
      data sampled with density q = e^{−U} from a compact manifold has generator Δf + 2(1 − α)⟨∇U, ∇f⟩,
      the generator of a reversible diffusion with drift −2(1 − α)∇U and invariant density proportional
      to q^{2(1−α)}; α = 0 gives potential 2U and invariant density q², α = 1/2 gives the Langevin dynamics
      whose invariant density is the sampling density itself, and α = 1 gives Brownian motion on the manifold,
      with no trace of the density
    new_title: As the kernel width ε goes to 0, Coifman and Lafon's α-normalized diffusion operator (I
      − P_{ε,α})/ε, for data sampled with density q = e^{−U} from a compact manifold without boundary,
      converges uniformly on smooth functions, at rate O(ε), to Δf + 2(1 − α)⟨∇U, ∇f⟩ with Δ the non-negative
      Laplace–Beltrami operator, which is minus the generator of a reversible diffusion with drift −2(1
      − α)∇U and invariant density proportional to q^{2(1−α)}; α = 0 gives potential 2U and invariant
      density q², α = 1/2 gives the Langevin dynamics whose invariant density is the sampling density
      itself, and α = 1 gives Brownian motion on the manifold, with no trace of the density
    source:
    - LIT-1246
    - LIT-981
