scope:
  accepted: >-
    The deterministic half, as a new Active THEORY sourced to LIT-929.
    (a) Necessity (eq. 12): lim sup (1/t)∫λ_min ≤ λ ≤ lim sup (1/t)∫λ_max,
    with λ_min and λ_max the extreme eigenvalues of (A + A†)/2. For a normal
    A(t) the largest is the spectral abscissa α(t). So a normal operator
    with α(t) ≤ −c < 0 has λ ≤ −c. (b) Existence: a non-normal operator
    stable at every instant can have a positive exponent. The paper shows
    only neutral cases. The record closes the stable case with one
    construction: for any A(t) with exponent λ > 0, A(t) − δI has the
    exponent λ − δ exactly, because Φ_δ(t) = e^(−δt)Φ(t), and for 0 < δ < λ
    it is stable at every instant (eigenvalues shifted by −δ) and unstable.
    Applied to the switched oscillator of eqs. 13–17 (γ = 0, ω between
    0.5 and 3, T = 1): the monodromy over one period is
    M = R_3(1)R_0.5(1), with det M = 1 and tr M = −2.1548. So |tr M| > 2,
    the largest Floquet multiplier is 1.4784, and λ = ln(1.4784)/2 = 0.1955.
    With δ = 0.1, the shifted system is stable at every instant and has
    λ = 0.0955. This was computed exactly for this review (closed-form
    rotation blocks R_ω(T)), with no numerical integration.
  excluded: >-
    The stochastic half: that multiplicative white noise destabilizes
    generically (dimension ≥ 2, noise matrices neither skew-symmetric nor
    commuting with Ā), which the paper cites to Has'minskii and Colonius &
    Kliemann, and that the threshold falls with non-normality and rises
    with damping, which it shows only numerically (Figs. 8–9). THEORY-325
    keeps both with its promote_when.
