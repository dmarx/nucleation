  THEORY-324:
    disposition: narrow-and-promote
    old_title: A system adapts by trial and error to an environment unknown to it only if a second feedback,
      through its essential variables, changes the parameters of its primary feedback when those variables
      leave their limits; with that feedback every equilibrium the whole can reach is an adapted one
    new_title: A system adapts by trial and error to an environment whose effect on its essential variables
