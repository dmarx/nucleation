evidence:
  - "THEORY-180's own 'What was actually shown': 'Two things of different strength. An identity, proved ... A spectral law, derived non-rigorously.'"
  - >-
    Re-derivation. Tied: ‖W‖²_F = Tr(WWᵀ). WWᵀ is symmetric PSD, so its
    singular values are its eigenvalues and ‖WWᵀ‖_* = Tr(WWᵀ). Untied: for
    any U, V with UVᵀ = M, Hölder's inequality for Schatten norms gives
    ‖M‖_* = ‖UVᵀ‖_* ≤ ‖U‖_F ‖V‖_F, and AM–GM gives
    ‖U‖_F‖V‖_F ≤ (‖U‖²_F + ‖V‖²_F)/2. Equality is attained: if M = PΣQᵀ is
    an SVD, take U = PΣ^(1/2) and V = QΣ^(1/2). Then UVᵀ = M and
    ‖U‖²_F = ‖V‖²_F = Tr Σ = ‖M‖_*. So the minimum is ‖M‖_*. When the loss
    depends on (U, V) only through UVᵀ, minimizing loss + λ(‖U‖²_F + ‖V‖²_F)/2
    over (U, V) is minimizing loss + λ‖M‖_* over M, with ranks bounded by the
    inner dimension.
