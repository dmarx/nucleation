scope:
  accepted: >-
    The formal core, as a new Active THEORY: Kuditipudi et al.'s Theorem 1
    (LIT-671). For multilayer ReLU nets with a loss convex in the output,
    two ε-dropout-stable solutions are ε-connected: some piecewise-linear
    path between them keeps L ≤ max{L(θ_A), L(θ_B)} + ε throughout. The
    construction uses Lemma 1 (reach the dropout version through steps
    that either change input weights of units whose outputs are already
    zeroed, at no cost, or interpolate top-layer weights, where loss is
    convex), Lemma 4 (permute a half-zeroed net's live units at constant
    loss) and Lemma 2 (join two half-zeroed nets in 8 segments at no more
    than the worse endpoint). NOTE-544 read §§1–6 and Appendix A, the
    proof of Theorem 1, in full, and rates C1 "strong (proof)". So the
    THEORY-014 standard applies: a theorem proved in a work the record has
    read. No re-derivation is needed under ADR-047 v2. The new entry also
    takes Draxler et al.'s concatenation bound, L*_AC ≤ max{L_AB, L_BC}
    (LIT-653), which is immediate: a path through B never exceeds the
    larger of the two barriers.
  excluded: >-
    These stay with THEORY-109, Proposed:
    - "one connected set": the body calls it extrapolated from pairs and
      complexes of at most seven modes;
    - the low-loss region's dimension, which is a lower bound for one
      architecture;
    - that SGD's solutions are dropout-stable (§6, weak to moderate:
      MNIST convnets and one VGG-11);
    - Theorem 2 (App. B, read for its statements only);
    - Theorem 4's construction of disconnected global minima (App. C,
      read for statement and structure, not checked).
    THEORY-108's phase-III tension stays with the parent too.
