scope:
  accepted: >-
    Basu's theorem in every Markov category (Fritz's Theorem 15.8),
    re-derived for this review under ADR-047 v2, because NOTE-588 could not
    check the diagrammatic proof ("steps not checked here, diagrams lost").
    The definitions are those the THEORY reports. Write copy for the
    comonoid on an object and ! for discard.
    - Sufficiency of s for p : Θ → X means there is α : V → X with
      (s ⊗ id)∘copy∘p = (id ⊗ α)∘copy∘sp.
    - f =_q g almost surely means (id ⊗ f)∘copy∘q = (id ⊗ g)∘copy∘q.
    - Completeness of sp means f∘sp = g∘sp implies f =_sp g.
    - Ancillarity of t means tp = c∘!_Θ for a state c : I → T.
    Let s be complete sufficient and t ancillary, and put f = t∘α : V → T.
    (1) Composing the sufficiency equation with (id ⊗ t), and using that s
    is deterministic, gives (s ⊗ t)∘copy∘p = (id ⊗ f)∘copy∘sp.
    (2) Discarding the first leg of (1) gives tp = f∘sp, by the counit law
    and naturality of discard.
    (3) By ancillarity, f∘sp = tp = c∘!_Θ = (c∘!_V)∘sp, since sp is a
    Markov morphism and preserves discard. By completeness, f =_sp c∘!_V.
    (4) Substituting in (1), (s ⊗ t)∘copy∘p = (id ⊗ c∘!_V)∘copy∘sp
    = sp ⊗ c = (sp ⊗ tp)∘copy_Θ. So s and t are independent given θ.
    No positivity, conditionals or causality is used.
