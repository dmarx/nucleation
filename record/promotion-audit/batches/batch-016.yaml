notes_for_ledger:
  - "Wave 3's yield comes from its formal members. Of five top-ranked entries, the two that yielded were formal results without a mathematics tag, promoted by re-derivation. The three empirical ones were held by measurements the record has not read. Expect that pattern to continue, and route untagged formal entries to wave 2."
  - "Look first at the step a NOTE took on trust. THEORY-481's NOTE-658 said the Wishart fourth-moment step was 'followed as statements, not re-derived'. Re-deriving it found the source commuting the rotated empirical covariance Ŝ, which is not diagonal at finite N. That makes its per-mode decoupling and s^∞ exact only as N → ∞, or for isotropic inputs. Grep NOTE history lines for 'followed as statements', 'not re-derived' and 'taken as stated' before trusting an 'exact' claim."
  - "A concentration argument settles high-dimensional nearest-neighbour bounds. For fixed N and uniform data, all squared distances are d/6 + o(d), and the midpoint of any two points is at d/8 from the query. So every convex cluster of at least two points meets the nearest-neighbour ball with probability tending to 1. The same trick may serve THEORY-366 (Beyer et al.'s distance concentration)."
  - "triage_wave3.py's firsthand markers miss 'stated by no source', 'the filer's synthesis' and 'nothing was tested'. Its depth score reads 'read in full' per NOTE, not per claim. Both fired falsely in this batch."
  - "A source-derivation error is a needs-correction even when the record read the source faithfully. Correct the THEORY with status unchanged, add a dated note to the NOTE, and requeue the THEORY for narrow-and-promote, so a status change never rides on a correction."
