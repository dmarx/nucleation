scope:
  accepted: >-
    The corrected claim (version 3) as stated: score addition composes two
    conditions exactly when p(y₁,y₂|x)/(p(y₁|x)p(y₂|x)) does not vary with x,
    and conditional independence is sufficient but not necessary. Checked
    for this review.

    (1) Identity. By Bayes, ∇ₓ log p(x|y) = ∇ₓ log p(x) + ∇ₓ log p(y|x) for
    any condition y with p(y) > 0. Applying it to (y₁,y₂), y₁ and y₂ gives
    s₁₂ − s₁ − s₂ + s₀ = ∇ₓ log p(y₁,y₂|x) − ∇ₓ log p(y₁|x) − ∇ₓ log p(y₂|x),
    because the four ∇ₓ log p(x) terms cancel (+1 −1 −1 +1). This is the
    stated identity. Its right side vanishes on a connected region where the
    densities are positive and differentiable exactly when the ratio is
    constant there.

    (2) Sufficiency. Conditional independence given x makes the ratio 1.

    (3) Not necessary. With v = (1, −1, 0) and p(yᵢ|x) = (σ/2, σ/2, 1 − σ),
    Σ_y v(y)p(y|x) = 0. So q = (1 + εv(y₁)v(y₂))p(y₁|x)p(y₂|x), with
    0 < ε < 1, is nonnegative (|v₁v₂| ≤ 1). Summing over y₂ gives
    p(y₁|x)(1 + εv(y₁)Σ_y₂ v(y₂)p(y₂|x)) = p(y₁|x), so q has the given
    marginals and sums to 1. It is dependent (the factor is 1 + ε at
    y₁ = y₂ = 0), and its ratio 1 + εv(y₁)v(y₂) does not depend on x. So the
    scores add exactly under dependence.
