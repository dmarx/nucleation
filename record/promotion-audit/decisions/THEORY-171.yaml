scope:
  accepted: >-
    The title, which is an existence statement: when causal constraints
    depend on context, deterministic assignments that are causal in each
    context can fail to glue. One checked example settles an existence
    statement, and LIT-808's Θ₃ example is one. NOTE-612 followed it step
    by step. Re-derived for this review: Θ₃ is the meet of the spaces of
    total(A, B) ∨ discrete(C) and discrete(A) ∨ total(C, B), so event B has
    causal past {A, B} in one and {B, C} in the other. {B:b} alone is a
    history in neither, so λ = {A:a, B:b}↓ and λ′ = {B:b, C:c}↓ share no
    history, and any two sections on them are compatible. Set B's output to
    1 on λ, where its past is {A:a, B:b}, and to 0 on λ′, where its past is
    {B:b, C:c}. Each is causal on its open. On the extension
    {A:a, B:b, C:c}, B is the tip of both sub-histories, so a causal
    function there must give B both outputs. No gluing exists, and the
    presheaf of causal functions is not a sheaf. LIT-843's Example 7.2 is an
    independent second instance of the same kind.
  excluded: >-
    Theorem 2.34's "exactly when": the presheaf is a sheaf iff the space has
    no solipsistic contextuality witness. Its proof was not read (NOTE-612
    C2: "proof, not checked"), and the paper is an unrefereed preprint. The
    summary currently states it as part of the account. Also excluded: the
    count of 1767 of 2644 causally complete spaces, which is not checked.
