  - >-
    Re-derivation of the theorem. Tokens are tuples x = (x_1, …, x_N) and
    the GHMM's operators factor, T^(x) = ⊗_n T_n^(x_n). (1) Products stay
    products. If η = ⊗_n η_n, then η T^(x) = ⊗_n (η_n T_n^(x_n)), and the
    normaliser factors too: (⊗_n a_n)(⊗_n 1_n) = Π_n (a_n 1_n). So the
    updated predictive vector η T^(x) / (η T^(x) 1) = ⊗_n η_n′, with
    η_n′ = η_n T_n^(x_n) / (η_n T_n^(x_n) 1_n). The stationary start is a
    product: Σ_x T^(x) = ⊗_n Σ_{x_n} T_n^(x_n), whose stationary vector is
    ⊗_n π_n. By induction every predictive state is a product. (2)
    Dimension. Each factor η_n lies in the affine hyperplane
    {η_n : η_n 1_n = 1} of ℝ^{d_n}, of dimension d_n − 1, and a product
    state is fixed by its factors, so the product states form a set of
    dimension at most Σ_n (d_n − 1). (3) The embedding. The partial trace
    η ↦ η_n (contracting every other factor with 1_m) is linear in η and
    returns η_n exactly on product states. Fix a point p_n of each
    hyperplane and an orthonormal basis of its direction space. The map
    η ↦ ⊕_n coordinates of (tr_{≠n} η − p_n) is affine, injective on product
    states by (2), and lands in a direct sum of mutually orthogonal blocks
    of dimension d_n − 1, Σ_n (d_n − 1) in all. Off the product set the
    partial traces discard the correlations among factors, so the map is
    lossy there; the paper measures the loss as the total correlation.
