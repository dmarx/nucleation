scope:
  accepted: >-
    The formal results, as a new Active THEORY that the parent extends.
    (i) Zhou et al.'s Theorem 1 (LIT-674): for an L-layer ReLU MLP on a
    finite dataset, if weak additivity holds at every layer's
    pre-activations and the commutativity condition holds at every layer,
    then the features of the interpolated network are exactly the
    interpolation of the endpoints' features at every layer, with scale 1.
    (ii) Lemma 1: if the output layer is linearly connected in this sense
    (any scale c > 0) and both endpoints err on at most a fraction ε of the
    data, then every network on the path errs on at most 2ε. (iii) The
    exact one-hidden-layer case: for a one-hidden-layer ReLU network with
    interpolating minima, linear mode connectivity forces shared activation
    patterns (Lubana et al., LIT-669, Lemma 2), and with shared patterns the
    hidden features are exactly linear along the path. NOTE-512 read the
    main text and Appendix A of LIT-674 in full, with the proofs checked
    line by line. NOTE-538 read Appendix F.3 of LIT-669, including Lemma 2's
    proof, in full. Step (iii)'s composition is the record's, so it is
    re-derived here under ADR-047 v2. (i) and (ii) are checked again as
    well.

    Re-derivation of (i). Write H_ℓ(θ) for layer ℓ's features on the data,
    with H_0 = X shared by both networks, and Z_ℓ = W_ℓ H_{ℓ−1} for the
    pre-activations (fold biases into W with a constant row). Put
    θ_α = αθ_A + (1 − α)θ_B, so W_ℓ(α) = αW_A + (1 − α)W_B. Suppose
    H_{ℓ−1}(α) = αH_A + (1 − α)H_B, which holds at ℓ = 1. Then
    Z_ℓ(α) = (αW_A + (1 − α)W_B)(αH_A + (1 − α)H_B)
           = α²W_AH_A + (1 − α)²W_BH_B + α(1 − α)(W_AH_B + W_BH_A).
    By commutativity, W_AH_B + W_BH_A = W_AH_A + W_BH_B. So
    Z_ℓ(α) = (α² + α(1 − α))W_AH_A + ((1 − α)² + α(1 − α))W_BH_B
           = αZ_A + (1 − α)Z_B.
    Weak additivity, ReLU(αZ_A + (1 − α)Z_B) = αReLU(Z_A) + (1 − α)ReLU(Z_B),
    then gives H_ℓ(α) = αH_A + (1 − α)H_B. Induction closes it. Both
    conditions are needed at every layer and for every α used.

    Re-derivation of (ii). If f(θ_α)(x) = c⁻¹(αf_A(x) + (1 − α)f_B(x)) with
    c > 0, then the argmax of f(θ_α)(x) is the argmax of a convex
    combination of the two output vectors. If both endpoints rank label y
    strictly first on x, so does every convex combination. So the path errs
    on x only if an endpoint does, and a union bound gives at most 2ε.

    Re-derivation of (iii). Lemma 2 gives ϕ′(W_αᵀx) = ϕ′(W_βᵀx) for every x
    in the data: each hidden unit is on in both endpoints or off in both. If
    a unit's pre-activation is > 0 at both endpoints, it is > 0 at every
    convex combination, since the pre-activation is linear in the weights.
    If it is ≤ 0 at both, it is ≤ 0 at every convex combination. So the
    pattern m(x) is constant along the path. Then ϕ(W_tᵀx) = m(x) ⊙ W_tᵀx
    = (1 − t)m(x) ⊙ W_αᵀx + t m(x) ⊙ W_βᵀx = (1 − t)ϕ(W_αᵀx) + tϕ(W_βᵀx).
  excluded: >-
    The empirical regularity, that linearly connected pairs are
    layerwise-linearly connected in nearly every layer. NOTE-512 rates it
    "moderate to strong as an empirical regularity on image classifiers;
    nothing outside vision tested". The promote_when asks for it outside
    image classification and says more pairwise image-classifier
    measurements would not move it. Also excluded: the averaging clause,
    which the body disclaims (soups and SWA are not measured), and an
    approximate Theorem 1 with residual bounds, which nobody has proved. All
    of these stay with THEORY-111, Proposed, with its promote_when
    unchanged.
