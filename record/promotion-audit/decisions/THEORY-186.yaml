scope:
  accepted: >-
    The exact solution of LIT-862 / LIT-864 for a two-layer linear network
    ŷ = W₂W₁x with white inputs (Σx = I), squared loss and gradient flow,
    from a decoupled, balanced start, and the shallow comparison, re-derived
    here (ADR-047 v2). (1) Deep case. With Σyx = U S Vᵀ, gradient flow of
    ½E‖y − W₂W₁x‖² is τẆ₁ = W₂ᵀ(Σyx − W₂W₁), τẆ₂ = (Σyx − W₂W₁)W₁ᵀ. Take
    W₁ = R C Vᵀ, W₂ = U C Rᵀ with R orthonormal and C = diag(c_α) (decoupled
    and balanced). Then W₂W₁ = U C² Vᵀ and τẆ₁ = R C Uᵀ U (S − C²) Vᵀ =
    R C(S − C²) Vᵀ, so the ansatz is kept and τċ_α = c_α(s_α − c_α²); the
    W₂ equation gives the same. For a_α = c_α², τȧ_α = 2a_α(s_α − a_α),
    whose solution is a_α(t) = s_α e^{2s_αt/τ} / (e^{2s_αt/τ} − 1 + s_α/a_α⁰)
    (it equals a_α⁰ at t = 0, tends to s_α, and satisfies the logistic
    equation). It reaches s_α/2 at t_α = (τ/(2s_α)) ln(s_α/a_α⁰ − 1), and
    passes from a fraction δ to 1 − δ of s_α in time (τ/s_α) ln((1−δ)/δ),
    independent of a_α⁰. So, as a_α⁰ → 0, each mode waits a time of order
    (τ/s_α) ln(1/a_α⁰) and then rises in a transition whose width is a
    vanishing fraction of the wait, and stronger modes go first.
    (2) Shallow case. For ŷ = Wx, τẆ = Σyx − W, so
    W(t) = Σyx + (W(0) − Σyx)e^{−t/τ}, and in the SVD basis
    b_α(t) = s_α(1 − e^{−t/τ}) + b_α⁰ e^{−t/τ}: every mode on the one
    timescale τ, exponentially, with no plateau. Both close. Filed as a new
    Active THEORY: under these conditions the stages come from the product
    of two layers and the spectrum of Σyx, since the same data in one layer
    give none.
