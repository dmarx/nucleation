    and then the governor's authority does not rest on the system leaving
    the rules alone. Narrowed to exclude that case ("when the rules and
    every mechanism that enforces them lie within..."), it is analytic.
    It restates the premise, which the promote_when itself says cannot
    settle the entry ("the architectural fact that configuration files are
    writable, which is the premise, not the finding").
evidence:
