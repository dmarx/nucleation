scope:
  accepted: >-
    The exact half re-derives, and it is the record's own: no source states
    it (the summary opens "The filer's synthesis, stated by no source").

    (a) Model. Linearise at θ0: f(x; θ) = f(x; θ0) + J(x)(θ − θ0), with prior
        θ − θ0 ~ N(0, α⁻¹I_k) and targets with noise precision β. This is
        MacKay's linear-in-parameters model with basis functions the
        components of J(x) (LIT-623, Eqs. 7–11), so the Gaussian evidence is
        exact (NOTE-471).
    (b) Occam factor. With A = αI + βJᵀJ (J the n×k matrix of training
        gradients), the terms −½ log det A − log Z_W(α) + (k/2) log 2π of
        MacKay's Eq. 20, with Z_W = (2π/α)^{k/2}, sum to
        −½ log det A + (k/2) log α = −½ log det(I_k + (β/α)JᵀJ)
        = −½ Σ_a log(1 + βλ_a/α), λ_a the eigenvalues of JᵀJ.
    (c) JᵀJ (k×k) and JJᵀ (n×n) share their non-zero eigenvalues, so the sum
        runs over the non-zero eigenvalues of the empirical NTK Gram matrix
        JJᵀ: at most n terms, whatever k is. γ = Σ βλ_a/(βλ_a + α) (Eq. 23)
        likewise depends only on that spectrum.
    (d) If the Gram eigenvalues are nµ_k with multiplicity N(d, k), substitution
        in (c) gives Σ_k N(d, k)·½ log(1 + βnµ_k/α). That step is exact only
        as a conditional; that the empirical Gram spectrum is close to nµ_k is
        a kernel spectral-convergence result the record does not hold.
  excluded: >-
    (1) The spherical half as a fact about networks: the Gram-spectrum
    approximation is the step the promote_when's computation was to check,
