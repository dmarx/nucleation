notes_for_ledger:
  - >-
    Hand against classifier: 2 of 5 agree. That is below triage-007's
    fitted theorem precision of 0.82, as expected at margins 2-3.
    - The two arguments were called theorems on a conditional clause
      ("when the appraisals rest on") and on a textbook-theorem clause
      ("cannot increase along a processing chain").
    - The scaling law was called a theorem on "because ... provided".
    - Even so, the misclassified scaling law promoted by the measurement
      route. Route membership is a worse predictor of yield than the hand
      sort.
  - >-
    Scaling-law and training-dynamics titles split two ways.
    - THEORY-204's derivation rests on assumed scaling forms, so it is a
      measurement with a conditional derivation. ADR-047 v3 narrows it to
      the measured match and moves the causal "because" to a QUESTION.
    - THEORY-209's model result is exact, and its subject is deep
      networks, so it is split rather than narrowed (ADR-040).
    Rule of thumb: when the THEORY's subject is the real system, split
    off the model result; when the subject is the measured system, narrow.
  - >-
    A paper's "broken detailed balance" can mean only a nonzero current.
    Kunin et al. define it as J ≠ 0. Under their own Assumption 3 the
    linear-regression state is time-reversible once velocities are
    flipped: each Hessian mode is an equilibrium oscillator at its own
    temperature. Check the definition before carrying "nonequilibrium"
    into a title. A one-line numerical check suffices: C(t) = εC(t)ᵀε.
  - >-
    Check a paper's text claim against its own table. LIT-888's text says
    the fits overlap "for up to 10 of the first 12 points"; its table
    shows all eight TinyStories windows overlapping. Its TinyStories
    intervals also drift downward with fit length, which neither the text
    nor the THEORY mentioned.
  - >-
    Both arXiv PDFs (2107.09133v4, 2602.07488v3) fetched cleanly with
    pdftotext -layout. Equation fractions come out split across lines, so
    reconstruct constants by re-deriving them, not by reading the text.
  - >-
    THEORY-529 and THEORY-126 wait on a measure or a study, not on a
    wave-5 review. Track them off the review queue.
owner_questions:
