finding: >-
  ADR-047 v3 works as written. Both requeued Betti-curve entries promote
  once their titles are narrowed to the measured scope: four odour
  sources, and twelve CA1 sessions. Their sphere and multiscale nulls move
  to a QUESTION. Among the three triage-004 entries, the two paths again
  came from formal content inside non-mathematics entries: a derivation
  under stated assumptions (THEORY-033), and an order-theoretic
  impossibility (THEORY-255). The philosophical argument (THEORY-235)
  did not yield. That makes six of six wave-3 paths from formal cores,
  plus the two v3 promotions.
recommendation: >-
  Route single-source philosophical arguments out of wave 3 into wave 5;
  THEORY-235 is the example. Take the three flagged formal entries
  (THEORY-198, -248, -315) as one batch. Under ADR-047 v3, grep wave 3 for
  other hedged single-study empirical titles ("has the signature of",
  "matches", "is consistent with"), which are now cheap promotions once
  narrowed.
