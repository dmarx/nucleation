finding: >-
  In wave 3's control, the two promotion paths were both formal results:
  exact linear algebra (THEORY-078's decomposition) and a construction
  (THEORY-309's trivial POVMs). Each carried no `mathematics` tag, and each
  went through the wave-2 route of a re-derivation under ADR-047 v2. The
  three non-formal entries (an annealed-approximation physics claim, a
  political-economy causal claim, a conceptual analysis) all retain. None
  of triage-004's five components separated the yielders from the rest:
  scores of 4 and 5 appear on both sides, and the one component that
  differed, depth on THEORY-078, pointed the wrong way. What predicted
  yield was whether the title, or a clause of it, is a formal statement the
  source derives.
recommendation: >-
  For wave 3, add a "formal content" flag to the triage. Mark entries whose
  "What was actually shown" names a lemma, theorem, equation derivation or
  construction that the NOTE says it followed or checked. Route them to the
  wave-2 procedure. Expect the non-formal remainder of wave 3 to yield
  rarely (0 of 3 here). Sample it rather than rank it, as NOTES already
  recommends for wave 5. Compare with batch 016's top five before changing
  triage_wave3.py. Five entries cannot separate a ranked list from a
  control.
