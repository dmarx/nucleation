  - >-
    Re-derivation of the Lemma (1D). Order the chain E_L, B_L, V, B_R, E_R,
    with V one block, B_L and B_R the neighbouring blocks (the buffer) and
    E_L, E_R the rest. H is V's coarse variable, drawn from P(H | V), so
    H is independent of everything else given V. (i) Full capture,
    I(H : E) = I(V : E) with E = (E_L, E_R), gives I(V : E | H) = 0. By the
    chain rule, I(V, H : E) = I(V : E) + I(H : E | V) = I(V : E), since
    I(H : E | V) = 0. Also I(V, H : E) = I(H : E) + I(V : E | H). Equate:
    I(V : E | H) = I(V : E) − I(H : E) = 0. (ii) Locality: blocks are wide
    enough that only neighbouring blocks interact, so the Gibbs measure is
    Markov along the chain and V separates (E_L, B_L) from (B_R, E_R);
    hence E_L ⊥ E_R | V. (iii) Combine. For h with P(h) > 0 and any v with
    P(v | h) > 0, (i) gives P(e_L, e_R | h) = P(e_L, e_R | v, h)
    = P(e_L, e_R | v), the second step because H depends on V only. By (ii)
    this is P(e_L | v) P(e_R | v). By (i) again, marginalised,
    P(e_L | v) = P(e_L | h) and P(e_R | v) = P(e_R | h). So
    P(e_L, e_R | h) = P(e_L | h) P(e_R | h). (iv) The coarse variables of
    the blocks in E_L are drawn block by block from E_L's spins, and
    likewise for E_R, so conditional independence passes to them:
    P(X′_{≤−2}, X′_{≥2} | X′_0) = P(X′_{≤−2} | X′_0) P(X′_{≥2} | X′_0), the
    coarse buffer X′_{±1} summed out. That is Proposition 1. No term of the
    marginal coarse measure couples the two sides across X′_0. Reading this
    as "the renormalized Hamiltonian gains no range" needs the no-fine-
    tuning exclusion: summing out the coarse buffer must not exactly cancel
    a longer coupling. Translation invariance is not used.
