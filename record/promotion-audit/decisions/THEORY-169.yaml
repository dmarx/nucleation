scope:
  accepted: >-
    Three output identities, each re-derived here (ADR-047 v2), for the
    layers they are stated for. (1) Sun et al. Theorem 1: unnormalized,
    causal linear attention with identity feature map is the prediction of
    a linear inner model W trained by one batch gradient step from W₀ = 0.
    Re-derivation: for ℓ(W; x_s) = ‖Wk_s − v_s‖² with k_s = θ_K x_s,
    v_s = θ_V x_s, ∇_W ℓ = 2(Wk_s − v_s)k_sᵀ. At W₀ = 0 the batch gradient
    over s ≤ t is −2 Σ_{s≤t} v_s k_sᵀ, so one step with η = ½ gives
    W_t = Σ_{s≤t} v_s k_sᵀ. Its prediction on q_t = θ_Q x_t is
    W_t q_t = Σ_{s≤t} v_s (k_sᵀ q_t), the output of unnormalized causal
    linear attention. The identity fails for normalized linear attention
    (the denominator Σ k_sᵀq_t has no gradient-step counterpart), so the
    title is narrowed to the unnormalized form. (2) Sun et al. Theorem 2:
    the Nadaraya–Watson estimator Σ_s κ(k_s, q) v_s / Σ_s κ(k_s, q) with
    κ(k, q) = exp(kᵀq) is, term for term, softmax attention; training stores
    (k_s, v_s). (3) von Oswald et al. Proposition 1: with tokens
    e_j = (x_j, y_j), key and query maps that read x and a value map that
    reads −η·y, one linear self-attention layer adds
    −(η/N) Σ_i y_i (x_iᵀ x_j) to the y-part of token j. The gradient step on
    L(W) = (1/2N) Σ_i ‖W x_i − y_i‖² at W₀ = 0 is ΔW = (η/N) Σ_i y_i x_iᵀ,
    so the update is y_j ↦ y_j − ΔW x_j, and on a query token (x_q, 0) the
    read-out (sign flipped) is ΔW x_q, the updated model's prediction. All
    three close. The narrowed title: for unnormalized causal linear
    attention and for softmax attention, the layer's output equals a
    learner's train-then-predict step on the context (a batch gradient
    step of a linear model from zero; kernel regression that stores the
    context), and one linear self-attention layer with constructed weights
    carries one gradient step of in-context linear regression; for these
    layers conditioning and per-sequence weight updates differ in what
    state is kept.
  excluded: >-
    The promote_when's scope test: whether the pattern extends to further
    layer classes (delta-rule or mini-batch inner updates), or is bounded by
    a standard attention layer with no train-then-predict description. The
    narrowed title makes no claim about other layer classes, so this moves
    unchanged to a new QUESTION. Also excluded: normalized linear attention,
    TTT-Linear as built, and anything about trained transformers (the body's
    disclaimers already say so).
