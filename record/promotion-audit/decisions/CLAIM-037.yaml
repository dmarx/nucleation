scope:
  accepted: >-
    Two formal results.
    (1) On consistently connected systems the sheaf criterion and
    Contextuality-by-Default coincide. Each connection's elements share one
    distribution, so the maximal coupling gives them coincidence probability
    1 (NOTE-600, Thm 3.3, Thorisson). A maximally connected coupling (Def.
    3.4) is then a joint law of one variable per observable whose marginals
    are the contexts' laws, which is a global section in the
    Abramsky–Brandenburger sense (LIT-016), and conversely. Checked for this
    review. NOTE-600 marks it as the reader's inference, not the paper's, so
    it is the record's own derivation.
    (2) Order effects without contextuality: a classical Markov system in
    which asking A changes the state that B reads gives AB ≠ BA with a
    global law over the sequential outcomes. This is the manuscript's §9
    point, and a two-state construction suffices.
  excluded: >-
    "Needs Contextuality-by-Default when marginals shift with context." That
    is a methodological thesis. Part of its support is empirical: every
    corpus model in LIT-842 signals, and LIT-844's criteria diverge, 71.1%
    against 0.148%. And LIT-843 offers a rival sheaf-side route that folds
    signalling from a declared causal past into the classical model. The
    first disjunct of the defeat condition, "a pragmatic data set ... handled
    by the sheaf-theoretic test without loss", is empirical. CLAIM-069
    (Active) also says which CbD version it should name: multimaximal
    couplings, for observables in more than two contexts.
evidence:
