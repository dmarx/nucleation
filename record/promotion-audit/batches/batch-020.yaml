finding: >-
  All five scored triage-004's maximum of 7, and one yielded. The yield came
  from ADR-047 v3, not from the rubric: THEORY-295 is the one entry
  whose title reports a measured result, from a model run, in hedged
  existence form. The other four are conceptual or philosophical
  accounts, the same three of five that batch 017's control found to
  retain. Wave 3's non-formal entries split into two kinds. Measured
  results stated with hedges can promote under v3. Arguments and
  conceptual analyses cannot promote by any route the audit has, since
  nothing about them can be checked or measured.
recommendation: >-
  Before the next wave-3 batch, sort the pending wave-3 entries by what
  their title asserts. A theorem goes to the wave-2 route. A measured
  result goes to the ADR-047 v3 route. An argument or conceptual analysis
  goes to wave 5, sampled rather than ranked. Drop triage-004's score as
  an ordering: at the top it is saturated at 7.
