scope:
  accepted: >-
    ADR-047 v3. One study, Dar, Franklin, Jonsson, Srivastava and Tan (VLDB
    1996, LIT-1113), read in full in NOTE-904 from the VLDB Endowment's copy,
    with Tables 1-3 and Figures 4-9 read from rendered page images. The
    title is a simulation result with its own hedge (probe and remainder
    computation not charged). Kept, each stated in the running text and
    shown in a figure: on the clustered indexed attribute the three
    architectures "perform similarly" (Figure 4); on the unclustered indexed
    attribute page caching "performs far worse" (Figure 5); on an unindexed
    attribute with a disk cache, where every server request costs a full
    scan, "over 60% of the small (1%) queries are answered completely from
    the client's cache" (Figures 7-8).
  excluded: >-
    One precision, not a dropped thesis: the old title gave "answered over
    60% of small queries without contacting the server" with no condition.
    The paper reports it for 1% queries on the unindexed attribute with a
    disk cache only; the narrowed title says so.
  moved_to_question: >-
    The promote_when, unchanged, to a new QUESTION: a measurement in an
    implemented client-server system, or a simulation that charges the
    client for computing probe and remainder queries and for maintaining
    region descriptions, that reproduces the ordering.
