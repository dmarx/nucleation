scope:
  accepted: >-
    The core construction (LIT-115 §3, p. 58), as a new Active THEORY
    sourced to LIT-115: an adjunction between C and D^op restricts to an
    equivalence C′ ≃ D′^op between the full subcategories on which the unit
    and counit are isomorphisms. This is a dual equivalence, with Pontrjagin
    duality as the example. Re-derived below under ADR-047 v2, since the
