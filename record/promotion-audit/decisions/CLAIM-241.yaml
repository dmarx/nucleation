warrant: interpretive
disposition: promote
confidence: medium
scope:
  accepted: >-
    The objection's core: an inference gap in step 3 of CLAIM-217. The
    premise, CLAIM-151, makes the act "partly constituted" by expected
    uptake. The conclusion makes competent participants' verdicts "the
    criterion". If uptake is one constituent among several, the other
    constituents (standings, norms) can diverge from informed uptake, and
    the verdicts are then wrong about the act. So the premise gives uptake
    a vote, not the last word. This is a point about what follows from
    what, and it holds as stated. CLAIM-217 itself grants that "a kind
    that outruns even competent uptake is not excluded by argument here".
    The two requirements it adds (a rule for divided verdicts, a class of
    acts) are things CLAIM-217 does not supply, as its body shows.
  excluded: >-
    That uptake is not a standard, or that analysts' probes are better.
    Which rule for combining verdicts is right. The objection disclaims
    all three.
evidence:
  - "CLAIM-217's step 3 and its own concession, as quoted in CLAIM-241's body."
  - "Two independent statements of the same point: A240's first refinement, and the interlocutor's reading of 2026-10-12 ('constitutive dependence is not the same as epistemic authority')."
  - "No reply to CLAIM-241 is filed, and it rests on no claim."
