notes: >-
  The promote_when asked for a proof that the authors' own analysis lacked,
  and a short concentration argument supplies it. The midpoint of any two
  points in a cluster sits at squared distance d/8 from the query, while
  the nearest neighbour sits at d/6. The proof is stronger than requested.
  It shows that with probability tending to 1 every block is read, not
  only that the expected fraction tends to 1. It also covers adversarial,
  data-dependent partitions. The rubric's depth score (2) mattered, because
  the title's estimates are kept as the full reading reports them. The
  bundling score mattered too. The disclaimer "That the bounds are
  rigorous" is exactly what the promote_when asked to repair. THEORY-369
  carries no mathematics tag but is a formal result, as triage-004
  suspected, and ADR-047 v2's route applied.
