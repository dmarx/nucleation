scope:
  accepted: >-
    Theorem A.2, the general MLE bound, is re-derived here and holds.
    Setting: a finite family Θ of translators, m source texts drawn i.i.d.,
    a prior ρ under which the true translator's outputs all have positive
    plausibility, and MLE choosing θ to maximise Σ log ρ(f_θ(x_i)).
      (a) Call θ bad if its loss exceeds the threshold, and suppose every bad θ
          makes an output impossible under ρ with probability more than γ.
      (b) The true translator has finite log-likelihood on every sample. So
          MLE never chooses a θ with an impossible output on the sample.
      (c) A fixed bad θ has no impossible output on m i.i.d. texts with
          probability at most (1 − γ)^m ≤ e^{−γm}. By a union bound over at
          most |Θ| bad translators, some bad θ survives with probability at
          most |Θ|e^{−γm}. That is at most δ when m ≥ (1/γ) ln(|Θ|/δ).
      (d) So with probability ≥ 1 − δ, MLE's choice is not bad, and its loss
          is at most the threshold. That is the realisable Occam bound,
          with "impossible under the prior" in place of "wrong label", as
          the body says.
    This half needs no narrowing, and it is not what the title turns on.
  excluded: >-
