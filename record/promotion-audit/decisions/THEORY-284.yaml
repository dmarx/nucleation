scope:
  accepted: >-
    Re-derived here (ADR-047 v2): Modell, Rubin-Delanchy and Whiteley's
    Theorem 1 and the shortest-path conclusion the title draws from it.

    (1) One step. For z, z′ with d = d_f(z, z′) ≤ ε, let u = ϕ(z),
    v = ϕ(z′) on the unit sphere. g(0) = 1, since a vector's cosine with
    itself is 1. So ‖u − v‖² = 2(1 − g(d²)) = c²d² − g″(ξ)d⁴ for some ξ in
    (0, d²), with c = √(−2g′(0)) > 0. With α = ‖u − v‖, β = cd and
    K = max |g″| on [0, ε²] (finite, g ∈ C²): |α² − β²| ≤ Kd⁴, and since
    |α − β|² ≤ |α − β|(α + β) = |α² − β²|, |α − β| ≤ √K·d².

    (2) Path lengths. Let η be a path in Z_f and γ = ϕ ∘ η. Refining a
    partition raises both sums Σd_i and Σα_i (triangle inequality). By
    uniform continuity of η, partitions fine enough make every step
    d_i ≤ δ ≤ ε, and then |Σα_i − cΣd_i| ≤ √K δ Σd_i. Take a common
    refinement of near-optimal partitions for both sums and let δ → 0:
    if L(η) is finite, L(γ) = c·L(η). If L(η) is infinite, then for small
    δ, α_i ≥ cd_i − √K d_i² ≥ (c/2)d_i, so L(γ) is infinite too. So
    L(γ) = c·L(η) for every path.

    (3) Shortest paths. Z_f is compact and ϕ is a continuous injection
    into a Hausdorff space, so ϕ is a homeomorphism onto M_f
    (Proposition 1). Every path in M_f is therefore ϕ ∘ η for a path η in
    Z_f, and by (2) its length is c·L(η). So the on-manifold geodesic
    distance between ϕ(z) and ϕ(z′) is c times the infimum of L(η) over
    paths from z to z′, which is the intrinsic length metric d_f induces.
    It equals d_f only when Z_f is a length space; the title says
    "intrinsic length metric", which is right.
