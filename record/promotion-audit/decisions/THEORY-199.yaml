scope:
  accepted: >-
    Nothing is promoted. The one step checked here is the annealed map's
    local criterion. With F(p) = (u + a(1 − u))/(u + b(1 − u)), u = p^s,
    a = f(m − 1)/(mv − 1) and b = f, dF/du at u = 1 is
    ((1 − a) − (1 − b)) = b − a, and du/dp = s at p = 1. So
    F′(1) = s(b − a) = s f m(v − 1)/(mv − 1), and the informed fixed point
    is stable exactly when s f m(v − 1)/(mv − 1) < 1, as the entry says.
  excluded: >-
    The whole title. It is about the Bayes-optimal denoiser, which is
    quenched belief propagation on random-rule trees. The source proves the
    threshold only for the annealed mean-field map (NOTE-685 C2: "strong for
    the map, moderate for the RHM"; "the map's fidelity to quenched BP is
    numerical"). The promote_when asks for the quenched proof, a
    reconstruction-threshold theorem on random trees. That is a research
    problem and not a short re-derivation.
