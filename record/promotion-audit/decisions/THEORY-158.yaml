scope:
  accepted: >-
    The finite-state equivalence, re-derived for this review under ADR-047
    v2. Setting: X is finite, H is infinitesimal stochastic (off-diagonal
    Hᵢⱼ ≥ 0, columns summing to 0), the master equation is ψ′ = Hψ, and O is
    a function on X. Write
    d⟨f⟩/dt = Σᵢ f(i)(Hψ)ᵢ = Σⱼ ψⱼ Σᵢ f(i)Hᵢⱼ. This vanishes along every
    solution iff Σᵢ f(i)Hᵢⱼ = 0 for every j, since the starting point can be
    any point mass.
    (a) If O and O² have constant means, then for every j,
    Σᵢ (Oⱼ − Oᵢ)² Hᵢⱼ = Oⱼ² Σᵢ Hᵢⱼ − 2Oⱼ Σᵢ OᵢHᵢⱼ + Σᵢ Oᵢ² Hᵢⱼ = 0. The
    i = j term is 0, and every other term is non-negative. So Hᵢⱼ ≠ 0 implies
    Oᵢ = Oⱼ, which means O is constant on each connected component of the
    transition graph. It also gives [O, H]ᵢⱼ = (Oᵢ − Oⱼ)Hᵢⱼ = 0.
    (b) If [O, H] = 0, then (Oᵢ − Oⱼ)Hᵢⱼ = 0, so O is constant on components.
    Then for every polynomial p, Σᵢ p(Oᵢ)Hᵢⱼ = p(Oⱼ)Σᵢ Hᵢⱼ = 0, and every
    polynomial in O has a constant mean. That closes the cycle of four
    conditions.
    Counterexample, checked: H₁₂ = H₃₂ = r, H₂₂ = −2r, all else 0, and
    O = (0, 1, 2). Then Σᵢ OᵢHᵢ₂ = −2r + 2r = 0, so the mean of O is conserved,
    while [O, H]₁₂ = −r ≠ 0.
