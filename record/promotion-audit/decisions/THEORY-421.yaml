  re_derivation: >-
    The clause "a loss built on pairwise distances leaves the origin
    arbitrary" is the record's own (NOTE-669, Key insight); re-derived here.
    (1) Hyperbolic space H^n has a transitive isometry group G: for any
    points p, q there is g in G with g(p) = q, and d(g x, g y) = d(x, y)
    for all x, y. (2) Let L(Z) depend on an embedding Z = (z_1..z_N) only
    through the pairwise distances d(z_i, z_j), as the Fermi-Dirac link
    likelihood and a softmax over distances do. Then L(gZ) = L(Z) for every
    g in G. (3) So if Z* minimises L, so does gZ* for every g, and by (1)
    g can carry any node, the root included, to the origin or to any
    distance from it. (4) Hence L does not fix where the origin lies
    relative to the embedding: the root's distance from the origin is set
    by parametrization and training dynamics, not by the loss. The node-
    classification loss in HGCN maps to the tangent space at the origin and
    is not pairwise-only, so (4) covers the link-prediction runs; the title
    keeps the conditional form, which is exactly what is proved.
  excluded: >-
    The lead clause "In hyperbolic graph embeddings trained on
    link-prediction or classification losses, distance from the origin is
