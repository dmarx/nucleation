  excluded: >-
    The thesis itself, that basic objects can be nothing beyond the
    bearers of their relations, and that primitive numerical diversity
    without thisness suffices where nothing discerns them, is argued, not
    derived. Its promote_when asks for a defence that primitive diversity
    is coherent and is not thisness under another name, and for an account
    of points in symmetric space-times. Both are argumentative work that no
    re-derivation or measurement can supply.
