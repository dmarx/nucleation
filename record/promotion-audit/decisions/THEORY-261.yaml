scope:
  accepted: >-
    The former promote_when accepts "a simulation of the basic design at M
    of 10^5 or more" confirming three things; the record ran one, and all
    three hold.

    Design simulated: Kanerva's basic SDM. M hard locations with uniform
    random n-bit addresses (n = 256; n = 128 as a check); activation is the
    Hamming ball of radius r, so p = P(Binomial(n, 1/2) <= r). T uniform
    random N-bit words (N = 64; N = 256 as a check) written at uniform
    random addresses into +-1 counters; each read at its exact storage
    address, bit = sign of the summed counters; fidelity over 2,000 reads
    (128,000 bits). r chosen so p is nearest (2MT)^(-1/3).

    (1) Fidelity follows Phi(rho), rho^2 = pM/[1 + pT(1 + p^2 M)]. At
    M = 10^5: T = 6,000, 8,000, 9,000, 10,000 gave 0.99991, 0.99953,
    0.99897, 0.99864 against predicted 0.99985, 0.99929, 0.99879, 0.99811.
    At heavy load (T = 25,000, 4,000 reads) across radii: measured 0.9618,
    0.9679, 0.9713, 0.9727, 0.9706, 0.9648 against predicted 0.9559,
    0.9642, 0.9689, 0.9712, 0.9714, 0.9688 for p from 1.1e-4 to 1.1e-3.
    The formula is slightly pessimistic at small p (it counts the variance
    of the target's own activation count as additive noise, though that
    count multiplies the right bit) and slightly optimistic at large p
    (overlaps of Hamming balls vary more than Poisson).

    (2) The best p is near (2MT)^(-1/3). At M = 10^5, T = 25,000, measured
    fidelity is highest at p = 4.4e-4 (radius 101) and the formula's at
    p = 6.9e-4 (radius 102); (2MT)^(-1/3) = 5.85e-4 lies between them.

    (3) Capacity at fixed fidelity grows in proportion to M with N fixed.
    The largest T with fidelity >= 0.999: about 2,000 at M = 25,000
    (tau = 0.080), 4,000 at 50,000 (0.080), 8,900 at 100,000 (0.089) and
    19,000 at 200,000 (0.095), rising toward the asymptote 0.105. Word
    length does not enter: N = 256 against N = 64 at M = 10^5, T = 6,000
    gave 0.99983 and 0.99991, within sampling error.

    Recipe: sdm.py as described (numpy bitwise_count for distances, a
    sparse activation matrix A, counters C = A^T W, reads S = A_read C);
    seeds 0 and 7; about 20 s per run at M = 10^5, T = 6,000 on four
    cores.
  excluded: >-
    Noisy cues, clustered data and the critical distance, as the body
    already says. "Capacity ... to about a tenth" is the large-M limit;
    the title now says it rises toward that, since at M up to 2 x 10^5
    it is 0.08 to 0.095.
