notes: >-
  The promote_when asks for a second reading that checks the derivation
  independently. Under ADR-047 v2 the step-by-step re-derivation above
  meets it, and it is exact, not leading-order. Its other half, a second
  model (a Potts or non-integrable chain) on which the first IB feature is
  found to be the eigenvector, is a wider check. The review found that on
  a skewed 3-state chain the global first transition comes before the
  bifurcation. The encoder that beats the trivial one there still
  separates states by the sign of r_1, so it is not a counterexample to
  the feature claim. It shows only that "first transition" has to mean
  the bifurcation. The new QUESTION should ask when the two coincide.
  Triage-006 scored it 3 (title, relation, derived), correctly.
