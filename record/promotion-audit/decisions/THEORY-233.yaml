scope:
  accepted: >-
    The title as stated, which is mathematics only. Write ρ = K_X/Tr K_X,
    σ = K_Y/Tr K_Y, A = √ρ√σ, r = min(r(K_X), r(K_Y)), and F = (Tr|A|)², the
    fidelity, so NBS = 1 − ½B² = √F, since B² = 2 − 2√F. CKA = Tr(ρσ)/(‖ρ‖_F‖σ‖_F).
    (Lower) F = (Tr|A|)² ≥ ‖A‖_F² = Tr(ρσ) = CKA·‖ρ‖_F‖σ‖_F ≥ CKA/√(r_X r_Y),
    since 1 = Tr ρ ≤ √r_X ‖ρ‖_F by Cauchy–Schwarz on the eigenvalues.
    (Upper) rank A ≤ r, so (Tr|A|)² ≤ r‖A‖_F² = r·CKA·‖ρ‖_F‖σ‖_F ≤ r·CKA,
    since ‖ρ‖_F ≤ Tr ρ = 1. At rank 1 every step is an equality.
    Eq. 27: NBS = Tr|A| ≥ |Tr A| = CKA(K_X^½, K_Y^½), because
    ‖K^½‖_F² = Tr K, so K^½/‖K^½‖_F = √ρ, with ‖√ρ‖_F = 1. Equality holds when A ⪰ 0,
    in particular when the kernels commute. Eq. 28: 1 − Tr(√ρ√σ) =
    ½‖√ρ − √σ‖²_F ≤ ½‖ρ − σ‖₁ ≤ √(1 − F), by the Powers–Størmer inequality and
    the Fuchs–van de Graaf upper bound. All three were checked for this
    review by a direct route, independent of the paper's App. A.3.
  excluded: >-
    The promote_when's second clause, a measurement on trained networks of
    how far CKA and NBS disagree. The THEORY does not claim it ("Not how
    large the discrepancy is in trained networks"). That is an empirical
    question, and it goes to a QUESTION unchanged, as THEORY-155's human-
    chain clause did (batch-000).
