disposition: split
confidence: medium
scope:
  accepted: >-
    A new Active THEORY sourced to LIT-831 (CbD 2.0), Examples 1–3 and
    Section 4, read in NOTE-643 (claims C4 and C6). Under multimaximal
    couplings, coarse-graining a non-binary variable can turn a
    noncontextual system into a contextual one. So the CbD verdict on a
    fixed set of measurements depends on which variables represent them.
    Also in it: for connections of two variables, hence cyclic systems, and
    for consistently connected systems, CbD 1.0 and 2.0 agree.
  excluded: >-
    THEORY-168 keeps what is asserted or needs a second proof.
    (1) That maximal and multimaximal couplings give different verdicts:
    CbD 1.0's non-heredity is asserted with no example (NOTE-643 C3), and
    the Kochen–Specker disagreement is asserted, not computed (C7).
    (3) Theorem 4.6, the nominal-dominance criterion for all dichotomizations
    of a content-sharing pair (LIT-790 supplement), for which the
    promote_when asks a checked second proof.
    Also the continuous-density argument of LIT-790 §5, which is an
    argument and not a theorem.
evidence:
  - >-
    Checked for this review, LIT-831 Example 1. Take X, Y, Z on {a, b, c} with
    masses (0, ½, ½), (½, 0, ½) and (½, ½, 0). A maximal coupling of a pair
    attains Pr[equal] = Σ min of the masses = ½, at c for (X, Y), at b for
    (X, Z) and at a for (Y, Z). The events {X = Y = c}, {X = Z = b} and
    {Y = Z = a} are pairwise disjoint, since each pair of them would need
    one variable to take two values. Three disjoint events of probability ½
    is impossible. So no coupling is pairwise maximal, hence none is
    multimaximal (Theorem 5), and the system is contextual.
  - "NOTE-643 Examples 2–3: Example 2's 6-valued variables have two multimaximal couplings (noncontextual), and lumping i with i′ gives Example 1. That is the coarse-graining failure, which the promote_when itself calls 'already proved'."
  - "NOTE-643 C4: the agreement of 1.0 and 2.0 on two-variable connections is 'immediate from the definitions'."
blockers:
