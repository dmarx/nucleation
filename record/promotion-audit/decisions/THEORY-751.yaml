scope:
  accepted: >-
    The whole title. The body already re-derives the converse and the
    three-letter counterexample. The promote_when names two steps that
    were not derived: achievability by superposition coding, and the
    Hamming degrading channel for every finite source. Both are
    re-derived below, A1-A4 and H1-H6. The Hamming channel is derived in
    closed form from the KKT conditions, not just checked numerically.
  excluded: >-
    Continuous alphabets, single-shot quantizers and the information
    bottleneck. The title does not claim them, and the body's "What this
