scope:
  accepted: >-
    ADR-047 v3: one study (Papyan, Han & Donoho, arXiv v2) read in full,
    now including Figures 2-7 read from the rendered plots, which batch 044
    found missing. The title is narrowed to the plotted runs (VGG, ResNet,
    DenseNet; seven balanced datasets; cross-entropy, SGD, weight decay, no
    augmentation) and to what they show: every measure moves toward
    collapse in all 21 cells, close to completion on MNIST, Fashion-MNIST,
    SVHN and CIFAR-10, partial on CIFAR-100 and STL10, and clearly
    incomplete on ImageNet.
  excluded: >-
    "Collapses onto their class means" as a general statement: on ImageNet
    Tr(Sigma_W Sigma_B^+)/C ends near 1 (ResNet), 2 (VGG) and 10 (DenseNet),
    and nearest class mean disagrees with the network on about a tenth of
    test examples. The body's "monotone across all 21 cells", which the
    plots contradict. Replication outside the protocol and a
    gradient-descent derivation, moved to QUESTION-202.
evidence:
  - "Fig. 6: NC1 ratio ends about 1e-4 to 1e-2 on the four easier datasets, 1e-2 to 1e-1 on CIFAR-100 and STL10, about 1-10 on ImageNet."
  - "Fig. 7: NCC mismatch near 0 on the easier datasets, 0.02-0.07 on CIFAR-100 and STL10, about 0.1 on ImageNet."
  - "Figs. 2-5: equinorm, equiangular, maximal-angle and self-duality measures fall in every cell; plateaus above zero on the harder datasets (e.g. NC3 about 0.3 for DenseNet on ImageNet)."
  - "Methods: one plotted run per dataset-network pair (best final test error of a learning-rate sweep), no seeds or intervals; values read from plots, not stated in the text."
