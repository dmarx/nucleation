# record/promotion-audit/decisions/CLAIM-265.yaml
id: CLAIM-265
batch: batch-040
reviewed: '2026-10-19'
reviewed_revision: 808d0f8a29187a4be92891ae31e9fffebec3862c
current_status: Proposed
warrant: interpretive
disposition: needs-correction
confidence: medium
scope:
  accepted: >-
    The class-relative form. Two local descriptions that disagree are not
    thereby incompatible. Whether they obstruct a joint description is
    decided only relative to a specified class of admissible
    correspondences. A correspondence admitted only because it removes the
    disagreement decides nothing.
  excluded: >-
    The singular "only once the correspondence is fixed". The defeat
    condition's first disjunct (a verdict "without any correspondence ...
    being fixed") is met by the bijection case below, so the title as
    written is defeated on its own terms. The proviso as written ("a
    correspondence fitted to remove the disagreement decides nothing") is
    also too broad. Inside a class specified in advance, finding a
    reconciling member is the compatibility verdict for that class.
derivation: >-
  Let V(D1, D2, C) be the verdict under a class C of correspondences, each
  coherent with restriction. The descriptions are compatible relative to C
  if some member carries D1 onto a description agreeing with D2 on every
  shared context, and obstruct relative to C if none does.
  (1) CASE-039 (Active): inertial frames disagree on simultaneity, and the
  Lorentz maps reconcile them, so disagreement does not entail
  incompatibility.
  (2) Take one shared context with two outcomes, D1 = (1/2, 1/2) and
  D2 = (1/3, 2/3). Under C = the outcome bijections, both bijections give
  (1/2, 1/2), which is not (1/3, 2/3), so they obstruct. Under C' = all
  maps applied to both descriptions, the map onto a single outcome gives
  (1) for both, so they are compatible. The same pair gets opposite
  verdicts.
  (3) The obstruction under C holds for every member at once, with no
  member fixed, so a singular fixed correspondence is not necessary.
  (4) Under all maps every pair is compatible, so the existence of a
  reconciling map is uninformative unless the class was specified
  independently of the disagreement first. Inside such a class it is the
  verdict.
