scope:
  accepted: >-
    The summary overstates its anchor. "List and Pettit's result that a
    rational group cannot judge proposition by proposition from its
    members' judgments (THEORY-127)" is the general impossibility
    (Propositions 2–3). The source cites it without proof, and THEORY-127
    keeps it, Proposed. The claim needs less: that a whole's judgment is
    not recovered by aggregating its members' judgments one proposition at
    a time. One agenda on which proposition-wise majority fails already
    shows that. That agenda is THEORY-725 (Active), and its weak
    discontinuity is the claim's point in miniature: the members'
    judgments on the conclusion do not fix the group's, but their whole
    judgment sets do. So the summary should say "can fail to", with
    THEORY-725 added as the formal anchor. THEORY-127 stays a ground,
    cited as open, for the general case.
  excluded: >-
    The claim itself, its status and its other grounds. THEORY-140,
    THEORY-144 and THEORY-139 are Proposed and cited as open, as the
    directive already says.
evidence:
  - "CLAIM-030 summary: 'List and Pettit's result that a rational group cannot judge proposition by proposition from its members' judgments (THEORY-127) is its formal anchor'."
  - "THEORY-725 'What this does not say': 'That no proposition-wise rule depending on more than one individual and respecting unanimity is robustly rational (Propositions 2–3) is cited in the source, not proved. It is THEORY-127's, still Proposed.'"
