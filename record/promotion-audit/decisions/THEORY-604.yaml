evidence:
  - "NOTE-141 (read in full): the core construction is stated in §3. The breadth claim is exposition, and the reservation of 'duality' for structural reversal is a preference."
  - >-
    Re-derivation: let F : C → D^op be left adjoint to G : D^op → C, with
    unit η : 1 → GF and counit ε : FG → 1. Let C′ be the full subcategory
    of objects c with η_c an isomorphism, and D′ that of objects d with ε_d
    an isomorphism. If c ∈ C′, the triangle identity
    ε_(Fc) ∘ F(η_c) = 1_(Fc) has F(η_c) invertible, so ε_(Fc) is invertible
    and Fc ∈ D′. Dually, G(ε_d) ∘ η_(Gd) = 1_(Gd) puts Gd in C′ for d ∈ D′.
    On C′ and D′ the unit and counit are natural isomorphisms 1 ≅ GF and
    FG ≅ 1, so the restrictions are inverse equivalences C′ ≃ D′, with D′
    a full subcategory of D^op. That is, C′ is equivalent to the opposite
    of a full subcategory of D.
