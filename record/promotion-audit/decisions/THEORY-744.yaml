new_question: >-
  Does the alpha-normalized limit hold on a compact manifold with boundary,
  in L^2 on band-limited functions at a stated rate (the source's printed
  O(eps^gamma) against the O(eps^{gamma/2}) its bound gives)? And does
  P_{eps,alpha}^{t/eps} converge to the semigroup of the limit operator
  (the source's Proposition 11, whose proof is incomplete)?
