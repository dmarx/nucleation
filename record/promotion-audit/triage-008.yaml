  THEORY-181:
  - text: the critical training fraction of grokking-like generalisation is where the training set comes
      to fix the representation (the mechanism, for trained networks and other sizes)
    kind: 1
    who_asserts: LIT-858 (Liu et al., Towards Understanding Grokking)
    existing_carrier: null
    suggested_title: In networks that learn arithmetic from embeddings, generalisation sets in at the
      training fraction at which the training set's same-answer pairs come to fix the generalising representation,
      so that fraction is the critical one, as Liu and coauthors propose
    suggested_promote_when: 'What would settle it is the same toy (two learned embeddings summed and decoded,
      addition hard-coded) run at several group sizes p. For each training set, it would have to report
      the nullity of the linear system its same-answer pairs impose and whether the trained network generalises.
      The claim holds if, at every p, full generalisation occurs with high probability exactly on training
      sets of nullity 2, and the empirical critical fraction follows the fraction at which nullity 2 becomes
      likely. It is refuted by networks in that setting that generalise fully on training sets of nullity
      above 2, or by a critical fraction that departs from the nullity threshold as p grows. More single-size
      runs, or pictures of structured embeddings in larger models, are the wrong kind of evidence: they
      show structure, not that the training set''s equations are what fix it.'
