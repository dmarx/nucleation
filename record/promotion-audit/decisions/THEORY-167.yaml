route: source (ADR-047 v3)
scope:
  accepted: >-
    Nothing yet. A narrowed title is within reach under ADR-047 v3: "In
    Afanasyev's tales 50-151, as Propp coded them, the actions fall into
    31 functions occurring in one order up to the inversions and swaps he
    names, distributed over seven roles." Propp's analysis of one fixed
    corpus is a measured (coded) result, and the main text was read in
    full (NOTE-615 version 1: preface and chapters I-IX). The promote_when's
    request for an independent coding with agreement measured is a
    replication request and would move to a QUESTION; NOTE-615 already
    states it as an open question.
  excluded: >-
    The title as written, for two reasons. First, its scope: "The Russian
    wondertale" and "all wondertales share one composition" go beyond the
    hundred tales measured, and the "all" is partly definitional, since
    Propp ends by defining the class as the tales that follow the scheme
    (NOTE-615 C4, "moderate, partly definitional"). ADR-047 v3 covers a
    title that claims no more than the study measured. Second, the
    measurement itself: the order invariance, the title's core, rests on
    the per-tale schemes in chapter IX and appendices II-IV, which NOTE-615
    did not check ("the schemes in ch. IX are garbled in the OCR";
    appendices II-IV "were not read"). This is batch 019's trap: v3 needs
    the result in the text the record read, and here the data behind the
    order claim was not read. C1 (functions as the constant elements) is
    shown in chapter III with examples from each tale, and the exclusive
    pairs' counts (41 and 33 of 100) are in the text, but those do not
    carry "in a fixed order".
evidence:
  - "NOTE-615 version 1: main text read in full in the 1928 Russian OCR; appendix I skimmed; appendices II-IV not read; ch. IX schemes garbled."
  - "NOTE-615 claims table: C1 strong (for the corpus); C2 and C3 (order invariant up to named inversions and swaps) moderate; C4 moderate, partly definitional."
  - "NOTE-642 (LIT-830, Skimmed) covers chapters II-III of the 1968 English edition only, not the schemes."
blockers:
  - "The per-tale schemes, on which the order invariance rests, are unread. A clean copy (the English edition's appendix of schemes, or a better scan of the Russian) read and checked against chapter IX would remove this."
  - "The title generalises from the corpus to the class, and the class is defined by fit to the scheme."
