scope:
  accepted: >-
    The evidential rule as stated. Agreement under a probe family is
    evidence of shared structure only insofar as the family was fixed
    independently of the comparison and is tested on cases it was not
    chosen on. It is argued from two premises, both Active once PR #165
    merges: CLAIM-264's exact half (agreement on a restricted family is
    coarser than identity), and CLAIM-011 (Active, granted), whose
    anchoring remedy this rule applies to probes. The step is the familiar
    selection-effect argument: a family chosen to make two objects agree
    cannot fail to, so its agreement carries no information about them.
  excluded: >-
    Nothing beyond the claim's own "What it does not say": which probes to
    choose (QUESTION-031), and that held-out agreement settles identity.
