scope:
  accepted: >-
    Re-grounding. The claim uses List and Pettit for one point: "A group's
    judgments can depart from what its members judge on the same
    proposition while being wholly fixed by the members' whole sets of
    judgments." That is THEORY-725's weak discontinuity under the
    premise-based procedure (Active, #185). In two profiles the members'
    verdicts on R are (yes, no, no). The group accepts R in one and rejects
    it in the other, and in both the group's set is a function of the
    members' whole sets. Nothing here needs THEORY-127's general
    impossibility (Propositions 2–3, Proposed), so the ground moves to
    THEORY-725.
  excluded: >-
    Promotion. The claim is interpretive, it rests on CLAIM-177 (Proposed,
    empirical), and its own defeater, the owner's unrecorded change of
    mind, is untested. The re-grounding changes none of that.
