scope:
  accepted: >-
    The title as it stands. It is a structural fact about Ganea et al.'s
    construction, which the promote_when itself calls settled, re-derived
    below: lifted linear maps and nonlinearities compose to a Euclidean
    composition read through the chart at the origin, so a bias-free stack
    is a Euclidean network conjugated by that chart, and the curvature c
    enters the network only through the Möbius bias translations, the
    distance-based output layer, and the chart itself.
  excluded: >-
