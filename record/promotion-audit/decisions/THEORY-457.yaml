scope:
  accepted: >-
    Sorted by hand as an argument, not a game-theoretic result and not a
    measurement. The proportionality clause reads like a theorem, but
    Baumard, André and Sperber (LIT-508) cite only a pairwise result from
    André and Baumard (2011a), not held here, and say that for effort and
    talent "a formal proof will require further modeling" (p. 67). The
    selection-for-genuine-fairness clause is a verbal argument. The
    empirical section rereads economic games that were not designed to
    test the account (p. 77).
  excluded: >-
    Everything. The promote_when asks for a formal model with partner
    choice and outside options that derives proportional division, and
    for experiments that separate fairness by entitlement from altruism.
    Neither is in the record.
evidence:
  - "Baumard, André and Sperber (2013), LIT-508; the THEORY body's account of sections 2.1.4, 2.2.1 and 3."
