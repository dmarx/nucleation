notes: >-
  The promote_when rules out "the general fact that Sub(X) is Heyting in any
  topos", because clopen sub-objects are not all sub-objects. The argument
  above is internal to Sub_cl(Σ) and uses extremal disconnectedness, so it
  meets that objection. It agrees with LIT-378's remark that Sub_cl(Σ) is
  not a Heyting subalgebra of Sub(Σ): its joins and negation are
  regularized. Confidence is medium because part 2's restriction-stability
  rests on NOTE-292's check, not on a re-derivation here.
