notes: >-
  The entry is ADR-047 v3's case. The title is hedged ("can hold"),
  claims what one model run showed, and the study was read in full. Its
  "so ... does not track" clause and its unqualified scope are the only
  overreach, and narrowing fixes both. The S23 half is formal, but it is
  formal about the model, so it is promoted with the THEORY rather than
  split into a CLAIM: it is the source's own proof, re-checked, not the
  record's own result (ADR-032 does not apply).
