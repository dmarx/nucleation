blockers: []
notes: >-
  Proposed new title: In a simulated single-client, read-only database
  answering selection queries on one relation, describing cached data by
  the predicates of past queries let each query be answered partly from
  cache, with only the remainder Q AND NOT V sent to the server; this
  matched page caching on a clustered index, beat it on an unclustered one,
  and, on an unindexed attribute with a disk cache, answered over 60% of 1%
  queries without contacting the server; the cost of computing probe and
  remainder queries was not charged. Confidence medium: one simulator, one
  synthetic relation, three runs.
