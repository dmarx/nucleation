  wave 3, rescore depth per claim: read a NOTE's history line for "followed
  as statements", "not re-derived" or "taken as stated", rather than its
  overall "read in full". Add "filer's synthesis" or "stated by no source"
  and "nothing was tested" to triage_wave3.py's firsthand markers. Compare
  with batch 017's control before drawing a wave-3 rate. If the control
  also yields only formal entries, drop wave 3's priority below wave 4.
