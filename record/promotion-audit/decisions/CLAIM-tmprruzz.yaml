  accepted: >-
    For a network linearised at θ0, with prior θ − θ0 ~ N(0, α⁻¹I) and
    Gaussian noise of precision β, the log-determinant part of the log
    evidence is −½ Σ log(1 + βλ/α) over the non-zero eigenvalues of the
    empirical NTK Gram matrix J Jᵀ, so at most n directions are priced and
    γ < n.
  excluded: >-
    The Gram spectrum on the sphere and the per-harmonic schedule, which
    stay in THEORY-080.
derivation: >-
  MacKay's Eq. 20 with Z_W = (2π/α)^(k/2): −½ log det A − log Z_W
  + (k/2) log 2π = −½ log det(A/α) = −½ log det(I + (β/α)JᵀJ), A =
  αI + βJᵀJ. JᵀJ and J Jᵀ share their non-zero eigenvalues (SVD of J);
  zero eigenvalues contribute log 1 = 0. γ = Σ βλ/(βλ + α) over the same
  at most n eigenvalues, each term in [0, 1).
