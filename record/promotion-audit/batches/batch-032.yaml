finding: >-
  The source route's first five went 1 of 5, and the one yield was a theorem
  that the route had misfiled. That repeats batches 016, 017 and 020: in
  wave 3, only formal results and measurements read first-hand promote.
  Triage-005's route flag sent four arguments and one secondary review
  here, and its depth score cannot tell a full reading of a review from a
  full reading of a study. The four retained entries have specific,
  external blockers: no measurement (351), an unheld Sen text (411), no
  sample of usage (490), no systematic review (560). None can be met by
  any route the audit has.
recommendation: >-
  Before the next source-route batch, re-sort the remaining source-route
  entries by batch 020's rule, reading only the title and the source NOTE's
  history line, and move the arguments to the wave-5 pool. Add a depth
  check for secondary sources: a NOTE that read a review or encyclopedia
  entry in full scores as cited, not read, for the results it reports.
  Prose titles that state deductions ("only if", "necessary", "every
  equilibrium") should be flagged as formal.
owner_questions:
  - >-
    THEORY-351's title ends "this is argued by task analysis of mandated
    procedure, not measured". Its self-report is accurate and the source
    was read in full. Should such a title be judged as a report of the
    argument, and so be promotable, or as the thesis argued, and so held
    for wave 5? Recommended: the thesis. A THEORY's status is credence in
    what it asserts, and the self-report belongs in the body, where it
    already is. If the owner agrees, a later pass could move such clauses
    out of titles.
