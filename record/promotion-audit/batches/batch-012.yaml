finding: >-
  All four paths needed the record to supply a step, and three of them
  turned up an error in what the record held. THEORY-239's "unique" is
  false: a d-span tilted off μ_d towards μ_{d+2} ties the minimum
  worst-case error. THEORY-234's title says "only when" for a sufficient
  condition its body calls sufficient. THEORY-257's source says VAR(1)
  models have exact solutions "at every scale generically", which fails
  over the reals on an open set. THEORY-196's lower bound, which the
  source proved with an approximation used as an equality, was redone
  exactly with explicit constants. Its upper bound rests on a paper
  neither record holds. The one non-yielder, THEORY-254, is an empirical
  comparison tagged mathematics, so it is misclassified rather than
  blocked by a proof.
recommendation: >-
  Keep reviewing wave 2 in code order, but screen the title's verb first.
  An empirical verb ("matches", "recur", "is found") means wave 3. When
  re-deriving under ADR-047 v2, test any "unique", "only" or "generic"
  in the title by perturbing the claimed optimum or by a 2 × 2 example.
  These four batches found most of the scope errors that way.
