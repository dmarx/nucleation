disposition: narrow-and-promote
confidence: medium
scope:
  accepted: >-
    Proposed narrowed title: "In Friston's 2013 formulation and the
    applications the record holds, a Markov blanket does not individuate a
    system. Where it falls is fixed by modelling choices made before it is
    traced: the coupling graph, the internal set and the time steady state
    is assumed. A blanket read from a fixed graph is the same whether the
    system produced the boundary or it was imposed." Every clause is shown
    in the body. The soup's three choices are documented from the
    published code (LIT-603 §4.2, read in NOTE-447). The three published
    placements are in LIT-598 §3.2 (NOTE-450). The last clause follows
    from the formalism, since a fixed graph's conditional independences
    carry no variable for how the boundary came about (LIT-598 §3.3 and
    fn. 17, and THEORY-066).
  excluded: >-
    The unrestricted "a Markov blanket" and "cannot represent a boundary
    the system produces", as claims about the later formulations. Those
    are sparse coupling at nonequilibrium steady state (Friston 2019 and
    later) and time-varying blanket states (Ramstead et al. 2020). The
    body says it does not settle them, and the record holds neither.
evidence:
  - "NOTE-447 and NOTE-450 read the cited sections of both critiques, and NOTE-421 read LIT-526. The soup re-run is from LIT-526's own code."
  - "Dependants: CLAIM-152 (Active, demonstrated) cites the placement clause, and CLAIM-194 grounds on the made-or-imposed clause. Both survive the narrowing, because neither leans on the later formulations."
  - "No claim in the record objects to THEORY-073. The free-energy literature's reply runs through the later formulations, which the narrowing sets aside."
