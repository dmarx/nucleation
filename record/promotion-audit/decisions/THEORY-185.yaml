  - "NOTE-665's own check: at q_k = 1 the PMI's constant mode is negative, so a WᵀW factorisation keeps the d attribute modes. Step (4) covers this, because those are still affine."
  - "Citers: CLAIM-082 (supports), CLAIM-119, QUESTION-025, the THEORYs on word geometry (-188, -189, -195, -196, -269, -271, -292, -566, -698) and many NOTEs and LITs cite it with inactive-ok directives. None relies on the M clause beyond what the narrowed title keeps."
  - "Nothing in the record contradicts the conditional theorem. THEORY-271 is a rival for a different generative premise (additive mixtures), and its body says the two can both be right."
