notes_for_ledger:
  - >-
    A conditional theorem should be promoted on the hypotheses its proof
    uses, not the ones its source names. THEORY-478's source assumed 'a
    tree heat kernel'. The proof needs only a Hölder bound and a
    separation bound on Hellinger distances, and the admissible range is
    α < θ/β. The source's range (θ = 1) and the reader's repaired range
    (θ = 1/2) are then two instances of one theorem, not a dispute.
  - >-
    Multiscale sums of the form Σ_k 2^(−kα) h_k with a Hölder regime below
    a crossing scale and a separation regime above it are equivalent to
    d^(αβ) exactly when α < θ/β. The coarse-scale geometric sum is the
    only place the exponent condition enters. A reusable template for
    multiscale diffusion distances.
  - >-
    'No Bell-like no-go in a prepare-measure scenario' has a one-line
    proof: send λ = (x, a). Any distribution with Y independent of (X, A)
    is then realized. Worth reusing wherever a source states a
    realizability claim without derivation.
  - >-
