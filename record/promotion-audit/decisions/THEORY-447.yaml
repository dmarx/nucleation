scope:
  accepted: >-
    Nothing new. The title is Parfit's (1971) fission argument stated as
    a conditional: "Granted that a person survives a brain transplant and
    that half a brain would do, ... so what matters is not identity". The
    conditional shape is what triage-007 read as a theorem.
  excluded: >-
    Promotion as a valid inference from the two premises. Lewis's reply
    (THEORY-476), a named rival, grants the inference's premises
    (identity is one-one and all-or-nothing; what matters may branch and
    come in degrees) and denies the conclusion, by
    describing division as two persons sharing their earlier stages. A
    conditional whose antecedent a rival grants while rejecting the
    consequent is not demonstrated by the antecedent. The step from
    "each product stands in all that matters" to "what matters is not
    identity" is where the dispute sits. No formal core separates.
