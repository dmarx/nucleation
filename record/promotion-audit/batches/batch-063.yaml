band:
  - {code: THEORY-246, title_asserts: thesis plus measurement, hand_label: measurement, triage_007: measurement, agrees: true, outcome: narrow-and-promote}
  - {code: THEORY-385, title_asserts: measurement, hand_label: measurement, triage_007: measurement, agrees: true, outcome: narrow-and-promote}
  - {code: THEORY-201, title_asserts: theorem plus measurement plus argued link, hand_label: theorem plus measurement, triage_007: measurement, agrees: partly, outcome: split}
  - {code: THEORY-334, title_asserts: measurement plus inference, hand_label: measurement, triage_007: measurement, agrees: true, outcome: narrow-and-promote}
