finding: >-
  Two of the five yields are formal results with no mathematics tag
  (THEORY-369, and THEORY-111's core). They took the wave-2 route: a
  re-derivation under ADR-047 v2. The genuinely source-backed empirical
  candidates (THEORY-079, THEORY-170, and THEORY-111's empirical half)
  yielded nothing. Each is held by a promote_when that names a measurement
  the record has not read, and no reading or re-derivation substitutes. So
  wave 3's yield, measured on its non-formal members, is 0 of 3 here.
  Triage-004's maximum score does not predict yield. Its components fire on
  vocabulary, and the decisive facts are elsewhere: whether the entry is a
  filer's synthesis, whether the support is illustrative, and whether the
  NOTE re-derived the step the claim needs. The first review that
  re-derived a step a NOTE had taken on trust (THEORY-481) found an error
  in the source.
recommendation: >-
