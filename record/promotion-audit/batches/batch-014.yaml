  unfiled derivation (an across-items constant-kernel exclusion and a
  finite LP for deficiency). CLAIM-212 only needs its warrant corrected,
  because its mathematics is already Active in CLAIM-323. The proposed_deps
  column was therefore a poor predictor here. A Proposed THEORY listed as a
  dependency should be checked for which direction of it is used.
