notes: >-
  Triage-006 flagged its philosophical-title penalty as misfiring here:
  "argument" in the title means debate content, not that the entry is an
  argument. Sorted by what the title asserts (batch 020), it is a model
  result. It is not a theorem: the paper proves nothing, and re-deriving
  it would mean re-running the 2,816-state chain over a 17 × 17 payoff
  table, which the record cannot check by hand. So ADR-047 v2 does not
  apply, and v3 does, on the THEORY-178 precedent that a computed model
  result read in full counts as one study. Confidence is medium for two
  reasons: the equilibrium selection (a truth-favouring planner among the
  equilibria left after removing weakly dominated strategies; (Exit,
  Exit) is always an equilibrium) carries part of the result, and the dip
  rests on a figure, seen but not tabulated. The promote_when asks for
  more than two debaters or richer strategies, outside the narrowed
  title, so it moves unchanged to a new QUESTION.
