scope:
  accepted: >-
    The readout result, on a finite set of M stimuli. A regularized linear
    readout with G = aC_X + bI decodes only through
    K_X = X G⁻¹ Xᵀ/M (THEORY-008). Re-derived for this review: with the
    thin SVD X = USVᵀ and C_X = XᵀX/M, K_X = U diag(s²/(as² + bM)) Uᵀ,
    while Γ_X = XXᵀ/M = U diag(s²/M) Uᵀ. So each eigenvalue γ of Γ_X maps to
    k = γ/(aγ + b), with the same eigenvectors, and zero to zero. For b > 0
    the map t ↦ t/(at + b) has derivative b/(at + b)² > 0 on t ≥ 0, so it is
    injective with values below 1/a, and its inverse gives
    Γ_X = bK_X(I − aK_X)⁻¹. K_X therefore fixes the Gram matrix XXᵀ. Two
    representations with the same number of columns and the same centred
    Gram matrix differ by a translation and an orthogonal map (CLAIM-290;
    THEORY-004). So for b > 0, readouts cannot tell two centred
    representations apart exactly when one is an orthogonal transformation
    of the other. For the CCA member (a = 1, b = 0), K_X = UUᵀ is the
    projection onto the column space, so K_X fixes X only up to an
    invertible linear map Y = XA (both of full column rank, the same
    column space). That is THEORY-723's and THEORY-018's situation for a
    softmax layer.
  excluded: >-
    CLAIM-269's clauses grounded on THEORY-002 and THEORY-019, both still
    Proposed: that converging kernels fix a representation "up to the
    symmetry group of what is observed", and that spectral degeneracy does
    not identify the symmetry. THEORY-723, split from THEORY-002 in #185,
    holds the softmax identifiability results, not the symmetry-of-data
    clause, so it cannot replace THEORY-002 there. Also the gloss that any
    further distinction is "supplied by the analyst".
