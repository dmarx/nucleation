# Publish the record as a browsable site on GitHub Pages (LU-ADR-042).
#
# `luria site` stages every page the record publishes — the decisions, the
# principles document, the devlog books, the reports — with paths preserved,
# so the relative links `luria link --fix` already wrote keep resolving. The
# composite action builds that vault with a pinned Quartz, which gives the
# citations a graph and backlinks without anyone maintaining either.
#
# The site is built from the committed views, so it builds after the job
# that commits them: `workflow_run` fires when the Docs workflow completes on
# the default branch, by which time its generation job has pushed the
# regenerated views, and the checkout is the head of the default branch. A
# pull request builds nothing — a branch carries no views of its own
# (LU-ADR-068). If you rename the Docs workflow, rename it here too.
#
# Before the first deploy succeeds, set Settings → Pages → Source to
# "GitHub Actions". That is a repository setting; no file in the repository
# can turn it on, and until it is on the `deploy` job fails with "Pages is
# not enabled" while `build` stays green.
#
# At most one deploy every two hours (the decision on the Pages cadence of
# 2026-11-07, in record/decisions.d): the build takes long,
# and merges come in runs. A merge still triggers this workflow, but the
# `gate` job skips the build when the last deploy to the `github-pages`
# environment is less than two hours old, or already published this commit.
# A scheduled run every two hours applies the same gate, so a skipped merge
# is published by the next one, at most about two hours late. A manual run
# (workflow_dispatch) always builds.
#
# Delete this file if you would rather not publish. Nothing else depends on
# it — `luria site` is a build step, and the record it reads is the record
# every other command reads.
name: Pages

on:
  workflow_run:
    workflows: [Docs]
    types: [completed]
    branches: [main]
  # Catches up merges the gate skipped. Off the hour, as scheduled runs
  # that start on the hour are the likeliest to be delayed.
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decides whether to build: always on a manual run; otherwise only if this
  # commit is not yet published and the last deploy is at least two hours
  # old. The last deploy is read from the `github-pages` environment's
  # deployments, which `deploy-pages` writes, so runs the gate skipped do
  # not count.
  gate:
    # A Docs run that failed has no regenerated views to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          MIN_INTERVAL: '7200'
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run: building."; echo build=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=1" \
            --jq '.[0] | [.sha, .created_at] | @tsv' 2>/dev/null || true)
          last_sha=$(cut -f1 <<< "$last"); last_at=$(cut -f2 <<< "$last")
          if [ -z "$last_sha" ] || [ -z "$last_at" ]; then
            echo "No earlier deploy found: building."; echo build=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$last_at" +%s) ))
          if [ "$last_sha" = "$SHA" ]; then
            echo "Commit $SHA is already published: skipping."; echo build=false >> "$GITHUB_OUTPUT"
          elif [ "$age" -lt "$MIN_INTERVAL" ]; then
            echo "Last deploy was ${age}s ago, under ${MIN_INTERVAL}s: skipping; the scheduled run will publish it."
            echo build=false >> "$GITHUB_OUTPUT"
          else
            echo "Last deploy was ${age}s ago: building."; echo build=true >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: site
        # Pin a released tag once you depend on this in anger.
        uses: dmarx/luria/actions/site@main
        with:
          pip-spec: luria==1.10.0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}

  # Separate from the build because it is the only job that needs to write.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
