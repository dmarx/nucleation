finding: >-
  Proposition 3 closes on the court agenda by the decisive-coalition
  argument. Conditional entailment over six minimally inconsistent sets
  makes all eight literals' winning-coalition families equal. One
  minimally inconsistent triple, {¬P, R, B}, stays consistent with two of
  its members negated ({P, ¬R, B}), which gives closure under
  intersection. A finite ultrafilter then has a single dictator. The
  uniform case (Proposition 2) follows as a corollary, because on this
  agenda a uniform rule must be self-dual and unanimous. The title's
  unconditioned "interconnected propositions" is false: the parity rule
  on {p, q, p↔q} is a counterexample. So the title is narrowed to the
  court agenda and the two conditions the proof uses.
recommendation: >-
  Promote THEORY-127, narrowed. Move the corporate-attitude extension
  (LIT-700) to a new QUESTION. Then let batch 021, or a later wave-4 pass,
  check CLAIM-030, -192 and -271 against the newly Active THEORY-127.
