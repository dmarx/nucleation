scope:
  accepted: >-
    The reading task is done in part. Gugelmann, Panagiotou and Peter
    (arXiv:1205.1470; LIT-tmp30ynx, NOTE-tmp79m4y) prove for the threshold
    model at curvature -1, alpha > 1/2: degree sequence a power law with
    exponent 2 alpha + 1 up to the maximum degree (Theorems 2.2-2.4; the
    large-distance approximation's error bounded by Lemmas 3.1-3.2), and
    average local clustering Theta(1) whp (Theorem 2.1). Candellero and
    Fountoulakis (arXiv:1309.0459; LIT-tmple1gv, NOTE-tmprov8v) prove for
    the global clustering coefficient C2 in the soft model, 0 < zeta/alpha
    < 2: for beta > 1 (T < 1), C2 -> positive constant if zeta/alpha < 1,
    -> 0 if 1 <= zeta/alpha < 2; for beta <= 1 (T >= 1), C2 -> 0
    (Theorem 1.2). The configuration-model limit is by inspection
    (x = r_i + r_j makes the link probability a function of the product of
    expected degrees).
  excluded: >-
    (1) Both readings are skims: theorem statements and method read,
    proofs followed only in outline, the batch 038 reason THEORY-270 was
    held. (2) No held source treats the average local clustering at
    0 < T < 1, the quantity the source simulates; the global coefficient
    vanishes there for degree exponents in (2, 3]. (3) The degree law at
    T > 0 is attributed to a Fountoulakis paper the record does not hold.
