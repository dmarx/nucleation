scope:
  accepted: >-
    Re-grounding. CLAIM-148 is Active, granted and demonstrated, yet two of
    its grounds are Proposed and carry an inactive-ok directive. After #187
    and #177 the parts it uses are Active elsewhere. (1) Weight decay: the
    claim cites THEORY-180 for "the minimum of (‖U‖²_F + ‖V‖²_F)/2 over
    UVᵀ = M is ‖M‖_*". THEORY-726, split from THEORY-180, holds exactly
    that, with the balanced SVD factorization attaining it. THEORY-180 keeps
    only the replica/AMP spectral law, which the claim does not use. (2)
    THEORY-017's point, that the parts are fixed by structure supplied from
    outside: its proved core, that no orthonormal basis or tensor
    factorisation is distinguished by a complex Hilbert space alone, is
    THEORY-721. THEORY-017 keeps the synthesis across works, which the
    claim uses only as an analogy ("THEORY-017's point in a new place").
    The claim's further step, that the minimizers are exactly the balanced
    factorizations up to an orthogonal R, is the claim's own and was
    re-checked for this review. At a minimizer, f(UA, VA⁻ᵀ) ≥ f(U, V) for
    every invertible A. The first variation at A = I + tS is
    tr(UᵀU S) − tr(VᵀV S) for every S, so UᵀU = VᵀV =: B. Then
    MMᵀ = UVᵀVUᵀ = UBUᵀ = (UUᵀ)², so UUᵀ = (MMᵀ)^½ = U_M Σ U_Mᵀ and
    U = U_M Σ^½ R for a matrix R with orthonormal rows; likewise V, and
    UVᵀ = M ties the two R's together. The value of the latent Gram,
    V_M Σ V_Mᵀ, follows.
  excluded: >-
    Nothing in the claim changes. The re-grounding is evidence hygiene: it
    replaces Proposed grounds with the Active entries that hold the parts
    used.
