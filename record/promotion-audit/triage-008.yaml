    new_title: On the court agenda, and on any agenda in which every proposition reaches every other by
      conditional entailment and some minimally inconsistent triple stays consistent with two of its members
      negated, a group whose judgments are robustly rational under universal domain and respect unanimity
      cannot form its judgment on each proposition from its members' judgments on that proposition alone
