scope:
  accepted: >-
    Ziyin's Theorem 1, parts 1 and 4, and the corollaries for rescaling,
    rotation and permutation, re-derived here (ADR-047 v2); the paper's
    Appendix C proofs were not checked (NOTE-716), so this derivation
    stands on its own.

    Setting. O has orthonormal columns (OᵀO = I), R = I − 2OOᵀ, and each
    per-sample loss satisfies ℓ₀(θ) = ℓ₀(Rθ). R is symmetric and
    orthogonal.

    (1) Invariance. Differentiating ℓ₀(θ) = ℓ₀(Rθ) gives
    ∇ℓ₀(θ) = R∇ℓ₀(Rθ). On the subspace Oᵀθ = 0, Rθ = θ, so g = Rg for
    g = ∇ℓ₀(θ), and Oᵀg = OᵀRg = Oᵀg − 2Oᵀg = −Oᵀg, hence Oᵀg = 0. The
    weight-decay gradient 2γθ also has Oᵀ(2γθ) = 0. So every per-sample
    gradient step, and so every GD or SGD step, maps the subspace into
    itself: once reached, it is never left.

    (2) Weight decay above a threshold. Write θ = θ⊥ + Oz with Oᵀθ⊥ = 0 and
    z = Oᵀθ, and f(z) = ℓ₀(θ⊥ + Oz). Then R(θ⊥ + Oz) = θ⊥ − Oz, so f is
    even and its gradient at z = 0 vanishes. Under NOTE-716's Assumption 1,
    the Hessian of ℓ₀ is bounded below, ∇²ℓ₀ ⪰ −cI, so along the segment
    from 0 to z, f(z) − f(0) ≥ −(c/2)‖z‖². The regularized loss
    L = ℓ₀ + γ‖θ‖² has ‖θ‖² = ‖θ⊥‖² + ‖z‖², so
    L(θ) − L(θ⊥) = f(z) − f(0) + γ‖z‖² ≥ (γ − c/2)‖z‖². For γ > c/2 the
    projection θ⊥ has strictly lower loss than any θ with z ≠ 0, so every
    minimum of L satisfies Oᵀθ = 0 (part 4, with γ₁ = c/2).

    (3) Which symmetries contain a mirror. A rescaling symmetry
    ℓ₀(u, w) = ℓ₀(λu, w/λ) that holds for λ = −1 contains the mirror
    (u, w) ↦ (−u, −w), whose subspace is u = w = 0: zeroed weights. A
    rotation symmetry ℓ₀(W) = ℓ₀(QW) for every orthogonal Q contains every
    reflection I − 2ooᵀ, whose subspace oᵀW = 0 lowers the rank by one. A
    permutation symmetry contains the swap of two neurons, the reflection
    across θ_a − θ_b, whose subspace θ_a = θ_b is two identical neurons.
  excluded: >-
    "Strong gradient noise makes that subspace favoured". The SGD result
    is a Lyapunov-exponent argument after a second-order expansion and a
    diagonal approximation of the sample Hessian, which the paper calls
    "qualitatively correct" (NOTE-716). Also excluded: "every" rescaling
    symmetry. For ReLU networks the rescaling holds only for λ > 0, which
    contains no mirror, so the sparsity corollary needs λ = −1. And the
    network evidence (Fig. 3, the ResNet18 and transformer runs), whose
    details in Appendix B were not checked.
