  accepted: Nothing.
  excluded: >-
    The whole title, for the reason batch 041 gave: "so quantum ontology
    opens no causal gap" needs P7, and P7 is asserted, not argued. There is
    one change. Chalmers and McQueen (LIT-tmp0wmvt, NOTE-tmpoa1mw, read in
    part) are represented accurately by LIT-164. Theirs is a mind-modified
    collapse law: new dynamics, a rival hypothesis that is explicit and
    testable. But they argue explicitly that collapse is a gap in causal
    closure. Whether their law counts as fundamental physics is the
    criterion-of-the-physical problem the title's last clause already
    names. So the sorting holds for this account, with that caveat. It is
    also the clearest statement of the rival the "no causal gap" clause has
    to answer.
