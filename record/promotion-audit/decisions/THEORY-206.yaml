scope:
  accepted: >-
    The Taylor-sense statement, which the body already states and NOTE-693
    checked (C2, "strong, bias-free networks only"). For bias-free networks
    of smooth σ with nonzero Taylor coefficients up to degree d = Σ rᵢ:
    matching x₁^r₁⋯xₙ^rₙ's degree-d Taylor polynomial at 0 with one hidden
    layer needs exactly ∏(rᵢ+1) neurons, and a deep network needs at most
    Σ(7⌈log₂ rᵢ⌉ + 4). The upper bounds also hold for uniform approximation
    on a box (Proposition 3.3). The bounded-degree edge (c monomials cost
    at most c·2ᵈ in one layer, for any n) is also part of it.
    The lower bound was re-derived for this review. Suppose the rows a_j^S
    over sub-multisets S were dependent: q(a) = Σ λ_S a^S = 0 at every
    a_j. Let K be the largest |S| with λ_S ≠ 0, and f_e the degree-e
    homogeneous part of f = Σ w_j σ(a_j·x). Then
    g = Σ_S μ_S ∂^S f_(d−K+|S|), with
    μ_S = λ_S (d−K)! / (σ_(d−K+|S|) (d−K+|S|)!), equals
    Σ_j w_j q(a_j)(a_j·x)^(d−K) = 0. But Taylor matching gives f_e = 0 for
    e < d and f_d = x^r, so g = Σ_(|S|=K) μ_S ∂^S x^r. That is a combination
    of distinct monomials x^(r−S) with nonzero coefficients, so g ≠ 0, a
    contradiction. So the ∏(rᵢ+1) rows are independent, and m ≥ ∏(rᵢ+1).
    This uses σ_e ≠ 0 for d − K ≤ e ≤ d only.
  excluded: >-
    The title's "to approximate", read as uniform approximation. Theorem
    4.1's lower bound assumes that uniform closeness forces the Taylor
    coefficients close. That fails: ε·tanh(x/ε²) is within ε of 0 with
    first coefficient 1/ε (NOTE-693 C3, "weak as proved"). Also excluded:
    what replaces the bound with hidden-layer biases. Both are the
    promote_when's open half and go to a QUESTION.
