follow_up_prs:
  - "THEORY-324: narrow-and-promote under ADR-047 v2. Retitle so the parameters change 'whenever, and as long as' an essential variable is outside its limits. Add the re-derivation as a dated note. Move the promote_when's wider 'any system' scope to a new QUESTION. Trim the inactive-ok entries naming THEORY-324."
notes_for_ledger:
  - >-
    Wave 3's source route, first five: 1 of 5, and that one (THEORY-324,
    Ashby) was a theorem in prose. Triage-005's formal flag missed it.
    Flag prose deductions ("only if", "necessary and sufficient", "every
    equilibrium is") as formal.
  - >-
    A trigger condition in a sufficiency theorem. "Changes the parameters
    when the variables leave their limits" is ambiguous between a jump on
    crossing and a change for as long as they stay outside. Only the
    second makes every equilibrium adapted. A jump on crossing can land in
    a field with an unadapted equilibrium and stay there. Check
    "when ... leaves" wording in any feedback or homeostasis title.
  - >-
    The depth score reads a full reading of a secondary source as full
    depth (THEORY-560, a narrative review; THEORY-411, an encyclopedia
    entry). ADR-047 v3 needs the study itself. Treat results a review
    reports as cited, not read.
  - >-
    Necessity relative to a rule. Ashby's "only if" holds for systems that
    follow the trial-and-error rule, and becomes nearly definitional
    once the rule is assumed. A fixed regulator stable across the whole
    environment class needs no channel. When a promote_when widens an
    "only if" to "any system that achieves X", look for a regulator that
    achieves X without searching.
