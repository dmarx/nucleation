scope:
  accepted: >-
    What holds, re-derived here (ADR-047 v2) from the paper's own setup
    (LIT-859, App. A; arXiv 2504.12916v2 was retrieved for this review,
    because NOTE-658 says the Wishart step "was followed as statements,
    not re-derived").

    Setup. In the eigenbasis, the reduced predictor is ŷ = PΛŜQx̄, with P
    and Q diagonal (the alignment assumption) and Λ diagonal with
    independent N(0, 1) entries (the tasks). The empirical covariance is
    Ŝ = (1/N)Σ_i x̄_i x̄_iᵀ with x̄_i ~ N(0, S), and the query is x̄ ~ N(0, S).
    The task-averaged loss is
    L = E tr[(PΛŜQ − Λ) S (PΛŜQ − Λ)ᵀ]. Since E[λ_α λ_β] = δ_αβ, only
    diagonal entries survive the average over tasks, and
    L = Σ_α { p_α² E[(Ŝ A Ŝ)_αα] − 2 p_α q_α s_α² + s_α }, with A = QSQ,
    so a_β = q_β² s_β.

    The Wishart moment. For Gaussian x̄, E[x̄_α (x̄ᵀAx̄) x̄_α] =
    2a_α s_α² + s_α Σ_β a_β s_β. Summing over the i = j and i ≠ j terms
    gives E[(ŜAŜ)_αα] = ((N+1)/N) a_α s_α² + (s_α/N) Σ_β a_β s_β. So
    L = Σ_α { ((N+1)/N) p_α² q_α² s_α³ + (1/N) p_α² s_α Σ_β q_β² s_β²
              − 2 p_α q_α s_α² + s_α }.

    (a) The infinite-context limit, N → ∞. Then
    L = Σ_α s_α (p_α q_α s_α − 1)². Gradient flow at rate ηP gives
    τ_α dp_α/dt = q_α(1 − p_α q_α s_α), and the same with p and q exchanged,
    with τ_α = (ηP s_α²)⁻¹. Each p_α² − q_α² is conserved, since
    d(p² − q²)/dt ∝ pq(1 − pqs) − qp(1 − pqs) = 0. From a balanced start,
    a_α = p_α q_α obeys τ_α da_α/dt = (p_α² + q_α²)(1 − a_α s_α)
    = 2a_α(1 − a_α s_α), which is logistic to a_α = 1/s_α. So each mode is
    learned on a logistic curve with timescale proportional to s_α⁻², the
    learning is staged by the input spectrum, and the fixed point is
    ŷ = WŜS⁻¹x_q, which tends to Wx_q.

    (b) Finite N, isotropic inputs, balanced and equal modes (S = sI,
    p_α = p, q_α = q for every α). Then Σ_β q_β² s_β² = d q² s², and the
    coupling term reduces to the paper's form: τ dp/dt = q(1 − pq s^∞), with
    s^∞ = ((N+1)s + Tr S)/N. The paper's fixed point ŷ = WŜ[((N+1)/N)S +
    (Tr S/N)I]⁻¹x_q holds in this case, and it is preconditioned only by a
    scalar.
  excluded: >-
    The finite-N decoupling for general S, which the title and body state
    as exact within the assumptions. At finite N the 1/N term
    (1/N)(Σ_α p_α² s_α)(Σ_β q_β² s_β²) couples the modes. Each mode's flow
    is τ_α dp_α/dt = q_α − p_α(((N+1)/N) s_α q_α² + (1/N) Σ_β q_β² s_β²/s_α),
    not q_α(1 − p_α q_α s^∞_α). The two agree only when q_β² s_β is the same
    for every mode. The paper's error is at (A71) and (A73): "since Ŝ and
    q̄1 are diagonal matrices and commute" and "all matrices in the
    expression are diagonal". Ŝ is the rotated empirical covariance. It is
    not diagonal at finite N, and x̄_q x̄_qᵀ is rank one, so the commutation
    turns E[ŜAŜ] into E[Ŝ²]A, which replaces Σ_β a_β s_β with a_α Tr S. It
    is also inconsistent: Ŝ is treated as diagonal, which is exact only as
    N → ∞, yet the Wishart moment's 1/N correction is kept. Consequences:
    per-mode conservation of p_α² − q_α² fails at finite N. The global
    ‖p₂‖² − ‖q₁‖² is still conserved, since L is invariant under P → cP,
    Q → Q/c, and that is NOTE-658's C4 as written. Per-mode logistic curves
    and the s^∞_α of Eq. 11 are approximations at finite N for anisotropic
    S, and nothing in the paper bounds the error. The agreement with Ahn et
    al. and Zhang, Frei & Bartlett is with analyses whose task vectors are
    isotropic, where the Tr S term does arise. Also excluded, unchanged:
    whether misaligned weights align. The promote_when tests this, but the
    title assumes alignment, so the promote_when is mis-targeted (NOTES,
    batch 010). Excluded too: anything about softmax or deep transformers.
