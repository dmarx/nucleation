  The classifier called it a theorem on "theorem_title", "cites",
  "shown_thm" and "derived". The title's colon-separated
  "relations give them identity conditions wherever..." reads like a
  stated result, but it is a metaphysical position. This is a false
  positive of the kind NOTES expects (an argument shaped like a theorem).
  It is not a prevalence-style possibility thesis (the 2026-10-19 owner
  rule): the defeater it names is conceptual (primitive diversity is
  thisness), not a rate.
