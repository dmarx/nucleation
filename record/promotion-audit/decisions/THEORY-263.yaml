scope:
  accepted: >-
    Both clauses. NOTE-806 read every proof in Appendix E and followed them
    step by step (C1 strong: Theorem 1 proved). The promote_when's first job
    was a check that the information-density rate meets the coding condition
    at zero distortion, which the paper proves only for finite alphabets
    (Theorem 2). The second clause is re-derived here directly, in general
    spaces, by the disintegrated change of measure (ADR-047 v2).

    Setting. S = (Z_1..Z_n) iid, W ~ P_{W|S}, loss ℓ(w, Z) σ-subgaussian for
    each fixed w, gen(S, w) = E ℓ(w, Z) − (1/n) Σ ℓ(w, Z_i); P a prior not
    depending on S.
      (a) For fixed w, gen(S, w) is the mean of n iid centred σ-subgaussian
          terms, so it is σ/√n-subgaussian: E_S e^{t·gen} ≤ e^{t²σ²/(2n)}.
      (b) For X that is τ-subgaussian and 0 ≤ c < 1/(2τ²),
          E e^{cX²} ≤ (1 − 2cτ²)^{−1/2}. Proof: e^{cx²} = E_G e^{√(2c)Gx}
          with G ~ N(0, 1); swap expectations and apply the subgaussian bound,
          E_G e^{cτ²G²} = (1 − 2cτ²)^{−1/2}.
      (c) Take F(S, w) = (2n − 1)·gen(S, w)²/(4σ²), so c = (2n − 1)/(4σ²),
          τ² = σ²/n, 2cτ² = (2n − 1)/(2n) < 1. By (b),
          E_S e^{F(S, w)} ≤ (1/(2n))^{−1/2} = √(2n) for every w, hence
          ξ := E_{W~P} E_S e^{F(S, W)} ≤ √(2n), using that P does not depend
          on S (Fubini).
      (d) Disintegrated change of measure (Rivasplata et al., Thm 1.ii, as
          LIT-233 eq. 29 recovers it): with R_{S,W} = log (dP_{W|S}/dP)(W),
          E_S E_{W~P_{W|S}} e^{F(S,W) − R_{S,W}} ≤ E_S E_{W~P} e^{F(S,W)} = ξ
          (requires P_{W|S} ≪ P; equality when they share support). Markov's
          inequality: with probability ≥ 1 − δ over (S, W),
          F(S, W) ≤ R_{S,W} + log(ξ/δ) ≤ R_{S,W} + log(√(2n)/δ).
      (e) Rearranged: gen(S, W)² ≤ 4σ²(R_{S,W} + log(√(2n)/δ))/(2n − 1),
          which is Theorem 1's bound at ε = 0 with this rate.
    So with the rate set to the pointwise information density against a
    fixed prior, Theorem 1's bound holds with no coding argument and in any
    measurable space; it is the disintegrated PAC-Bayes bound. The first
    clause (a rate depending on the realised S and W gives a bound computable
    at that realisation) is Theorem 1 itself, and (e) is an instance of it.
  excluded: >-
    The promote_when's second job, a second source deriving a PAC-Bayes bound
    from a variable-rate covering outside finite alphabets. The title does not
    say compression is the mechanism outside finite alphabets, and the body
    disclaims it; (d) shows the bound needs no covering at all there. That
    question moves to a new QUESTION.
