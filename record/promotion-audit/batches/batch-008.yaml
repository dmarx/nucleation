finding: >-
  ADR-047 v2 was applied for the first time, with a re-derivation attempted
  on each candidate. It worked where the proof was short and self-contained:
  THEORY-160's bracket equivalence, THEORY-158's finite-state cycle, and
  Basu's theorem in a Markov category. It failed on the one candidate whose
  proof rests on a non-trivial construction, THEORY-277's Lemma C.4. That
  failure is informative. The re-derivation got further than the reading
  had recorded, and it found the step NOTE-787 passes over: the incomplete
  final block of an enumerable set. So the rule does not make every
  promotion cheap. A long or delicate proof still needs its source, and the
  decision then says which step. Separately, THEORY-171's promote_when asked
  for the characterisation when the title claims only existence. That is
  the bundling pattern again, and narrowing fixes it without any
  re-derivation.
