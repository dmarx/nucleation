scope:
  accepted: >-
    Theorem 3.4 (common-nonsense upper bound), re-derived here from
    arXiv:2211.11081v2 App. C.1, given Theorem A.2 (re-derived in batch
    038). Setting: finite Y, T ⊆ P ⊆ Y, S ⊆ Y keeping each y independently
    with probability β = 1 − α, τ = U(T ∩ S), ρ = U(P ∩ S), translators
    f_θ one-to-one, π_θ = f_θ∘f⋆⁻¹ extended to a permutation of Y.
    ε_γ is the largest error among θ with Pr_τ[ρ(π_θ(y)) = 0] ≤ γ.
      (a) Proposition C.2. The non-fixed points of a permutation split
          into A1, A2, A3 with π(A_i) ∩ A_i = ∅: alternate each cycle's
          elements between A1 and A2 and, for an odd cycle, put its last
          element in A3. Checked on both cycle parities.
      (b) Lemma C.1, for γ ≥ (8/(β|T|)) ln(4|Θ|/δ) and γ ≤ 1/6 (above 1/6
          the claim ε_γ ≤ 6γ/α is trivial). Put a = 6γ/α. Since ρ(π(y)) = 0
          whenever π(y) ∉ S, it suffices that no θ has error > a and
          Pr_τ[π_θ(y) ∉ S] ≤ γ. (i) Chernoff: P[|T ∩ S| ≤ β|T|/2] ≤
          e^{−β|T|/8} < δ/4, using the bound on γ. (ii) Fix π and replace
          each A_i by A_i ∩ T (needed, since τ lives on T; the paper's
          τ(A_i) = |A_i ∩ S|/|T̃| silently assumes A_i ⊆ T). Error > a puts
          τ(A_i) > a/3 for some i. (iii) Condition on V = A_i ∩ T ∩ S. If
          |V| < βa|T|/6 the event is empty given (i). Otherwise
          Pr_τ[π(y) ∉ S] ≥ τ(V)·Pr_{y∈V}[π(y) ∉ S] > (a/3)·Pr_{y∈V}[…], so
          the event forces Pr_{y∈V}[π(y) ∉ S] < 3γ/a = α/2. (iv) The
          indicators 1[π(y) ∉ S], y ∈ V, are independent Bernoulli(α) even
          given A_i ∩ S, because π is one-to-one and π(A_i) ∩ A_i = ∅. So
          Chernoff gives probability ≤ e^{−α|V|/8} ≤ e^{−βγ|T|/8} ≤
          δ/(4|Θ|). (v) Union over i ≤ 3 and over θ ∈ Θ, plus (i): total ≤ δ.
      (c) Theorem 3.4. Take γ = max(1/m, 8/(β|T|))·ln(6|Θ|/δ). Lemma C.1 at
          confidence 2δ/3 gives ε_γ ≤ 6γ/α; realisability holds because
          T ⊆ P; Theorem A.2 at confidence δ/3 needs m ≥ (1/γ) ln(3|Θ|/δ),
          which holds. So with probability ≥ 1 − δ, err(θ̂) ≤
          (6/α)·max(1/m, 8/(β|T|))·ln(6|Θ|/δ) ≤ (6/α)·max(1/m, 16/|T|)·
          ln(6|Θ|/δ) for α ≤ 1/2, as stated.
  excluded: >-
    (1) The general form. The title said translation without parallel
    data "is learnable" with error falling in common ground and source
    size, unqualified; that is proved only inside the models. Narrowed to
    the common-nonsense model, where it now holds. (2) The knowledge-graph
    model (Theorem 3.2, App. D) and the matching lower bound (Theorem 3.5,
    App. C.2) were not re-derived. The narrowed title claims neither; the
    body keeps them as statements the paper proves. (3) Non-uniform or
    lossy settings, which the promote_when asks for, move to a new
    QUESTION.
