finding: >-
  A dependency pass after a run of splits is mostly evidence hygiene on
  entries that are already Active. Three of five candidates (CLAIM-107,
  -148, -164) were Active claims citing a THEORY whose status or scope a
  split had changed. The fix is to point the citation at the entry that now
  holds the part used, not to change any status. Only CLAIM-269 had a real
  promotion path, and that was batch 004's split, waiting on THEORY-008.
  THEORY-723 did not help: a split's new entry holds the parent's proved
  core, and the dependents often cite the parent for the other half
  (here THEORY-002's symmetry-of-observation clause).
recommendation: >-
  After each split PR merges, list the entries that ground on or cite the
  parent, and check which half each one uses. Do it in the split PR itself
  when the list is short; it saves a batch.
