scope:
  accepted: >-
    The conditional's first consequent re-derives from the antecedent,
    taking R reflexive and symmetric (as Lewis does) and I(s, s') to hold
    when some continuant person has both s and s' as stages.
    (1) I implies R: if s, s' lie in one person P, and P is by definition
    R-interrelated (every two of its stages are R-related), then R(s, s').
    (2) R implies I: if R(s, s'), the set {s, s'} is R-interrelated. The
    R-interrelated sets of stages are closed under unions of chains, since
    any two members of the union lie in a common member of the chain. So by
    Zorn's lemma {s, s'} lies in a maximal R-interrelated set, which is a
    person by the definition. So I(s, s'). Hence I = R.
    (3) Overlap in fission: let s0 be R-related to b1 and to b2, with b1
    and b2 not R-related. By (2), {s0, b1} and {s0, b2} lie in maximal
    aggregates P1 and P2. P1 is not P2, since b1 and b2 cannot lie in one
    R-interrelated set. So P1 and P2 share s0. When fission makes R
    non-transitive, the persons overlap.
    (4) Counting: since persons share stages, the number of persons
    exceeds the number of stages at a pre-fission time. A count of
    "persons at t" that gives one before fission therefore counts
    something other than persons by identity. This is Lewis's tensed
    identity, which "is not a kind of identity".
  excluded: >-
    The middle clause, "so Parfit's premises do not show that identity is
    not what matters", is Lewis's interpretive conclusion. It reads "what
    matters is identity" as "what matters is the I-relation among
    stages", and whether that reading is fair is the point at issue. The
    promote_when also asks for an argument for the definition of persons
    as maximal R-interrelated aggregates, which a derivation from the
    definition cannot supply. Note that (2) needs Zorn's lemma, or
    finiteness, for maximality. Lewis does not raise this, and it is
    harmless.
