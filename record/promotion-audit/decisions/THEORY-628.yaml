scope:
  accepted: Nothing.
  excluded: >-
    The whole title. It is a conceptual argument: that autopoiesis, as
    originally defined, entails only conservation (an all-or-nothing norm
    visible to an observer); that a graded norm the system itself has
    needs adaptivity; and that sense-making and agency need adaptivity.
    NOTE-719 read Di Paolo (2005) in full, and its claims table rates C1
    and C2 "moderate", supported by "a reading of the primary texts" and
    "conceptual argument (the bacterium, the cliff)". There is no formal
    model, and the viability set is defined in one sentence. Nothing in
    the source is a theorem or a measurement, so neither ADR-047 v2 nor v3
    applies.
evidence:
  - "NOTE-719 version 1: read in full, every quotation checked against the extracted text by script."
  - "NOTE-719 Limitations: 'Conceptual. There is no formal model; the only operational example is the Chemoton, in a note.' Tendency and 'sufficiently close' assume a metric and boundary the paper does not supply."
  - "C1 is a reading of autopoietic theory; Di Paolo concedes (note 1) that later formulations may contain adaptivity."
  - "Rival THEORY-666 (Weber and Varela, Proposed) holds that self-production suffices for sense-making; the entry says neither paper settles it."
blockers:
  - "The promote_when's worked case does not exist: no model or organism in which a merely self-producing system and an adaptive one are set side by side with the viability set and state space stated formally."
  - "An open rival (THEORY-666) disputes the central necessity claim."
notes: >-
  Title type: argument (conceptual analysis). Route: triage-005 sent it
  to source, its control sample's fifth and last member. The route
  predicted the outcome: triage-005's backtest found every source-route
  entry a non-yielder, and batch 020's sorting rule sends an argument to
  wave 5, where nothing has promoted except by the owner's call. A
  record-built toy model (a one-dimensional viability interval, one
  system drifting to the boundary, one with feedback below a threshold)
  would meet the letter of the promote_when but not its point: it would
  build regulation in by construction and make "differ for the system"
  true by definition, which the promote_when's own last sentence rules
  out for chosen illustrations. ADR-047 v2 covers re-derived proofs, not
  constructed cases, so the audit does not offer one. NOTE-719's open
  question (constraint set K or viability kernel, via THEORY-134) is the
  formal restatement that could make a real worked case possible.
