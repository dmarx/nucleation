  THEORY-195:
  - text: the sample complexity P* is where the class statistics of input patches rise above sampling
      noise (correlation detection as the cause)
    kind: 1
    who_asserts: LIT-877 (Cagnetta, Petrini, Tomasini, Favero and Wyart)
