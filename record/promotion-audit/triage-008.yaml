      Or a proof that gradient descent on a deep network learns the Random Hierarchy Model from a number
      of examples of order n_c m^L, polynomial in the input dimension. Further collapses of learning curves
      on n_c m^L at other parameter values cannot settle it, because the threshold and the grammar''s
      size are the same number there.'
