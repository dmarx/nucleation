notes: >-
  A counting argument ("equations against unknowns") becomes a proof with
  one move: show the equations are independent fibrewise, so the incidence
  set is a bundle of known dimension, then project. The same count's
  positive half ("solutions exist generically when the counts balance")
  does not follow over the reals. Real algebraic equations with as many
  unknowns as equations can lack solutions on an open set. Check every
  "generically exists" drawn from a count for that failure.
