  THEORY-211:
  - text: the noise-balance law holds for deep networks trained by SGD on real data
    kind: 1
    who_asserts: LIT-1012 (Ziyin et al.); LIT-1013
    existing_carrier: null
    suggested_title: In deep networks trained by SGD on real data, minibatch noise drives parameter groups
      related by a rescaling symmetry toward balance of their gradient noise, so trained networks sit
      away from where gradient flow would leave them, as Ziyin and coauthors propose
    suggested_promote_when: 'The law of balance measured in a deep network trained on real data, during
      its limiting dynamics. What would promote: for parameter groups related by a rescaling symmetry
      (adjacent layers through a ReLU, or the query and key matrices of attention), the difference of
      squared norms moving toward the value at which the groups'' gradient-noise traces are equal, at
      a rate that scales with learning rate over batch size, with weight decay adding to it. That should
      hold from more than one initialization. What would refute it: in such a network at stationarity,
      the difference staying at its initial value, as under gradient flow, or diffusing without a preferred
      value, as under isotropic noise. A failure of the SDE approximation at the learning rates used would
      limit it, not refute it. More solvable toy models cannot settle it.'
