evidence:
  - >-
    Checked for this review, as the promote_when's second option asks.
    The primal is feasible (b = 0) and bounded: each global assignment's
    column has exactly one 1 in each context, and v_e sums to 1 over a
    context, so 1·b ≤ 1. LP duality then gives strong duality, without
    needing the paper's proof. The dual P = {y ≥ 0 : Mᵀy ≥ 1} is nonempty:
    the indicator of one context's entries satisfies Mᵀy = 1. P lies in the
    orthant, so it contains no line and has finitely many vertices, and its
    recession cone is nonnegative. Since v_e ≥ 0, y·v_e does not decrease
    along a recession direction, so the minimum is attained at a vertex, and
    NCF(e) = min_k y_k·v_e. That function is concave and piecewise linear,
    so CF is convex, which agrees with Theorem 2. Lipschitz:
    |min_k a_k − min_k b_k| ≤ max_k |a_k − b_k|, and |y_k·Δv| ≤ ‖y_k‖₁‖Δv‖_∞.
  - "NOTE-236 read Theorem 1, Theorem 2 and the supplemental proofs."
  - "The CHSH line check (CF = 0 up to t = ½, then 2t − 1) is consistent, and is not needed for the proof."
