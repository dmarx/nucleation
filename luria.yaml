# Luria configuration for nucleation.
#
# Nucleation is the catchall companion to the Anthology of the SOTA
# (dmarx/anthology-of-the-sota): it holds reading whose subject no anthology
# topic can hold, so that "out of scope there" never means "unrecorded". The
# scheme definitions for LIT, NOTE and THEORY are ported from the anthology's
# own config, so a work can move between the two records without being
# re-shaped. What is dropped is the anthology's product — SOTA practices and
# their consensus vocabulary — because most of what lands here carries no
# instruction for anyone to follow. See ADR-001.
#
# The ANTH remote lets a document here cite one there: ANTH-LIT-123,
# ANTH-THEORY-45. Codes are not shared across the two records; the prefix is
# what keeps LIT-001 here from being LIT-001 there.
vocabularies:
  topics:
    label: Topics
    blurb: 'What a work is about. Nucleation holds what the Anthology of the SOTA does not: reading whose
      subject no anthology topic can hold. The words are seeded from the clusters the reading-time triage
      of 2026-09-25 found, and grow by decision.'
    alert: Closed so that every tag is one somebody chose and blurbed, not because the list is finished.
      If a work wants a word this list lacks, add it with a label, a blurb and a decision. If a work fits
      an anthology topic, it belongs in the anthology, not here.
    terms:
      quantum-foundations:
        label: Quantum foundations
        blurb: what quantum theory says about the world — contextuality, epistemic restrictions, interference,
          reconstructions and toy theories, quantum thermodynamics
      contextuality:
        label: Contextuality
        blurb: 'whether outcomes can be explained without reference to the context of measurement — Kochen–Specker and Bell contextuality and their sheaf-theoretic form, generalized (Spekkens) contextuality, noncontextual models and their limits, and contextuality outside physics'
      mathematics:
        label: Mathematics
        blurb: mathematics read for itself — category theory, topoi and sheaves, spectral geometry, set
          and measure theory — including mathematical frameworks applied to other fields
      game-theory:
        label: Game theory
        blurb: 'strategic interaction and its equilibria — evolutionary stability, repeated games, bargaining, coordination, signalling and conventions — in biology, economics and philosophy (ADR-019)'
      network-science:
        label: Network science
        blurb: the structure and dynamics of networks — dimension, curvature and Ricci flow, community
          detection, consensus and synchronization
      complex-systems:
        label: Complex systems
        blurb: emergence, information decomposition, individuality, self-organization — how collective
          behaviour arises from parts
      probabilistic-modeling:
        label: Probabilistic modeling
        blurb: Bayesian inference and statistical models outside deep learning — nonparametric priors,
          topic models, samplers
      neuroscience:
        label: Neuroscience
        blurb: brains and nervous systems — representation, coding and dynamics measured in biological
          tissue
      natural-sciences:
        label: Natural sciences
        blurb: physics, astronomy, planetary and earth science, chemistry, biology and medicine read outside
          any machine-learning claim
      ecology:
        label: Ecology
        blurb: 'how organisms interact with each other and their environment — symbiosis and host–microbe partnerships, competition, herbivory and trophic interactions, community structure, resilience and regime shifts in ecosystems (ADR-028)'
      thermodynamics:
        label: Thermodynamics
        blurb: 'the second law and its extensions read for themselves — entropy and entropy production, irreversibility, nonequilibrium steady states and their stability, dissipative structures, fluctuation theorems and stochastic thermodynamics, and the thermodynamics of computation and of life (ADR-020)'
      operations-research:
        label: Operations research
        blurb: optimization of real systems — routing, scheduling, facility location, combinatorial algorithms
      society-and-governance:
        label: Society and governance
        blurb: law, politics, policy, security and institutions — court records, doctrine, democratic
          theory, information operations
      information-theory:
        label: Information theory
        blurb: 'entropy, channels, coding and capacity read for themselves — including information-theoretic accounts of work, memory and inference outside machine learning'
      representation-learning:
        label: Representation learning
        blurb: 'how learned systems come to represent their data — self-supervised and contrastive objectives, spectral embeddings, information bottlenecks, knowledge-graph embeddings, and whether representations converge'
      learning-theory:
        label: Learning theory
        blurb: 'why learning generalizes — compression and description length, Kolmogorov complexity and sufficient statistics, rate–distortion and PAC-style bounds, model selection'
      information-retrieval:
        label: Information retrieval
        blurb: 'finding what is relevant to a need — document and query representation, relevance and aboutness, ranking and feedback, and the geometric, probabilistic and logical models of retrieval'
      design-rationale:
        label: Design rationale
        blurb: 'recording the reasoning behind a design or decision as it is made — issues, positions and arguments, options and criteria (IBIS, gIBIS, QOC and their successors) — and why such capture systems are or are not used: who bears the cost of capture and who gets the benefit, premature formalization, cognitive overhead, and the groupware adoption problems behind them (ADR-030)'
      social-science:
        label: Social science
        blurb: 'economics, psychology, anthropology and sociology — empirical and theoretical work on people and societies that is not law or policy'
      linguistics:
        label: Linguistics
        blurb: 'the study of language itself — morphology, lexicalism, word segmentation, syntax and semantics as linguists pose them, not as models encode them'
      metaphysics:
        label: Metaphysics
        blurb: 'what exists and what it is to exist — causation, emergence and levels, laws, time — as a philosophical question (group: philosophy)'
      mereology:
        label: Mereology
        blurb: 'parts and wholes — composition, individuation of systems and collectives (group: philosophy)'
      agency:
        label: Agency
        blurb: 'what it is to be an agent — goals, action, control and the capacity to act — in organisms, collectives or machines. An agent is not thereby an individual, a self or a person (ADR-024); how an agent''s behaviour is integrated is behavioral-integration, and governing oneself by one''s own standards is self-governance (group: philosophy)'
      individuation:
        label: Individuation
        blurb: 'what makes something one thing, and the same thing over time or across descriptions — individuation, numerical identity and diversity, individuality and persistence of things of any kind, biological individuality and organisational closure. Selves are self and persons are personhood (group: philosophy; ADR-015, ADR-024)'
      self:
        label: Self
        blurb: 'what a self is — the minimal, bodily and pre-reflective self, self-models and the sense of being a subject, the self as process or as context, and whether machines or groups can be selves. Not the person, which is personhood (group: philosophy; ADR-024)'
      personhood:
        label: Personhood
        blurb: 'what a person is and what makes one persist — personal identity over time, psychological continuity and what matters in survival, persons as bearers of reasons, rights and responsibility. Not the self, which is self (group: philosophy; ADR-024)'
      behavioral-integration:
        label: Behavioral integration
        blurb: 'how an organism''s many control systems come to act as one — action selection and competition between systems (habitual and goal-directed, automatic and willed), hierarchical and feedback control, intertemporal conflict and self-control, and evidence accumulation to a decision. One of four unities kept apart (ADR-024)'
      phenomenal-unity:
        label: Phenomenal unity
        blurb: 'the unity of experience — what makes simultaneous experiences one subject''s, and how a self-model or a perspective binds them. One of four unities kept apart (group: philosophy; ADR-024)'
      narrative-unity:
        label: Narrative unity
        blurb: 'the unity a life has as a story — narrative identity, the narrative self, autobiographical reasoning, and the claim and counter-claim that a self is the story told of it. One of four unities kept apart (group: philosophy; ADR-024)'
      self-governance:
        label: Self-governance
        blurb: 'governing oneself by standards that are one''s own — identification and wholeheartedness, planning agency and policies, self-constitution, autonomy and authenticity, and the empirical psychology of self-endorsed motives. One of four unities kept apart (group: philosophy; ADR-024)'
      phenomenology:
        label: Phenomenology
        blurb: 'the first-person description of experience as a method — the philosophical tradition (Husserl, Heidegger, Merleau-Ponty), its use in the sciences of mind, and the theories that take their data from it (group: philosophy; ADR-016)'
      social-ontology:
        label: Social ontology
        blurb: 'what social facts, groups, institutions and social kinds are, and what makes them exist — collective intentionality, joint commitment, status functions, convention, social construction, and whether groups can be agents or minds (group: philosophy; ADR-017)'
      moral-psychology:
        label: Moral psychology
        blurb: 'morality as a natural phenomenon — moral judgement, emotion and norms, and their evolution, development and variation across cultures; descriptive, where ethics is normative (group: philosophy; ADR-018)'
      psychopathology-and-treatment:
        label: Psychopathology and treatment
        blurb: 'what a mental disorder is and how psychological treatment changes it — medical models of illness (biomedical, biopsychosocial, network), the philosophy of psychiatry, functional and transdiagnostic accounts of psychopathology such as experiential avoidance and psychological flexibility, and psychotherapies and their mechanisms of change (ADR-021)'
      motivation:
        label: Motivation
        blurb: 'why organisms act and persist — intrinsic and extrinsic motivation, needs, goals and values, the internalization of regulation, and the difference between autonomous and controlled motives; the empirical counterpart of the philosophy of autonomy under `agency` (ADR-023)'
      well-being:
        label: Well-being
        blurb: 'how well a life goes for the one living it, as psychology measures it — subjective and eudaimonic well-being, flourishing, vitality and meaning in life, and what predicts them (ADR-025)'
      learning-and-conditioning:
        label: Learning and conditioning
        blurb: 'how organisms learn from contingencies and consequences — Pavlovian and instrumental conditioning, reinforcement and reward learning in brains, habit and goal-directed control, behaviour analysis and relational responding. Not machine learning, which is learning-theory or the anthology (ADR-025)'
      psychometrics:
        label: Psychometrics
        blurb: 'measuring minds — scales, reliability and validity, latent-variable and network models of psychological constructs, and model-based estimation of cognitive parameters (ADR-025)'
      philosophy-of-biology:
        label: Philosophy of biology
        blurb: 'what life, organisms and biological functions are — teleology and function, organisation and closure, biological individuality and autonomy, and the demarcation of the living (group: philosophy; ADR-025)'
      embodied-cognition:
        label: Embodied cognition
        blurb: 'cognition as embodied, embedded, enacted or extended — enactivism and sense-making, coordination dynamics, situated robotics, and mind as organism–environment coupling (group: philosophy; ADR-025)'
      free-will:
        label: Free will
        blurb: 'free will and volition, as philosophy and as science — compatibilism and its rivals, manipulation and responsibility, and the neuroscience of voluntary action such as the readiness potential (group: philosophy; ADR-025)'
      model-comparison:
        label: Model comparison
        blurb: 'choosing between models by their evidence — the marginal likelihood and Bayes factors, the Savage–Dickey density ratio for nested models, Occam factors and the evidence framework, Bayesian model reduction and structure learning, and information criteria and free energies for singular models (ADR-026)'
      information-geometry:
        label: Information geometry
        blurb: 'the geometry of statistical models — the Fisher information as a metric, natural gradient, curvature and its Kronecker and block structure, and the spectra of Fisher and Hessian matrices in learned models (ADR-026)'
      loss-landscapes:
        label: Loss landscapes
        blurb: 'the geometry of trained solutions in weight space — mode connectivity, linear and along curves, barriers between minima and the permutation symmetries that hide or remove them, re-basin alignment, star domains and connecting simplexes, local versus global landscape structure, and model merging as its use (ADR-027)'
      ethics:
        label: Ethics
        blurb: 'moral philosophy — what is owed, permitted or good — including applied ethics of technology and institutions (group: philosophy)'
      consciousness:
        label: Consciousness
        blurb: 'experience and its theories — phenomenal consciousness, its measures and its attribution to animals or machines (group: philosophy)'
      cognition:
        label: Cognition
        blurb: 'the mind as information processing — perception, memory, reasoning and cognitive strategies — as studied by cognitive science and philosophy of mind (group: philosophy)'
      emotion-and-affect:
        label: Emotion and affect
        blurb: 'emotions, feelings and affect — what they are, their bodily and neural basis (including the homeostatic and interoceptive states feelings are said to report), their role in decision, memory and behaviour, and whether they ground consciousness (group: philosophy; ADR-014)'
      philosophy-of-science:
        label: Philosophy of science
        blurb: 'what science is and what its theories say about the world — realism and structural realism, explanation, causation and evidence, the interpretation of physical theories (group: philosophy)'
      epistemology:
        label: Epistemology
        blurb: 'knowledge, belief and evidence — justification and rational credence, the value of knowledge, testimony, trust and expertise, and social and inductive-risk questions about evidence (group: philosophy)'
      logic:
        label: Logic
        blurb: 'valid inference and its formal theories — propositional and model-theoretic structures, proof and consequence, and inferentialist accounts of meaning (group: philosophy)'
      philosophy-of-mathematics:
        label: Philosophy of mathematics
        blurb: 'what mathematics is about and how we know it — mathematical structuralism and ontology, the nature of proof and construction, and its history from Descartes to Kant and after (group: philosophy)'
      philosophy-of-language:
        label: Philosophy of language
        blurb: 'meaning, content and reference as philosophy poses them — theories of meaning, meaning holism, assertion and whether machines assert, and conceptual change (group: philosophy)'
      religion:
        label: Religion
        blurb: 'religion as a subject — its relation to science, religious belief and practice, and how religious practitioners are treated'
      anthology-candidate:
        label: Anthology candidate
        blurb: 'a curation flag, not a subject — somebody judged this work may belong in the Anthology of the SOTA; it stays here until a transfer is decided, and is never a primary topic (ADR-005; group: flags)'
  lit-statuses:
    label: Paper statuses
    blurb: 'A work''s standing in this record: whether it is worth reading. Not whether its findings are
      true — that is the THEORY scheme''s business, and the two can disagree in either direction.'
    alert: Closed. If the word you want means "this work's account has been overturned", that is a status
      on a THEORY, not on the work.
    terms:
      Active:
        label: In the anthology
        blurb: worth reading, whether or not an account was drawn from it
      Proposed:
        label: Watching
        blurb: promising and unproven; the note says what would settle it
      Deferred:
        label: Unreviewed
        blurb: in the corpus, not yet read closely enough to place
      Superseded:
        label: Superseded
        blurb: later work covers this better, and the note names it
      Rejected:
        label: Attic
        blurb: retired with a reason — too narrow, too theoretical, or simply not interesting enough to
          carry
  note-statuses:
    label: Reading statuses
    blurb: 'How deeply the paper was READ — not whether it is any good, which is `lit-statuses`. The two
      disagree in every direction: a foundational paper can carry a `Skimmed` note, and a paper in the
      attic can carry a `Read` one, since reading it carefully is often how it got there (ADR-025).'
    alert: 'Closed, and the value you want may be no note at all. **The absence of a NOTE means the paper
      is unread** — a note is written when somebody finishes a paper, so a LIT with no NOTE already says
      "nobody has reached this", and filing two hundred `Unread` stubs would buy a row in a table. `Unread`
      is for the case absence cannot cover: a deliberate judgement that a paper was looked at and set
      aside.'
    terms:
      Read:
        label: Read
        blurb: the full text, closely enough to state its assumptions and results exactly — the only status
          that licenses a claims table
      Skimmed:
        label: Skimmed
        blurb: abstract, figures and selected sections; honest, useful, and explicitly not enough to source
          a practice from
      Unread:
        label: Unread
        blurb: looked at and deliberately set aside — a human judgement, not a backlog entry. A paper
          nobody has reached simply has no note (ADR-025)
      Superseded:
        label: Re-read
        blurb: a later reading replaced this one, and names it
  theory-statuses:
    label: Explanation statuses
    blurb: Whether the record believes the ACCOUNT, which is not what the same word means on a practice.
      An explanation can be `Rejected` while the thing it explained goes on working exactly as well as
      it ever did (ADR-031).
    alert: Closed. `Rejected` here means the reason is wrong, not the technique; if what you want to retire
      is the technique, that is a status on the practice.
    terms:
      Active:
        label: The current account
        blurb: the best explanation the record holds for why this happens
      Proposed:
        label: Offered
        blurb: stated and plausible, on evidence that is suggestive rather than settling — the document
          says what would settle it
      Deferred:
        label: Not yet judged
        blurb: filed because the question is real; no position taken on the answer
      Rejected:
        label: Disbelieved
        blurb: tested and failed, or contradicted by later work — and the thing it explained may still
          work perfectly well
      Superseded:
        label: Replaced
        blurb: a later account covers the same ground better, and this one names it
  statuses:
    Active:
      blurb: in force — the current answer, and what a citation should normally point at
    Proposed:
      blurb: not in force yet — an open question, so citing it as settled is the thing the report catches
    Deferred:
      blurb: not in force and not being worked on; the question is real and the answer is waiting on something
    Superseded:
      blurb: no longer in force because something replaced it; the successor is named in the field, not
        the prose
    Rejected:
      blurb: no longer in force and nothing replaced it — kept because a rejection is worth being able
        to point at
  adr-tags:
    label: Decision tags
    blurb: 'What a decision is about, in the order the index shows them. Open, unlike the topics: a decision
      that needs a word it does not have simply gets one.'
    terms:
      record:
        label: The record
        blurb: what the schemes hold, and the rules between them
      taxonomy:
        label: Taxonomy
        blurb: the topic vocabulary and what enforces it
      mechanism:
        label: Mechanism
        blurb: identifiers, generation, the lint
      migration:
        label: Migration
        blurb: what moves between this record and the Anthology of the SOTA, and why
  claim-roles:
    label: Voices
    blurb: "Whose voice a CLAIM is in, within the record's own deliberation. Not whether the record believes
      it, which is the status: the two vary independently, and the mismatched pairs are the information
      (ADR-031)."
    alert: Closed. Whether a claim is an objection is not a role; it is an `objects_to` edge. A role says
      on whose behalf the claim is put forward.
    terms:
      thesis:
        label: Thesis
        blurb: the record puts this forward as its own position, and says in `defeated_if` what would
          defeat it
      counter:
        label: Counter
        blurb: put forward on an opponent's behalf, at full strength — a steelman, or an objection anticipated
          as devil's advocate. A counter that goes Active means the record was persuaded, and the thesis
          it opposed needs revisiting
      granted:
        label: Granted
        blurb: a point that cuts against a thesis and that the record accepts; the thesis has to be stated
          so that it survives it. A granted claim that is not Active is incoherent
      disclaimed:
        label: Disclaimed
        blurb: something the record explicitly does not claim — "X does not establish Y" — filed so that
          the boundary has an address and a recurring misreading has somewhere to be pointed
      supposed:
        label: Supposed
        blurb: assumed for the sake of the argument, so everything resting on it is conditional on it.
          May scope a whole work, as an independently warranted agent scopes the will paper
  case-standing:
    label: Case standings
    blurb: How much of a CASE is fact. A case serves claims whatever its standing; what its standing changes
      is what it can show (ADR-031).
    alert: Closed.
    terms:
      documented:
        label: Documented
        blurb: real events, with sources a reader can check
      stipulated:
        label: Stipulated
        blurb: a real referent whose relevant facts are assumed rather than verified here — usable as
          a thought experiment, not as evidence about the referent
      fictional:
        label: Fictional
        blurb: invented, usually to hold fixed what a real case cannot. Shows what is coherent, not what
          is common
  arg-forms:
    label: Argument forms
    blurb: The form of inference an ARG makes, and with it the critical questions that inference has to
      survive (Walton's argumentation schemes). An ARG answers each question in its body or is objected
      to (ADR-031).
    alert: Closed. A form the list lacks is added by decision, with its critical questions in the blurb.
    terms:
      analogy:
        label: Analogy
        blurb: 'what holds of one case holds of another alike in the relevant respect. Critical questions:
          in what respect are they alike, and is that the respect the conclusion needs? What relevant
          difference is there? What transfers, and what does not?'
      contrast:
        label: Controlled contrast
        blurb: 'two cases alike except in one factor differ in outcome, so the factor matters (the method
          of difference). Critical questions: is everything said to be held fixed really fixed? Does changing
          the factor change anything else? Is the case realistic, or only coherent?'
      existence:
        label: Existence proof
        blurb: 'one coherent case shows that two things can come apart. Critical questions: is the case
          coherent? Does it separate the very things the conclusion says can come apart?'
      formal-application:
        label: Application of a formal result
        blurb: 'a theorem or model applied to a new domain. Critical questions: does the mapping premise
          hold? Are the model''s assumptions met in the new domain?'
      generalization:
        label: Generalization from cases
        blurb: 'several cases share a feature, so the kind has it. Critical questions: are the cases representative?
          Is there a counterexample? Is the feature constitutive, or merely common?'
      abduction:
        label: Best explanation
        blurb: 'this account explains the evidence better than its rivals. Critical questions: which
          rivals were considered? Does a rival explain as well? Would more evidence discriminate them?'
      cause-to-effect:
        label: Cause to effect
        blurb: 'this mechanism produces that outcome. Critical questions: is the mechanism operative here?
          Could a confounder produce the same outcome?'
      reductio:
        label: Reductio
        blurb: 'a premise leads to something unacceptable, so the premise goes. Critical questions: is
          the consequence really unacceptable, or merely surprising? Is the premise the one to blame?'
  question-statuses:
    label: Question statuses
    blurb: Where a QUESTION stands. A question is never deleted; it is answered, dissolved or set aside,
      and the record keeps what it was.
    alert: Closed.
    terms:
      Open:
        label: Open
        blurb: being worked on
      Answered:
        label: Answered
        blurb: the record holds an Active claim that answers it
      Dissolved:
        label: Dissolved
        blurb: the question rested on a mistake, and the body says which
      Deferred:
        label: Set aside
        blurb: real, and left for future work
      Superseded:
        label: Reframed
        blurb: replaced by a better-framed question, named in `superseded_by`
  lines:
    label: Lines of inquiry
    blurb: A named line of the record's own argument, so that a line can be set aside as a whole and what
      depends on it can be found. Retracting a line is a status change on its members, never a deletion
      (ADR-031).
    alert: Closed, so that a line is one somebody named.
    terms:
      distributed-agency:
        label: Distributed agency
        blurb: what an organized whole is, and how its operative direction relates to its members' —
          where the essay started
      will-organization:
        label: Will-organization
        blurb: what organizes practical efficacy in an agent, and how that organization becomes precarious
      organizational-affect:
        label: Organizational affect
        blurb: affective states as properties of organized systems, read through Frijda — the line the
          will paper grew out of
      authenticity:
        label: Authenticity and concordance
        blurb: what makes a will-organization the agent's own, and normativity across the scales an agent
          spans. Set aside on 2026-10-05 as future work
  works:
    label: Works
    blurb: A manuscript the record's claims are marshalled into. Membership says a claim is in the work;
      whether the record believes it is the status, and the two disagree (ADR-031).
    alert: Closed. A new manuscript is added here when one starts.
    terms:
      organization-of-will:
        label: The Organization of Will
        blurb: 'the owner''s essay, drafted 2026-10-04 to 2026-10-06: will-organization as the agent-indexed
          organization of practical efficacy, and why effective will is precarious'
issue_url: https://github.com/dmarx/nucleation/issues/{n}
paths:
  docs: docs
  decisions: record/decisions.d
  design_principles: docs/design-principles.md
  reports: docs/reports
schemes:
  LIT:
    dir: record/literature.d
    output: docs/literature
    active: Active
    render: index
    allocate: merge
    alias: LIT-{first_author}-{published:.4}-{number:03d}
    field_groups:
      source:
        fields:
        - arxiv
        - doi
        - url
        require: at-least-one
        unique: true
    references:
      extends:
        label: Carries further
        blurb: the earlier paper this one builds on and could not stand without. Papers fork where the
          DESIGNS differ, practices where the RECOMMENDATIONS do, so a fork can exist at one layer and
          not the other (ADR-011).
        scheme: LIT
        required: false
        many: true
        converse: extended_by
      extended_by:
        label: Carried further by
        blurb: the converse of `extends`, written by `luria link --fix`.
        scheme: LIT
        required: false
        many: true
        converse: extends
      compared_against:
        label: Measured against
        blurb: this paper evaluated itself against that one. Somebody ran the comparison; a shared topic
          is not one (ADR-011).
        scheme: LIT
        required: false
        many: true
        converse: compared_against
      corrects:
        label: Corrects
        blurb: this paper shows the earlier one wrong on something it claimed. Retire by status, never
          by deletion — the body stays.
        scheme: LIT
        required: false
        many: true
        converse: corrected_by
      rivals:
        label: Rival account
        blurb: this paper argues for an account of the same phenomenon that the other paper's account
          excludes, and neither tests or corrects the other. Settled, it becomes `corrects` on the
          winner (ADR-022).
        scheme: LIT
        required: false
        many: true
        converse: rivals
      corrected_by:
        label: Corrected by
        blurb: the converse of `corrects`, written by `luria link --fix`.
        scheme: LIT
        required: false
        many: true
        converse: corrects
      supports:
        label: Cited in support by
        blurb: the record's own claims and arguments that rest on this work without a reading of it, written
          by `luria link --fix` from their `grounds`. A THEORY drawn from the work is the stronger footing
        scheme: [CLAIM, ARG]
        required: false
        many: true
        converse: grounds
      superseded_by:
        scheme:
        - LIT
        - ANTH
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Active
    fields:
      published:
        required: true
      primary_topic:
        derive: '{tags[0]}'
      status:
        vocabulary: lit-statuses
      tags:
        vocabulary: topics
        many: true
        required: true
        closed: true
        groups:
          philosophy:
            label: Philosophy
            blurb: the topics that are philosophical questions — metaphysics, mereology, agency, individuation, ethics, consciousness, cognition, emotion and affect, self, personhood, phenomenal unity, narrative unity, self-governance, philosophy of biology, embodied cognition, free will, phenomenology, social ontology, moral psychology, philosophy of science, epistemology, logic, philosophy of mathematics and philosophy of language. A label over the words, not a rule about how they combine (ADR-003).
            require: any
            tags: [metaphysics, mereology, agency, individuation, ethics, consciousness, cognition, emotion-and-affect, self, personhood, phenomenal-unity, narrative-unity, self-governance, philosophy-of-biology, embodied-cognition, free-will, phenomenology, social-ontology, moral-psychology, philosophy-of-science, epistemology, logic, philosophy-of-mathematics, philosophy-of-language]
          flags:
            label: Curation flags
            blurb: tags that mark a work for a curation decision rather than say what it is about. Carried after the topics, never first (ADR-005).
            require: any
            tags: [anthology-candidate]
    axis: tags
    retires_on: Superseded
    successor: superseded_by
  NOTE:
    dir: record/notes.d
    output: docs/notes
    active: Read
    render: index
    allocate: merge
    uniform_ok: absence of a NOTE means unread (ADR-025), so every filed note is a finished reading; `Unread`
      is reserved for a paper deliberately set aside
    references:
      paper:
        label: Reading of
        blurb: the paper this note is a close reading of. Absence of a note means the paper is unread
          (ADR-025).
        scheme: LIT
        required: true
        many: false
      superseded_by:
        scheme: NOTE
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Read
    fields:
      status:
        vocabulary: note-statuses
      published:
        derive: '{published}'
        from: paper
      primary_topic:
        derive: '{tags[0]}'
        from: paper
      tags:
        derive: '{tags}'
        from: paper
        many: true
    axis: tags
    retires_on: Superseded
    successor: superseded_by
  THEORY:
    dir: record/theory.d
    output: docs/theory
    active: Active
    render: index
    allocate: merge
    references:
      source:
        label: Evidence
        blurb: 'the work this account comes from. Same test as a practice''s: what the explanation could
          not survive losing.'
        scheme: LIT
        required: true
        many: true
      extends:
        label: Carries further
        blurb: the earlier account this one builds on — a refinement or a widening of the same mechanism,
          not a rival one.
        scheme: THEORY
        required: false
        many: true
        converse: extended_by
      extended_by:
        label: Carried further by
        blurb: the converse of `extends`, written by `luria link --fix`.
        scheme: THEORY
        required: false
        many: true
        converse: extends
      rivals:
        label: Rival account
        blurb: another account of the same phenomenon that cannot also be right, where neither yet corrects
          the other. Settled, it becomes `corrects` on the winner and a status on the loser (ADR-022).
        scheme: THEORY
        required: false
        many: true
        converse: rivals
      corrects:
        label: Corrects
        blurb: this account replaces the earlier one's reasoning. What the old account explained may still
          happen; only the reason was wrong.
        scheme: THEORY
        required: false
        many: true
        converse: corrected_by
      corrected_by:
        label: Corrected by
        blurb: the converse of `corrects`, written by `luria link --fix`.
        scheme: THEORY
        required: false
        many: true
        converse: corrects
      presupposes:
        label: Presupposes
        blurb: this account takes the other's conclusion as a premise for a claim about something else.
          If the other falls, this one loses a premise and needs another route; it is not a refinement
          of the same mechanism, which is `extends` (ADR-029).
        scheme: THEORY
        required: false
        many: true
        converse: presupposed_by
      presupposed_by:
        label: Presupposed by
        blurb: the converse of `presupposes`, written by `luria link --fix`.
        scheme: THEORY
        required: false
        many: true
        converse: presupposes
      answers:
        label: Answers
        blurb: a question of the record's own that this account answers, so the question's page shows
          the literature beside the record's claims (ADR-031)
        scheme: QUESTION
        required: false
        many: true
        converse: answered_by
      supports:
        label: Supports
        blurb: the record's own claims and arguments resting on this account, written by `luria link --fix`
          from their `grounds`. Rejecting this account leaves each of them needing another route
        scheme: [CLAIM, ARG]
        required: false
        many: true
        converse: grounds
      superseded_by:
        scheme: THEORY
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Active
    fields:
      promote_when:
        required_when:
          status:
          - Proposed
          - Deferred
      status:
        vocabulary: theory-statuses
      primary_topic:
        derive: '{tags[0]}'
      published:
        derive: '{published}'
        from: source[0]
      tags:
        vocabulary: topics
        many: true
        required: true
        closed: true
    axis: tags
    retires_on: Superseded
    successor: superseded_by
  ADR:
    dir: record/decisions.d
    output: docs/decisions
    active: Active
    render: index
    successor: superseded_by
    retires_on: Superseded
    fields:
      status:
        vocabulary: statuses
      tags:
        vocabulary: adr-tags
        many: true
        required: true
        closed: false
    axis: tags
    references:
      superseded_by:
        scheme: ADR
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Active
  DP:
    dir: record/principles.d
    active: Active
    render: document
    output: docs/design-principles.md
    successor: superseded_by
    retires_on: Superseded
    fields:
      status:
        vocabulary: statuses
      tags:
        many: true
        required: true
        closed: false
    axis: tags
    references:
      superseded_by:
        scheme: DP
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Active
  QUESTION:
    dir: record/questions.d
    output: docs/questions
    active: Open
    render: index
    allocate: merge
    references:
      refines:
        label: Narrows
        blurb: the broader question this one is a part or a sharpening of
        scheme: QUESTION
        required: false
        many: true
        converse: refined_by
      refined_by:
        label: Narrowed by
        blurb: the converse of `refines`, written by `luria link --fix`.
        scheme: QUESTION
        required: false
        many: true
        converse: refines
      answered_by:
        label: Answered by
        blurb: the record's own claims and the literature's accounts that answer it, written by `luria
          link --fix` from their `answers`. Both, on one page, is what synthesis is
        scheme: [CLAIM, THEORY]
        required: false
        many: true
        converse: answers
      superseded_by:
        scheme: QUESTION
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Open
    fields:
      status:
        vocabulary: question-statuses
      tags:
        vocabulary: topics
        many: true
        required: true
        closed: true
      line:
        vocabulary: lines
        required: true
    axis: line
    retires_on: Superseded
    successor: superseded_by
  CLAIM:
    dir: record/claims.d
    output: docs/claims
    active: Active
    render: index
    allocate: merge
    references:
      answers:
        label: Answers
        blurb: the question this claim is an answer to
        scheme: QUESTION
        required: false
        many: true
        converse: answered_by
      rests_on:
        label: Rests on
        blurb: another of the record's own claims this one could not stand without — the spine of the
          argument, walked as the `argument` chain. Retired, it leaves this claim needing another route
          (ADR-031)
        scheme: CLAIM
        required: false
        many: true
        converse: supports
      grounds:
        label: Grounded in
        blurb: evidence from outside the record's own argument — an account it has read (THEORY), a case,
          or a work cited without a reading (LIT), which is the weakest. The split from `rests_on` is
          THEORY's own, between `presupposes` and `source` (ADR-031)
        scheme: [THEORY, CASE, LIT]
        required: false
        many: true
        converse: supports
      supports:
        label: Supports
        blurb: the converse of `rests_on`, written by `luria link --fix`.
        scheme: [CLAIM, ARG]
        required: false
        many: true
        converse: rests_on
      argued_by:
        label: Argued by
        blurb: the arguments concluding this claim, written by `luria link --fix` from their `concludes`.
          Two of them is two independent lines of support
        scheme: ARG
        required: false
        many: true
        converse: concludes
      objects_to:
        label: Objects to
        blurb: the claim this one denies — a rebuttal, or an undermining if that claim is a premise. Walked
          as the `dialectic` chain, so an objection, its reply and the reply to that read as one thread
          (ADR-031)
        scheme: CLAIM
        required: false
        many: true
        converse: objected_by
      objected_by:
        label: Objected to by
        blurb: the converse of `objects_to`, written by `luria link --fix`.
        scheme: CLAIM
        required: false
        many: true
        converse: objects_to
      undercuts:
        label: Undercuts
        blurb: the argument whose inference this claim denies, leaving its premises and its conclusion
          standing
        scheme: ARG
        required: false
        many: true
        converse: undercut_by
      superseded_by:
        label: Superseded by
        blurb: the claim that replaced this one. Declared here rather than left to the built-in, so it has
          a converse and the `revisions` chain can walk how a thesis changed (ADR-031)
        scheme: CLAIM
        required: false
        many: true
        converse: supersedes
      supersedes:
        label: Supersedes
        blurb: the claim this one replaced, written by `luria link --fix` from its `superseded_by`
        scheme: CLAIM
        required: false
        many: true
        converse: superseded_by
      complements:
        label: Complements
        blurb: answers a different part of the same question, so the two belong together rather than
          competing. The relation the record had no word for when three accounts were wrongly set up as
          rivals (ADR-031). Between the record's own claims for now; THEORY joins it once luria reads a
          symmetric relation across schemes correctly (dmarx/luria#358)
        scheme: CLAIM
        required: false
        many: true
        converse: complements
      uses:
        label: Uses the term
        blurb: the TERM this claim is stated in, so that a term's revision finds the claims built on it
        scheme: TERM
        required: false
        many: true
        converse: used_by
      illustrated_by:
        label: Illustrated by
        blurb: the converse of a case's `illustrates`, written by `luria link --fix`.
        scheme: CASE
        required: false
        many: true
        converse: illustrates
      countered_by:
        label: Countered by
        blurb: the converse of a case's `counterexample_to`, written by `luria link --fix`.
        scheme: CASE
        required: false
        many: true
        converse: counterexample_to
    fields:
      status:
        vocabulary: theory-statuses
      role:
        vocabulary: claim-roles
        required: true
      defeated_if:
        required_when:
          role:
          - thesis
        blurb: what would defeat the thesis — a kind of result or argument, stated so that the wrong
          kind cannot satisfy it
      tags:
        vocabulary: topics
        many: true
        required: true
        closed: true
      line:
        vocabulary: lines
        required: true
      works:
        vocabulary: works
        many: true
    axis: line
    retires_on: Superseded
    successor: superseded_by
  CASE:
    dir: record/cases.d
    output: docs/cases
    active: Active
    render: index
    allocate: merge
    references:
      supports:
        label: Supports
        blurb: the claims and arguments grounded in this case, written by `luria link --fix` from their
          `grounds`.
        scheme: [CLAIM, ARG]
        required: false
        many: true
        converse: grounds
      illustrates:
        label: Illustrates
        blurb: a claim this case makes vivid without bearing its weight. Losing the case costs the claim
          an example, not a premise; that is what separates this from `grounds`
        scheme: CLAIM
        required: false
        many: true
        converse: illustrated_by
      counterexample_to:
        label: Counterexample to
        blurb: a claim this case shows false as stated
        scheme: CLAIM
        required: false
        many: true
        converse: countered_by
      variant_of:
        label: Variant of
        blurb: the case this one alters in a stated respect, as Northstar-B alters Northstar-A
        scheme: CASE
        required: false
        many: true
        converse: variants
      variants:
        label: Variants
        blurb: the converse of `variant_of`, written by `luria link --fix`.
        scheme: CASE
        required: false
        many: true
        converse: variant_of
      substitutes_for:
        label: Stands in for
        blurb: the case this one replaces in the argument — usually a fictional company standing in for
          a real one, so the argument does not ride on contested facts about it
        scheme: CASE
        required: false
        many: true
        converse: substituted_by
      substituted_by:
        label: Stood in for by
        blurb: the converse of `substitutes_for`, written by `luria link --fix`.
        scheme: CASE
        required: false
        many: true
        converse: substitutes_for
      superseded_by:
        scheme: CASE
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Active
    fields:
      status:
        vocabulary: statuses
      standing:
        vocabulary: case-standing
        required: true
      tags:
        vocabulary: topics
        many: true
        required: true
        closed: true
      line:
        vocabulary: lines
    axis: tags
    retires_on: Superseded
    successor: superseded_by
  TERM:
    dir: record/terms.d
    output: docs/terms
    active: Active
    render: index
    allocate: merge
    references:
      used_by:
        label: Used by
        blurb: the claims stated in this term, written by `luria link --fix` from their `uses`.
        scheme: CLAIM
        required: false
        many: true
        converse: uses
      superseded_by:
        label: Superseded by
        blurb: the term whose definition replaced this one's (ADR-031)
        scheme: TERM
        required: false
        many: true
        converse: supersedes
      supersedes:
        label: Supersedes
        blurb: the term this one's definition replaced, written by `luria link --fix`
        scheme: TERM
        required: false
        many: true
        converse: superseded_by
    fields:
      status:
        vocabulary: statuses
      tags:
        vocabulary: topics
        many: true
        required: true
        closed: true
      line:
        vocabulary: lines
    axis: tags
    retires_on: Superseded
    successor: superseded_by
  ARG:
    dir: record/arguments.d
    output: docs/arguments
    active: Active
    render: index
    allocate: merge
    references:
      rests_on:
        label: Premises
        blurb: the record's own claims the inference starts from. The premises of one argument work together;
          a claim with two arguments has two independent lines of support
        scheme: CLAIM
        required: false
        many: true
        converse: supports
      grounds:
        label: Grounded in
        blurb: the readings, cases and works the inference starts from, as on a CLAIM
        scheme: [THEORY, CASE, LIT]
        required: false
        many: true
        converse: supports
      concludes:
        label: Concludes
        blurb: the claim the inference arrives at — normally one
        scheme: CLAIM
        required: true
        many: true
        converse: argued_by
      undercut_by:
        label: Undercut by
        blurb: claims denying this inference, written by `luria link --fix` from their `undercuts`.
        scheme: CLAIM
        required: false
        many: true
        converse: undercuts
      superseded_by:
        scheme: ARG
        many: true
        required: false
        required_when:
          status:
          - Superseded
        forbidden_when:
          status:
          - Active
    field_groups:
      premises:
        fields:
        - rests_on
        - grounds
        require: at-least-one
    fields:
      status:
        vocabulary: theory-statuses
      form:
        vocabulary: arg-forms
        required: true
      tags:
        vocabulary: topics
        many: true
        required: true
        closed: true
      line:
        vocabulary: lines
    axis: tags
    retires_on: Superseded
    successor: superseded_by
remotes:
  ARXIV:
    name: arXiv
    uid: (\d{4})[.:](\d{4,5})(v\d+)?
    url: https://arxiv.org/abs/{1}.{2}
    uris:
      title: https://export.arxiv.org/api/query?id_list={1}.{2}
    title_re: <entry>.*?<title>(.*?)</title>
  DOI:
    name: DOI
    uid: 10\.\d{4,9}/[^\s\]\)>,;]+
    delim: ':'
    url: https://doi.org/{uid}
  ANTH:
    name: Anthology of the SOTA
    repo: dmarx/anthology-of-the-sota
    ref: main
    dir: record/literature.d
    schemes:
      LIT:
        dir: record/literature.d
      SOTA:
        dir: record/practices.d
      THEORY:
        dir: record/theory.d
      NOTE:
        dir: record/notes.d
      ADR:
        dir: record/decisions.d
  LU:
    name: luria
    repo: dmarx/luria
    ref: main
    dir: record/decisions.d
    schemes:
      DP:
        document: docs/design-principles.md
  FX:
    name: fixtures
    url: https://github.com/dmarx/luria/blob/main/docs/directives.md#fixture-codes
fragments:
  record/changelog.d: CHANGELOG.md
journals:
  curation:
    dir: record/curation.d
    output: docs/curation
    granularity: month
    title: Curation log
    blurb: Why things entered this record, and why they left for the anthology or anywhere else.
  workbench:
    dir: record/workbench.d
    output: docs/workbench
    granularity: month
    title: Workbench
    blurb: Working sessions on the record's own arguments — what was proposed, objected to, revised, set
      aside and why, dated and never rewritten. The claims hold where the argument stands; this holds how
      it got there (ADR-031).
  devlog:
    dir: record/devlog.d
    output: docs/devlog
    granularity: month
    title: Development log
code:
  globs: []
  historical:
  - CHANGELOG.md
lint:
  fail_on:
  - workflow-temp-codes
  - source-mismatch
  mute:
  - inert-status
  - acknowledged-uniformity
chains:
  lineage:
    scheme: LIT
    relation:
    - extends
    - corrects
    sibling: compared_against
    invariant: tags
    output: docs/lineage.md
    title: Lines of work
  theory:
    scheme: THEORY
    relation:
    - extends
    - corrects
    invariant: tags
    output: docs/theory-lines.md
    title: Lines of explanation
    facet_by:
    - status
  argument:
    scheme: CLAIM
    relation:
    - rests_on
    invariant: line
    output: docs/argument-lines.md
    title: Lines of argument
    blurb: The record's own claims in the order they rest on one another, from what is taken as given
      to what is concluded. A step that crosses from one line of inquiry to another is reported, because
      that is how a line set aside reaches back into one still standing (ADR-031).
    facet_by:
    - status
  dialectic:
    scheme: CLAIM
    relation:
    - objects_to
    output: docs/dialectic.md
    title: Objections and replies
    blurb: Each objection with the reply to it and the reply to that, as one thread. Faceted by voice
      and by credence, so an open objection is a counter still Proposed (ADR-031).
    facet_by:
    - role
    - status
  revisions:
    scheme: CLAIM
    relation:
    - supersedes
    output: docs/revisions.md
    title: How the claims changed
    blurb: Each claim followed by the claims that replaced it, oldest first (ADR-031).
    facet_by:
    - status
  term-revisions:
    scheme: TERM
    relation:
    - supersedes
    output: docs/term-revisions.md
    title: How the terms changed
    blurb: Each definition followed by the definitions that replaced it, oldest first. Most of the drift
      in the exchange that prompted these schemes was here (ADR-031).
    facet_by:
    - status
