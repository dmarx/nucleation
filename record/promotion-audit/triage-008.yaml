triage: triage-008
date: '2026-10-20'
base_revision: d2f2fe48
purpose: 'Narrowing-loss sort. For each THEORY the audit narrowed (narrow-and-promote) or promoted as
  is (promote), each assertion the narrowing dropped, routed by kind: 1 a generalization or stronger thesis
  a source asserts (file a Proposed THEORY, same source, the narrowed Active entry as its evidence); 2
  the record''s own extrapolation or gloss (file a Proposed interpretive CLAIM, ADR-032, ADR-043); 3 a
  mis-statement corrected by exact conditions, or a clause shown false (note only); 4 open scope nobody
  asserts (QUESTION). This is the sort only; nothing is filed here.'
method: 'Hand sort from a digest made by record/promotion-audit/triage_narrowing.py (digest): the last
  Proposed title from git history, the current title, and the decision file''s scope.excluded. Carriers
  are Proposed THEORY/CLAIMs linked by extends, refines or complements. Kind-3 and kind-4 clauses are
  listed briefly; existing QUESTIONs are named only where the decision file names one. suggested_promote_when
  for kinds 1-2 inherits the pre-narrowing promote_when where that tested the wide claim. Six of this
  round''s narrowings (#275-#279) are included from their PR and batch branches.'
