notes_for_ledger:
  - >-
    Triage-005's control: the route flag predicted 2 of 4. It was right on
    both arguments (THEORY-071, -485) and wrong on both measurements
    (THEORY-178, -306), each routed to source and promoted under ADR-047
    v3. Sort by what the title asserts (batch 020). The flag catches
    theorems only.
  - >-
    empirical_hedged scored 0 on both yielders. THEORY-178's measured
    signature is a model ensemble that the title does not name, and
    THEORY-306's contrast (MAE and data2vec) sits in the title's last
    clause. Read 'What was actually shown' for a model run or a table,
    not the title.
  - >-
    Thomas's rule is not enough for synchronous Boolean necessity claims.
    A free negative cycle (a' = ¬b, b' = a, period 4) can be phase-shifted
    by a transient clamp. Beside any other oscillation, that gives a new
    joint attractor with no positive circuit in reach. Check for it
    whenever a Boolean attractor claim says "only through a positive
    circuit". THEORY-178's condition holds in its network only because
    the network has no such oscillator outside the reach of positive
    circuits.
  - >-
    An "explicit in X" clause in an empirical title can be a one-line
    identity (THEORY-306: −H(p̄) = D_KL(p̄ ‖ U) − log K). Check it before
    treating the title as measurement only.
  - >-
    Move THEORY-593, THEORY-071 and THEORY-485 to wave 5: each is an
    argument or conceptual analysis read in full, with nothing to measure
    or re-derive.
