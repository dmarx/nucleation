notes: >-
  A wave-2 split of the THEORY-604 kind. A standard spectral construction is
  bundled with an analytic convergence theorem, and the promote_when tests
  only the theorem. The isometry needs the 1/π weighting in the diffusion
  distance. The new THEORY should state that weighting, since NOTE-784 says
  the paper's formula was not seen and the standard definition was
  assumed. The positive semi-definite hypothesis is used only for λ_j ≥ 0.
  Without it the eigenvalues lie in [−1, 1], and the embedding is still an
  isometry for every m, with signed coordinates λ_j^m ψ_j.
