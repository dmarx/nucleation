    apparently the 1969 edition, encoded cp1251 (decode it explicitly).
    It carries the appendices but not the fold-out schemes.
  - >-
    What was closed. Unpaywall, OpenAlex and Semantic Scholar list no
    open-access copy of: Geisler 1989; Banks, Geisler and Bennett 1987;
    Geisler 1984; Banks, Sekuler and Anderson 1991; Mandelkern, Bounded
    Meaning (2024) and 'Bounded Modality' (2019); Ney 2016 and 2021;
    Bikaraan-Behesht 2021/22. No copy was found for Heim 1990 or Elbourne
    2005 either. The 1968 English Propp at archive.org is
    lending-restricted.
  - >-
    Sources that were blocked. philpapers.org returns 403 and
    PhilSci-Archive fails TLS through the proxy, so philosophy preprints
    are mostly unreachable from a session. cps.utexas.edu redirects to a
    page with no PDFs, and jov.arvojournals.org returns 403. Philosophy and
    vision-science reading tasks for closed works need owner-supplied
    copies; requeueing them unchanged will not help.
  - >-
    Reading the source can narrow a promotable scope even when the clean
    copy is missing. Propp's appendix states that five tabulated tales
    were dropped, partly because their order was not strictly canonical.
    So an order claim checked on the remaining 45 is partly a selection
    effect, and a v3 title must say so.
  - >-
    A source cited as a rival can turn out to argue against the citing
    THEORY's conclusion while still being represented accurately.
    Chalmers and McQueen are LIT-164's "explicit, testable rival", and they
    also argue that collapse is a causal-closure gap. Record both points.
