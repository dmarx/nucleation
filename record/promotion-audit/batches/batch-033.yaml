control_verdict: >-
  The route flag predicted 2 of 4. It was right on both arguments and
  wrong on both measurements: each was routed to source and yielded under
  ADR-047 v3. Batch 020's sort by what the title asserts got all five
  right, the ranked THEORY-593 included (an argument, retained). The
  route flag separates theorems from everything else. It does not
  separate measurements from arguments, and that is the split v3 made
  decisive. Its empirical_hedged component, which was meant to make that
  split, scored 0 on both yielders.
finding: >-
  Since ADR-047 v3, wave 3's source route is no longer one class. Its
  measured results, stated with hedges and read in full, promote once
  their scope is narrowed to the model or study actually run. Its
  arguments and conceptual analyses do not. Both yielders here followed
  THEORY-295's pattern: name the model, or the study, in the title, and
  move the generalization request to a QUESTION. The three arguments were
  all read in full, so reading depth did not separate the outcomes.
recommendation: >-
  Before more wave-3 source-route batches, re-sort the pending source-route
  entries by what the title asserts, by hand or with a measurement flag
  that reads "What was actually shown" for a model run, a table or a
  measured contrast rather than the title's wording. Route the arguments
  to wave 5. triage-005's ranked list is now exhausted.
