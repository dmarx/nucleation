scope:
  accepted: >-
    The title has three parts, and they are sorted separately.

    (A) A reading of the field: "the semantic rate–distortion frameworks
    of 2021–2025" treat meaning as a latent variable with a known joint law
    with the observation. That is a claim about what papers contain. The
    record read two of them in full, Zhao et al. (NOTE-638) and Chai et al.
    (NOTE-605), and each reading supports it for that paper. A third, Liu,
    Zhang and Poor's, is known only through the survey (NOTE-619), and the
    promote_when asks for it, and for one further framework by other
    authors, to be read directly. By analogy with ADR-047 v3 (readings in
    full, the title held to what was read), (A) is narrowed to the two
    papers read. The field-wide form moves to a new QUESTION.

    (B) The KL identity, a derivation of the record's own, re-derived here
    (ADR-047 v2). The promote_when accepts "a second reader's derivation".
      (1) Zhao et al.'s posterior distortion is
          E_{X,Y}[d(p(S|X), p(S|Y))], with S–X–Y Markov.
      (2) Markov gives p(s|x,y) = p(s|x). So, for d = KL,
          E_{X,Y} Σ_s p(s|X) log(p(s|X)/p(s|Y))
          = E_{S,X,Y}[log p(S|X) − log p(S|Y)].
      (3) That is H(S|Y) − H(S|X) = (H(S) − I(S;Y)) − (H(S) − I(S;X))
          = I(S;X) − I(S;Y).
      (4) The rate is min I(X;Y) subject to the expected distortion being at
          most D_p. With no symbolic constraint this is
          min{I(X;Y) : I(S;Y) ≥ I(S;X) − D_p}, the information bottleneck
          with Y as the bottleneck variable.

    (C) The TV bound, also the record's derivation, re-derived.
      (5) For any loss L(a, s) with values in an interval of length at most 1,
          and laws P and Q on S, |E_P L(a,·) − E_Q L(a,·)| ≤ d_TV(P, Q) for
          each action a.
      (6) A difference of minima is at most the largest difference, so
          |min_a E_P L − min_a E_Q L| ≤ sup_a |E_P L − E_Q L| ≤ d_TV(P, Q).
      (7) The receiver that sees Y and acts optimally on p(S|Y) has Bayes
          risk E_Y[min_a E_{p(S|Y)} L], by the tower rule. The one that sees
          X has E_X[min_a E_{p(S|X)} L], which is also E_{X,Y}[…] by
          marginalising. Their difference is E_{X,Y} of the pointwise
          difference in (6). So it is at most E[d_TV(p(S|X), p(S|Y))] ≤ D_p,
          for every such loss at once, at the given prior.
      The bound is on the expected risk. Pointwise, the regret of acting on
      p(S|y) when the posterior is p(S|x) can be up to 2 d_TV. The tower
      step in (7) is what gives d_TV and not 2 d_TV. The body's wording
      ("has Bayes risk at most E[d_TV] above") is the expected form, which
      is correct.
  excluded: >-
    (1) "the frameworks of 2021–2025" as a class, and Liu, Zhang and Poor's
    framework, which the record holds only second-hand. The narrowed title
    names Zhao et al. (2025) and Chai et al. (2023). (2) The promote_when's
    refuter, a framework whose limit depends on a property of meaning
    beyond the joint law, is a question about the wider class, and it moves
    with it. (3) "a uniform bound on lost decision value" is uniform over
    bounded losses, at one prior, and in expectation. The narrowed title
    says "the expected lost value of every bounded-loss decision". (4)
    Zhao et al.'s coding theorems as stated: NOTE-638 found their sequence
    distortion written one way and proved another. The identities are
    single-letter and unaffected, as the body says.
