scope:
  accepted: >-
    Nothing new. Krauska and Lau (2023, LIT-031, read in full in
    NOTE-029) argue that lemma-based production models are lexicalist. On
    three phenomena (Inuktitut, Vietnamese collocations, Hiaki
    suppletion), each argued from a few examples, they argue that
    separating retrieval from structure building fails.
  excluded: >-
    Promotion. The title's "cannot handle" is an impossibility claim made
    by verbal analysis of named models, not proved over a class of
    models. The paper concedes that Eberhard et al. (2005) handle Hiaki
    in part through feature sharing, which is a counterexample to the
    claim as worded. THEORY-588 presupposes THEORY-643, which is Proposed.
    The promote_when asks for an implemented non-lexicalist model tested
    against a lemma model, which is empirical.
