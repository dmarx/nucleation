    Nothing new. The title states Beer's Viable System Model as Beer
    states it in his 1984 retrospective (LIT-752, read in NOTE-577 from a
    reprint missing a page and the figures). The model gives five
    necessary and sufficient subsystems, recursion at every level, and
    characteristic pathologies.
  excluded: >-
    Promotion on any route. It is not a theorem: "only if" is a modelling
    postulate, and Beer himself calls the number five arbitrary, relative
